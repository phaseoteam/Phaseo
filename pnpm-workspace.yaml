packages:
  - "apps/*"
  - "packages/*/*"
  - "examples/ai-sdk-v7-quickstart"

publicHoistPattern:
  - "@electron-forge/*"

# Keep native Android/CMake object paths below Windows' path limits.
virtualStoreDirMaxLength: 32

allowBuilds:
  '@scarf/scarf': false
  core-js: set this to true or false
  electron: true
  es5-ext: set this to true or false
  esbuild: true
  keytar: set this to true or false
  protobufjs: set this to true or false
  puppeteer: set this to true or false
  sharp: set this to true or false
  supabase: set this to true or false
  unrs-resolver: set this to true or false
  workerd: set this to true or false

# Hold dependency installs until versions have been available for 7 days.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@shadcn/react"
  - "cn"
  # Expo SDK releases are coordinated and must resolve as a compatible set.
  - "@expo/*"
  - "babel-preset-expo"
  - "expo"
  - "expo-*"
  - "eslint-config-expo"
  - "jest-expo"
  # React Native patch releases are coordinated with Expo SDK compatibility.
  - "@react-native/*"
  - "react-native"
  - "@next/*"
  - "eslint-config-next"
  - "next"
