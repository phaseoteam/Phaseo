interface:
  display_name: "Phaseo Python SDK"
  short_description: "Build with the phaseo Python client"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-sdk-python to implement this feature with the phaseo Python SDK."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
