name = "phaseo-web-api"
main = "src/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# Workers Cache is checked before this Worker executes. Public responses opt in
# through their Cache-Control headers; account routes remain private/no-store.
[cache]
enabled = true

[vars]
ENV = "production"
SUPABASE_URL = "https://xansbgjaduxypzsmjwct.supabase.co"
PROFILE_AVATARS_PUBLIC_BASE_URL = "https://avatars.phaseo.app"
# Set by deployment environment; kept out of source configuration.
# STAGING_GATEWAY_BASE_URL = "https://<staging-gateway>/v1"

# The minute tick activates scheduled releases promptly. Catalog polling remains
# bounded by each source's next_poll_at, so this does not poll every provider
# every minute.
[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "PROFILE_AVATARS_BUCKET"
bucket_name = "phaseo-profile-avatars"
preview_bucket_name = "phaseo-profile-avatars-preview"

# PR previews deploy this separately named Worker to the account's workers.dev
# subdomain. It deliberately has no phaseo.app route, so it cannot intercept
# production traffic.
[env.staging]
workers_dev = true
preview_urls = true
routes = []

[env.staging.vars]
ENV = "staging"
SUPABASE_URL = "https://xansbgjaduxypzsmjwct.supabase.co"

[[env.staging.r2_buckets]]
binding = "PROFILE_AVATARS_BUCKET"
bucket_name = "phaseo-profile-avatars-preview"

# Anonymous provenance checks are intentionally approximate and scoped per
# Cloudflare location. The upstream OpenAI project remains the spend boundary.
[[ratelimits]]
name = "CONTENT_PROVENANCE_RATE_LIMITER"
namespace_id = "42001"

[ratelimits.simple]
limit = 5
period = 60

# Provider catalog previews and submissions perform bounded but non-trivial
# remote fetches. Scope this limiter by authenticated user in application code.
[[ratelimits]]
name = "PROVIDER_ONBOARDING_RATE_LIMITER"
namespace_id = "42003"

[ratelimits.simple]
limit = 10
period = 60

# SCIM clients retry and burst during directory synchronization. This limit is
# workspace-token scoped in application code and allows the documented 25 rps.
[[ratelimits]]
name = "SCIM_RATE_LIMITER"
namespace_id = "42002"

[ratelimits.simple]
limit = 3000
period = 60

# Cloudflare owns the explicit application API namespaces below. Vercel owns
# page rendering and normal web assets, but no application API handlers.
[[routes]]
pattern = "phaseo.app/api/_web/*"
zone_name = "phaseo.app"

[[routes]]
pattern = "phaseo.app/api/account/*"
zone_name = "phaseo.app"

[[routes]]
pattern = "phaseo.app/api/chat/*"
zone_name = "phaseo.app"

[[routes]]
pattern = "phaseo.app/scim/v2/*"
zone_name = "phaseo.app"

[[routes]]
pattern = "phaseo.app/api/internal/*"
zone_name = "phaseo.app"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
