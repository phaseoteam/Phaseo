name = "phaseo-gateway-staging"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_als"]
workers_dev = true
preview_urls = false
routes = [{ pattern = "api-staging.phaseo.app", custom_domain = true }]

[vars]
ENV = "staging"
GATEWAY_PUBLIC_BASE_URL = "https://api-staging.phaseo.app"
GATEWAY_OPERATION_SAMPLE_RATE = "1"
GATEWAY_CONTEXT_BUNDLE_ENABLED = "true"
GATEWAY_WORKSPACE_RUNTIME_ENABLED = "true"
GATEWAY_FREE_MODEL_QUOTA_ENABLED = "true"
# Capability only: each owner must explicitly opt in through account settings.
GATEWAY_FREE_MODEL_OVERAGE_ENABLED = "true"
GATEWAY_SETTLEMENT_RECOVERY_ENABLED = "true"
GATEWAY_SETTLEMENT_RECOVERY_QUEUE_NAME = "phaseo-gateway-staging-settlement-recovery"
# Shared publication intents must not be acknowledged into staging-only KV.
GATEWAY_WORKSPACE_PUBLICATION_ENABLED = "false"
NODE_ENV = "production"
SUPABASE_URL = "https://xansbgjaduxypzsmjwct.supabase.co"
AMAZON_BEDROCK_REGION = "us-west-2"
AMAZON_BEDROCK_MANTLE_BASE_URL = "https://bedrock-mantle.us-west-2.api.aws"
STATSIG_ENVIRONMENT_TIER = "staging"
ACCOUNT_DELETION_PURGE_ENABLED = "false"
STATSIG_GATEWAY_IO_LOGGING_GATE = "gateway_io_logging"
STATSIG_DATA_CONTRIBUTION_GATE = "gateway_data_contribution"
GATEWAY_IO_LOGS_BUCKET_NAME = "phaseo-gateway-io-logs-preview"
GATEWAY_IO_LOGGING_MAX_BYTES = "5242880"
GATEWAY_IO_RETENTION_BILLING_ENABLED = "false"
DATA_CONTRIBUTIONS_BUCKET_NAME = "phaseo-data-contributions-preview"
DATA_CONTRIBUTIONS_MAX_BYTES = "1048576"
DATA_CONTRIBUTION_CLASSIFIER_ENABLED = "false"
DATA_CONTRIBUTION_CLASSIFIER_LIMIT = "10"
DATA_CONTRIBUTION_CLASSIFIER_CONCURRENCY = "2"
DATA_CONTRIBUTION_CLASSIFIER_MODEL = "gpt-5-mini"
DATA_CONTRIBUTION_CLASSIFIER_SERVICE_TIER = "flex"
DATA_CONTRIBUTION_RETENTION_PRUNE_LIMIT = "250"
MODEL_DISCOVERY_ENABLED = "false"
VIDEO_RECONCILIATION_ENABLED = "true"
VIDEO_RECONCILIATION_LIMIT = "10"
VIDEO_RECONCILIATION_CONCURRENCY = "2"
VIDEO_RECONCILIATION_LEASE_SECONDS = "180"
BATCH_RECONCILIATION_ENABLED = "true"
BATCH_RECONCILIATION_LIMIT = "10"
BATCH_RECONCILIATION_CONCURRENCY = "2"
BATCH_RECONCILIATION_LEASE_SECONDS = "300"
BATCH_API_PREVIEW_PROVIDERS = "openai,anthropic,google-ai-studio,mistral,together"
EMAIL_OUTBOX_DRAIN_ENABLED = "false"
PRICING_MONITOR_ENABLED = "false"
ENTERPRISE_INVOICING_ENABLED = "false"

[triggers]
# This staging deployment shares the production database. Scheduled consumers
# must remain disabled until staging has an isolated database and credentials.
crons = []

[placement]
mode = "smart"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[[kv_namespaces]]
binding = "GATEWAY_CACHE"
id = "4ffdeda1a87c45b38c697f78232526be"

[[r2_buckets]]
binding = "GATEWAY_IO_LOGS_BUCKET"
bucket_name = "phaseo-gateway-io-logs-preview"

[[r2_buckets]]
binding = "DATA_CONTRIBUTIONS_BUCKET"
bucket_name = "phaseo-data-contributions-preview"

[[ratelimits]]
name = "OAUTH_STRICT_RATE_LIMITER"
namespace_id = "41001"

[ratelimits.simple]
limit = 10
period = 60

[[queues.producers]]
binding = "SETTLEMENT_RECOVERY_QUEUE"
queue = "phaseo-gateway-staging-settlement-recovery"

[[queues.producers]]
binding = "SETTLEMENT_RECOVERY_DEAD_LETTER"
queue = "phaseo-gateway-staging-settlement-dead-letter"

[[queues.consumers]]
queue = "phaseo-gateway-staging-settlement-recovery"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
max_retries = 5
dead_letter_queue = "phaseo-gateway-staging-settlement-dead-letter"

[[durable_objects.bindings]]
name = "FREE_MODEL_QUOTA"
class_name = "FreeModelQuotaDurableObject"

[[ratelimits]]
name = "FREE_MODEL_RATE_LIMITER"
namespace_id = "41004"

[ratelimits.simple]
limit = 25
period = 60

[[ratelimits]]
name = "OAUTH_TOKEN_RATE_LIMITER"
namespace_id = "41002"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "PROVIDER_RATE_LIMITS"
class_name = "ProviderRateLimitDurableObject"

[[migrations]]
tag = "v1-provider-rate-limits"
new_sqlite_classes = ["ProviderRateLimitDurableObject"]

[[durable_objects.bindings]]
name = "ROUTING_HEALTH"
class_name = "RoutingHealthDurableObject"

# Preserve staging's applied history, then explicitly retire only the unused
# publication experiment. This migration permanently deletes its staging state.
[[migrations]]
tag = "v2-workspace-request-state"
new_sqlite_classes = ["WorkspaceRequestState"]

[[migrations]]
tag = "v3-routing-health"
new_sqlite_classes = ["RoutingHealthDurableObject"]
deleted_classes = ["WorkspaceRequestState"]

[[migrations]]
tag = "v4-free-model-quota"
new_sqlite_classes = ["FreeModelQuotaDurableObject"]

[[ratelimits]]
name = "REALTIME_RELAY_RATE_LIMITER"
namespace_id = "41003"

[ratelimits.simple]
limit = 60
period = 60
