      parameters:
        - $ref: '#/components/parameters/Offset'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 250
            default: 100
        - name: visibility
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PresetVisibility'
      responses:
        '200':
          description: 预设列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetListResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createPreset
      summary: 创建预设
      description: 创建工作区预设，其中包含持久的提示、路由、参数和插件默认值。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetCreateRequest'
      responses:
        '201':
          description: 预设已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetCreateResponse'
        '400':
          description: 预设无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 预设名称、slug 或发布身份冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}:
    parameters:
      - $ref: '#/components/parameters/PresetId'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getPreset
      summary: 获取预设
      description: 通过 UUID、slug 或规范名称获取活动预设。
      responses:
        '200':
          description: 预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '404':
          description: 未找到预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updatePreset
      summary: 更新预设草稿
      description: 更新草稿元数据或配置，但不更改当前已发布版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetUpdateRequest'
      responses:
        '200':
          description: 预设草稿已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '400':
          description: 预设更新无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 预设名称、slug 或发布身份冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deletePreset
      summary: 归档预设
      description: 可选择先确认确切名称，然后软删除预设。
      parameters:
        - name: confirm_name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 预设已归档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '404':
          description: 未找到预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 预设确认名称不匹配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/PresetId'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listPresetVersions
      summary: 列出预设版本
      description: 按版本降序列出预设不可变的已发布快照。
      responses:
        '200':
          description: 预设版本列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetVersionListResponse'
        '404':
          description: 未找到预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: publishPresetVersion
      summary: 发布预设版本
      description: 使用预设的版本管理方式，将当前草稿发布为新的不可变版本。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetVersionPublishRequest'
      responses:
        '201':
          description: 预设版本已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetVersionResponse'
        '400':
          description: 版本标签无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 草稿没有可发布的更改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/fork:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: forkPreset
      summary: 派生公共预设
      description: 将活动或选定的公共版本复制到管理工作区，作为私有预设。
      parameters:
        - $ref: '#/components/parameters/PresetId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetForkRequest'
      responses:
        '201':
          description: 预设派生副本已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '400':
          description: 所选源版本不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到公共源预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 无法生成唯一的目标名称或 slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/upstream:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: applyPresetUpstreamVersion
      summary: 应用上游预设版本
      description: 将公共上游版本应用到本地派生草稿，但不发布该草稿。
      parameters:
        - $ref: '#/components/parameters/PresetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetUpstreamApplyRequest'
      responses:
        '200':
          description: 上游版本已应用到草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetUpstreamApplyResponse'
        '400':
          description: 必须提供 `version_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到预设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 本地草稿存在更改，或上游版本不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /settings:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getWorkspaceSettings
      summary: 获取工作区设置
      description: 返回工作区可自动化的路由、提供商、隐私和网关默认值。
      responses:
        '200':
          description: 工作区设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceSettings
      summary: 更新工作区设置
      description: 更新工作区的路由、提供商、隐私或网关默认值，并刷新受影响的网关策略缓存。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceSettingsUpdateRequest'
      responses:
        '200':
          description: 工作区设置已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsResponse'
        '400':
          description: 工作区设置无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listDynamicRoutes
      summary: 列出动态路由
      description: 列出工作区的版本化动态路由及其关联的 API 密钥。
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: 动态路由列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteListResponse'
        '400':
          description: 分页参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createDynamicRoute
      summary: 创建动态路由
      description: 创建动态路由及其首个不可变配置版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteCreateRequest'
      responses:
        '201':
          description: 动态路由已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '400':
          description: 动态路由无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 路由名称或 slug 已存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}:
    parameters:
      - $ref: '#/components/parameters/DynamicRouteId'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getDynamicRoute
      summary: 获取动态路由
      description: 返回一个工作区动态路由及其版本和关联的 API 密钥。
      responses:
        '200':
          description: 动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '404':
          description: 未找到动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateDynamicRoute
      summary: 更新动态路由
      description: 更新路由元数据，并在配置更改时创建新的不可变版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteUpdateRequest'
      responses:
        '200':
          description: 动态路由已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '400':
          description: 动态路由无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteDynamicRoute
      summary: 删除动态路由
      description: 永久删除路由，并刷新所有先前关联的 API 密钥上下文。
      parameters:
        - name: confirm_name
          in: query
          required: false
          description: 可选的路由名称精确确认值。
          schema:
            type: string
      responses:
        '200':
          description: 动态路由已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeleteResponse'
        '404':
          description: 未找到动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 路由确认名称不匹配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/keys:
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: replaceDynamicRouteKeys
      summary: 替换动态路由密钥
      description: 以原子方式替换关联的 API 密钥，并刷新受影响的网关上下文。
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteKeysUpdateRequest'
      responses:
        '200':
          description: 已更新关联的 API 密钥
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteKeysResponse'
        '400':
          description: API 密钥列表无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 一个或多个 API 密钥不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/versions/{version}/deploy:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: deployDynamicRouteVersion
      summary: 部署动态路由版本
      description: 激活不可变路由版本，并刷新已关联密钥的上下文。
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
        - $ref: '#/components/parameters/DynamicRouteVersion'
      responses:
        '200':
          description: 路由版本已部署
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeployResponse'
        '400':
          description: 路由版本无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到动态路由或版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer 令牌身份验证
  schemas:
    WorkspaceAppListResponse:
      type: object
      required:
        - data
        - total_count
        - offset
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceApp'
        total_count:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false
    WorkspaceApp:
      type: object
      required:
        - id
        - title
        - app_key
        - category
        - docs_url
        - url
        - image_url
        - is_public
        - is_active
        - is_managed
        - last_seen
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        app_key:
          type: string
        category:
          type: string
          nullable: true
        docs_url:
          type: string
          format: uri
          nullable: true
        url:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        is_public:
          type: boolean
        is_active:
          type: boolean
        is_managed:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        ok:
          type: boolean
          example: false
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          example: error_type
        message:
          type: string
          example: Human-readable error message
        description:
          type: string
          example: Additional error details.
        generation_id:
          type: string
          example: G-abc123
        status_code:
          type: integer
          example: 502
        error_type:
          type: string
          enum:
            - user
            - system
          example: system
        error_origin:
          type: string
          enum:
            - user
            - gateway
            - upstream
          example: upstream
        reason:
          type: string
          example: all_candidates_failed
        attempt_count:
          type: integer
          example: 2
        failed_providers:
          type: array
          items:
            type: string
          example:
            - google-ai-studio
            - openai
        failed_statuses:
          type: array
          items:
            type: integer
          example:
            - 403
            - 429
        upstream_error:
          $ref: '#/components/schemas/ErrorUpstreamError'
        failure_sample:
          type: array
          items:
            $ref: '#/components/schemas/ErrorFailureSampleItem'
        provider_failure_diagnostics:
          $ref: '#/components/schemas/ErrorProviderFailureDiagnostics'
        routing_diagnostics:
          $ref: '#/components/schemas/ErrorRoutingDiagnostics'
        provider_candidate_diagnostics:
          $ref: '#/components/schemas/ErrorProviderCandidateDiagnostics'
        provider_enablement:
          $ref: '#/components/schemas/ErrorProviderEnablementDiagnostics'
        missing_pricing_providers:
          type: array
          items:
            type: string
        provider_payment_required_provider:
          type: string
          example: openai
        provider_payment_required_support_notice:
          type: string
          example: Our upstream provider billing appears to be unavailable. If this persists, contact support.
        details:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ErrorUpstreamError:
      type: object
      properties:
        code:
          type: string
          nullable: true
          example: PERMISSION_DENIED
        message:
          type: string
          nullable: true
          example: The caller does not have permission.
        description:
          type: string
          nullable: true
        param:
          type: string
          nullable: true
    ErrorFailureSampleItem:
      type: object
      properties:
        provider:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        upstream_error_code:
          type: string
          nullable: true
        upstream_error_message:
          type: string
          nullable: true
        upstream_error_description:
          type: string
          nullable: true
        upstream_error_param:
          type: string
          nullable: true
        upstream_payload_preview:
          type: string
          nullable: true
        retryable:
          type: boolean
          nullable: true
      additionalProperties: true
    ErrorProviderFailureDiagnostics:
      type: object
      properties:
        category:
          type: string
          enum:
            - credentials_not_configured
            - credentials_invalid_or_forbidden
            - provider_access_missing
            - region_or_project_restriction
            - model_unavailable_for_endpoint
            - rate_limited
            - server_error
        hint:
          type: string
        provider:
          type: string
          nullable: true
    ErrorRoutingDiagnostics:
      type: object
      properties:
        filterStages:
          type: array
          items:
            type: object
            properties:
              stage:
                type: string
              beforeCount:
                type: integer
              afterCount:
                type: integer
              droppedProviders:
                type: array
                items:
                  type: object
                  properties:
                    providerId:
                      type: string
                      nullable: true
                    reason:
                      type: string
                      nullable: true
                  additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    ErrorProviderCandidateDiagnostics:
      type: object
      properties:
        totalProviders:
          type: integer
        supportsEndpointCount:
          type: integer
        candidateCount:
          type: integer
        droppedUnsupportedEndpoint:
          type: array
          items:
            type: string
        droppedMissingAdapter:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
                nullable: true
              endpoint:
                type: string
                nullable: true
            additionalProperties: true
      additionalProperties: true
    ErrorProviderEnablementDiagnostics:
      type: object
      properties:
        capability:
          type: string
        providersBefore:
          type: array
          items:
            type: string
        providersAfter:
          type: array
          items:
            type: string
        dropped:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
                nullable: true
              reason:
                type: string
                nullable: true
            additionalProperties: true
      additionalProperties: true
    PresetPublisherResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PresetPublisher'
      additionalProperties: false
    PresetPublisher:
      type: object
      required:
        - workspace_id
        - handle
      properties:
        workspace_id:
          type: string
          format: uuid
        handle:
          type: string
          minLength: 3
          maxLength: 40
          nullable: true
      additionalProperties: false
    AudioSpeechRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          type: string
        voice:
          type: string
        speed:
          type: number
          minimum: 0.25
          maximum: 4
        format:
          type: string
          enum:
            - mp3
            - wav
            - ogg
            - aac
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
        config:
          type: object
          additionalProperties: true
          properties:
            elevenlabs:
              type: object
              additionalProperties: true
              properties:
                voice_id:
                  type: string
                language_code:
                  type: string
                output_format:
                  type: string
                voice_settings:
                  type: object
                  additionalProperties: true
                  properties:
                    stability:
                      type: number
                    similarity_boost:
                      type: number
    ProviderRoutingOptions:
      type: object
      description: 用于网关选择的提供商路由偏好设置。
      properties:
        order:
          type: array
          items:
            type: string
        only:
          type: array
          items:
            type: string
        ignore:
