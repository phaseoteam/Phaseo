          type: string
        generate_audio:
          type: boolean
        enhance_prompt:
          type: boolean
        compression_quality:
          type: integer
        person_generation:
          type: string
        resize_mode:
          type: string
        input_references:
          type: array
          description: 用于控制生成的HTTPS图像、音频或视频输入。支持的类型、角色、数量和组合取决于所选模型。提交任务前请检查GET /videos/models。此架构中省略的单数兼容别名input_reference接受multipart图像，或恰好包含file_id或image_url其中一个的对象。支持情况取决于提供商。
          items:
            $ref: '#/components/schemas/VideoInputReference'
        frame_images:
          type: array
          minItems: 1
          maxItems: 2
          description: 首帧／尾帧的HTTPS图像。每个frame_type只能出现一次。不要同时提供input_reference或input_references中的帧角色。
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - frame_type
              - image_url
            properties:
              type:
                type: string
                enum:
                  - image_url
              frame_type:
                type: string
                enum:
                  - first_frame
                  - last_frame
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        provider_params:
          type: object
          additionalProperties: true
          description: 仅限提供商特定扩展。完整请求透传以及重复的路由、提示词、回调或计费字段会被拒绝。
        provider_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: 以规范提供商ID（如atlascloud或byteplus）为键的扩展。仅转发所选提供商的选项。不能与provider_params组合使用。路由、提示词、回调、时长、分辨率和输出数量必须使用经过验证的顶层字段。
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: 工作区管理的活动Webhook端点。其加密且可轮换的签名密钥绝不会存储在视频任务元数据中。
            events:
              type: array
              description: 可选事件订阅。使用通用job.*事件或匹配的video.*事件，如video.status_changed、video.progress或video.completed。省略时使用job.status_changed和终态job.*事件。进度回调需显式包含job.progress或video.progress。提供时，至少一个事件必须适用于视频任务；仅含其他任务类型事件或格式错误的列表会被拒绝。
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: 网关管理的异步Webhook公开投递摘要。用于区分任务执行状态和Webhook投递健康状况。
      properties:
        total_attempts:
          type: integer
          description: 此任务记录的投递尝试总次数。
        delivered_events:
          type: integer
          description: 达到已投递状态的投递键数量。
        delivered_event_types:
          type: array
          description: 至少成功投递一次的投递键。
          items:
            type: string
          example:
            - video.completed
        pending_retries:
          type: integer
          description: 当前安排重试的投递键数量。
        next_retry_at:
          type: string
          nullable: true
          description: 下一次计划重试的ISO时间戳（如有）。
        last_attempt_at:
          type: string
          nullable: true
          description: 最近一次投递尝试的ISO时间戳。
        last_attempt_status:
          type: string
          nullable: true
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
          description: 最近一次投递尝试的结果。
        last_response_status:
          type: integer
          nullable: true
          description: Webhook目标返回的HTTP状态（如可用）。
        last_delivered_at:
          type: string
          nullable: true
          description: 最近一次成功投递的ISO时间戳。
        last_failure_at:
          type: string
          nullable: true
          description: 最近一次失败或正在重试的尝试的ISO时间戳。
        last_error_message:
          type: string
          nullable: true
          description: 最近一次投递错误消息（如可用）。
    AsyncWebhookDeliveryAttempt:
      type: object
      description: 最近一次网关管理的异步Webhook投递尝试。
      properties:
        id:
          type: string
          description: 用于审计和调试的稳定尝试标识符。
        delivery_key:
          type: string
          description: 此事件投递的幂等键。
          example: video.completed
        event_type:
          type: string
          description: 投递到Webhook目标的事件类型。
          example: video.completed
        status:
          type: string
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: 此投递键从1开始的尝试编号。
        max_attempts:
          type: integer
          description: 将投递标记为永久失败之前的最大尝试次数。
        tried_at:
          type: string
          description: 进行此次尝试的ISO时间戳。
        delivered_at:
          type: string
          nullable: true
          description: 此次尝试成功投递的ISO时间戳。
        next_retry_at:
          type: string
          nullable: true
          description: 此次尝试后下一次重试的ISO时间戳（如已安排）。
        response_status:
          type: integer
          nullable: true
          description: Webhook目标返回的HTTP状态（如可用）。
        error_message:
          type: string
          nullable: true
          description: 投递错误消息（如可用）。
        response_body_preview:
          type: string
          nullable: true
          description: Webhook目标响应正文的已脱敏预览。
