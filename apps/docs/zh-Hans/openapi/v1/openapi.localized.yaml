          type: string
          description: 480p、720p、1080p、1K、2K、4K。可与aspect_ratio组合使用。不能与size组合使用。
        aspect_ratio:
          type: string
          description: 宽高比，如16:9、9:16、1:1。可与resolution组合使用。不能与size组合使用。
        seed:
          type: integer
        sample_count:
          type: integer
          minimum: 1
          maximum: 4
