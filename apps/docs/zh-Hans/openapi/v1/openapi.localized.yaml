            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateDynamicRoute
      summary: 更新动态路由
      description: 更新路由元数据，并在配置更改时创建新的不可变版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteUpdateRequest'
      responses:
        '200':
          description: 动态路由已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '400':
          description: 动态路由无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteDynamicRoute
      summary: 删除动态路由
      description: 永久删除路由，并刷新所有先前关联的 API 密钥上下文。
      parameters:
        - name: confirm_name
          in: query
          required: false
          description: 可选的路由名称精确确认值。
          schema:
            type: string
      responses:
        '200':
          description: 动态路由已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeleteResponse'
        '404':
          description: 未找到动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 路由确认名称不匹配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/keys:
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: replaceDynamicRouteKeys
      summary: 替换动态路由密钥
      description: 以原子方式替换关联的 API 密钥，并刷新受影响的网关上下文。
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteKeysUpdateRequest'
      responses:
        '200':
          description: 已更新关联的 API 密钥
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteKeysResponse'
        '400':
          description: API 密钥列表无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到动态路由
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 一个或多个 API 密钥不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/versions/{version}/deploy:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: deployDynamicRouteVersion
      summary: 部署动态路由版本
      description: 激活不可变路由版本，并刷新已关联密钥的上下文。
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
        - $ref: '#/components/parameters/DynamicRouteVersion'
      responses:
        '200':
          description: 路由版本已部署
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeployResponse'
        '400':
          description: 路由版本无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到动态路由或版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listEndpoints
      summary: 列出端点
      description: 列出基于能力的网关端点 ID，并提供其公开路径、模态集合、模型数量、提供商数量和示例模型。
      responses:
        '200':
          description: 端点元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCatalogueResponse'
tags:
  - name: Gateway
    description: Core Phaseo Gateway operations.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer 令牌身份验证
  responses:
    UpstreamRateLimited:
      description: 所选上游提供商对该请求进行了速率限制。
      headers:
        Retry-After:
          description: 提供商验证过的重试等待秒数。
          schema:
            type: integer
            minimum: 0
            maximum: 86400
        X-Phaseo-Upstream-RateLimit-Limit:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Limit-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Limit-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    PublicRequestId:
      description: 服务器生成的公开请求标识符。对于推理请求，它是响应和请求日志中使用的生成 ID。客户端提供的 x-request-id 值不会替换它。
      schema:
        type: string
        pattern: ^G-[0-9A-HJKMNP-TV-Z]{26}$
    UpstreamRateLimitValue:
      description: 仅适用于 BYOK 的提供商配额元数据。使用托管提供商的请求不会返回此字段。
      schema:
        type: string
  parameters:
    DataContributionClassifierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuardrailId:
      name: id
      in: path
      required: true
      description: 护栏标识符。
      schema:
        type: string
        format: uuid
    DynamicRouteId:
      name: id
      in: path
      required: true
      description: 动态路由标识符。
      schema:
        type: string
        format: uuid
    DynamicRouteVersion:
      name: version
      in: path
      required: true
      description: 动态路由的不可变版本。
      schema:
        type: integer
        minimum: 1
    PresetId:
      name: id
      in: path
      required: true
      description: 预设的 UUID、slug 或规范名称。
      schema:
        type: string
    ObservabilityDestinationId:
      name: id
      in: path
      required: true
      description: 可观测性目标标识符。
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      required: false
      description: 要跳过的记录数。
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit100:
      name: limit
      in: query
      required: false
      description: 要返回的记录最大数量。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    WorkspaceId:
      name: id
      in: path
      required: true
      description: 工作区的 UUID 或 slug。
      schema:
        type: string
    WorkspaceJoinRequestId:
      name: request_id
      in: path
      required: true
      description: 加入请求标识符。
      schema:
        type: string
        format: uuid
  schemas:
    ProviderRoutingOptions:
      type: object
      description: 用于网关选择的提供商路由偏好设置。
      properties:
        order:
          type: array
          items:
            type: string
        only:
          type: array
          items:
            type: string
        ignore:
          type: array
          items:
            type: string
        include_alpha:
          type: boolean
          description: 在路由中包含 alpha 提供商（默认关闭）。
        allow_fallbacks:
          type: boolean
          nullable: true
          description: 失败后允许回退到其他符合条件的提供商。
        require_parameters:
          type: boolean
          nullable: true
          description: 路由前要求提供商支持所请求的参数。
        required_execution_region:
          type: string
          nullable: true
          description: 将路由限制为具有所需执行区域的提供商。
        required_data_region:
          type: string
          nullable: true
          description: 将路由限制为具有所需数据区域的提供商。
        require_zero_data_retention:
          type: boolean
          nullable: true
          description: 将路由限制为支持零数据保留的提供商。
        data_collection:
          type: string
          nullable: true
          enum:
            - allow
            - deny
        zdr:
          type: boolean
          nullable: true
        enforce_distillable_text:
          type: boolean
          nullable: true
        quantizations:
          type: array
          nullable: true
          items:
            type: string
        sort:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: 为此请求排列提供商，例如按价格、延迟或吞吐量排序。
        max_price:
          type: object
          properties:
            prompt:
              oneOf:
                - type: number
                - type: string
            completion:
              oneOf:
                - type: number
                - type: string
            image:
              oneOf:
                - type: number
                - type: string
            audio:
              oneOf:
                - type: number
                - type: string
            request:
              oneOf:
                - type: number
                - type: string
        preferred_min_throughput:
          oneOf:
            - type: number
            - type: object
              additionalProperties:
                type: number
        preferred_max_latency:
          oneOf:
            - type: number
            - type: object
              additionalProperties:
                type: number
    DebugOptions:
      type: object
      description: 网关调试控制项。这些标志绝不会转发给提供商。
      properties:
        enabled:
          type: boolean
        return_upstream_request:
          type: boolean
        return_upstream_response:
          type: boolean
        trace:
          type: boolean
        trace_level:
          type: string
          enum:
            - summary
            - full
    CacheControl:
      type: object
      properties:
        type:
          type: string
        ttl:
          type: string
        scope:
          type: string
      additionalProperties: true
    ProviderOptions:
      type: object
      description: 可选的提供商专用选项。
      properties:
        openai:
          type: object
          properties:
