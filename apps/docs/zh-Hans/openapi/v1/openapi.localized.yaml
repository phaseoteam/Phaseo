          nullable: true
        provider_model_slug:
          type: string
          nullable: true
        is_active_gateway:
          type: boolean
        availability_status:
          type: string
          enum:
            - active
            - coming_soon
            - inactive
        availability_reason:
          $ref: '#/components/schemas/GatewayProviderAvailabilityReason'
        provider_status:
          type: string
          enum:
            - active
            - beta
            - alpha
