  /batch/{id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResultsAlias
      summary: Download batch results (alias)
      description: 为已认证工作区拥有的终态批处理，以JSONL流式返回完整的提供商原生结果行。合并成功和错误文件，转换内联输出，并遵循提供商结果分页。请使用Phaseo API密钥。下载不会提交推理或增加使用费用。现有文件端点仍可使用。内联行限制为8 MiB；中断的下载必须丢弃并重新下载。每个工作区每个批处理在滚动30分钟窗口内最多允许10次下载尝试，API密钥和别名共享此限制。失败或取消的上游尝试也计入次数。429响应包含以秒为单位的Retry-After。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 提供商原始JSONL结果
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 批处理预览访问被拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到批处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 批处理结果尚未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 已超出批处理下载限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: 允许再次下载前的秒数
              schema:
                type: integer
        '501':
          description: 此提供商不支持直接下载结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 无法获取提供商结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 下载准入暂时不可用；请在30秒后重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
