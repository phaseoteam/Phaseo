        effective_from:
          type: string
          nullable: true
        effective_to:
          type: string
          nullable: true
        endpoints:
          type: array
          items:
            type: string
        input_modalities:
          type: array
          items:
            type: string
        output_modalities:
          type: array
          items:
            type: string
        params:
          type: array
          items:
            type: string
        supported_parameters:
          type: array
          description: Compatibility alias for params.
          items:
            type: string
        params_detail:
          $ref: '#/components/schemas/SupportedParameterDetails'
        supported_parameters_detail:
          $ref: '#/components/schemas/SupportedParameterDetails'
    SupportedParameterDetails:
      type: object
