openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: 通过兼容 OpenAI 的端点访问各种 AI 模型的网关 API。
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: 全球路由
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: 全球路由
        - url: https://eu.api.phaseo.app/v1
          description: 欧盟区域提供商路由（仅文本）
        - url: https://us.api.phaseo.app/v1
          description: 美国区域提供商路由（仅文本）
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: 列出网关模型
      description: 返回共享且未隐藏的网关模型。默认返回当前可公开路由的模型；使用 `availability=all` 可包含不可路由的可用性记录。
      parameters:
        - name: search
          in: query
          description: 在模型 ID、名称、描述和组织中搜索，不区分大小写。
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: 搜索提供商或模型组织，不区分大小写。
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: 要求支持指定的输入模态。
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: 要求输入上下文至少支持此数量的 token。
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: 每百万输入 token 的最高价格（美元）。
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: 仅返回至少有一个可路由网关服务的模型。
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: 用于对模型发现结果排序的字段。
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: 可选的排序方向。价格默认升序，其他数值默认降序。
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: 按端点筛选
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: 按组织筛选
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: 按提供商 ID 筛选
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: 按提供商推出状态筛选
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: 按提供商路由状态筛选
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: 按模型路由状态筛选
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: 按提供商能力状态筛选
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: 按提供商可用状态筛选
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: 按提供商可用原因筛选
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: 按模型状态筛选
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: 按输入类型筛选
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: '`input_types` 的公共别名。'
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: 按输出类型筛选
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: '`output_types` 的公共别名。'
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: 按参数筛选
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: '`params` 的公共别名。'
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: 可用性筛选器。`active` 仅返回可公开路由的模型；`all` 还包含不可路由的可用性记录。
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: 限制结果数量
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: 分页偏移量
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: 响应格式。默认为 `json`。
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: '`format` 的别名。接受 `json`、`rss` 或 `atom`。'
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML 源
            application/atom+xml:
              schema:
                type: string
                description: Atom XML 源
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: 列出模型端点能力
      description: 返回单个模型的提供商特定端点行，包括公共路径、模态、支持的参数、可用性、路由状态、提供商模型 slug 和端点定价摘要。
      parameters:
        - name: author
          in: path
          required: true
          description: 模型作者或组织段。
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: 模型 slug 段。
          schema:
            type: string
        - name: provider
          in: query
          description: 按提供商 ID 筛选。
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: 按提供商推出状态筛选。
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: 按提供商路由状态筛选。
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: 按模型路由状态筛选。
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: 按提供商能力状态筛选。
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: 按提供商可用状态筛选。
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: 按提供商可用原因筛选。
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: 按模型规范生命周期状态筛选。
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: 按支持的参数名称或别名筛选端点行。
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: '`active` 返回可公开路由的端点行；`all` 还包括即将推出和停用的行。'
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: 模型端点能力行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: 请求参数无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: 未授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 未找到符合所请求可用性和提供商筛选条件的模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/me:
