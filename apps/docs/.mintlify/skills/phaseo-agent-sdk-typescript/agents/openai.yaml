interface:
  display_name: "Phaseo Agent SDK"
  short_description: "Build agent loops with @phaseo/agent-sdk"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-agent-sdk-typescript to build this agent with @phaseo/agent-sdk."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
