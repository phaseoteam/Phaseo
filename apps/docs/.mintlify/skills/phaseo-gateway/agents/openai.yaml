interface:
  display_name: "Phaseo Gateway"
  short_description: "Integrate apps with the Phaseo Gateway"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-gateway to add Phaseo to this project and run a smoke test."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
