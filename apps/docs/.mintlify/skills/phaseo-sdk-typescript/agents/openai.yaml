interface:
  display_name: "Phaseo TypeScript SDK"
  short_description: "Build with the @phaseo/sdk TypeScript client"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-sdk-typescript to implement this feature with @phaseo/sdk."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
