interface:
  display_name: "Phaseo Model Selection"
  short_description: "Choose and pin Phaseo model IDs for a workload"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-model-selection to choose and pin a Phaseo model ID for this workload."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
    - type: "mcp"
      value: "phaseo"
      description: "Phaseo models, pricing and usage"
      transport: "streamable_http"
      url: "https://mcp.phaseo.app/mcp"
