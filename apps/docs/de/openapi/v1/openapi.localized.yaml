openapi: 3.0.3
info:
  title: Phaseo Gateway API
  version: 1.0.0
servers:
  - url: https://api.phaseo.app/v1
    description: Global routing
security:
  - BearerAuth: []
paths:
  /apps:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listWorkspaceApps
      summary: Workspace-Anwendungen auflisten
      description: Listet automatisch zugeordnete Workspace-Anwendungen und ihre bearbeitbaren Metadaten auf. Erfordert die Berechtigung `settings:read`.
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: Workspace-Anwendungen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAppListResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/publisher:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getPresetPublisher
      summary: Öffentlichen Herausgeber-Handle für Presets abrufen
      description: Gibt den kanonischen öffentlichen Publisher-Handle für die Workspace-Presets zurück.
      responses:
        '200':
          description: Herausgeber-Handle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetPublisherResponse'
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: updatePresetPublisher
      summary: Publisher-Kennung für Voreinstellungen aktualisieren
      description: Benennt die Publisher-Kennung des Arbeitsbereichs um und behält die vorherige Kennung als Alias bei.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetPublisherUpdateRequest'
      responses:
        '200':
          description: Publisher-Kennung aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetPublisherResponse'
        '400':
          description: Ungültige Publisher-Kennung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Die Publisher-Kennung ist nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audio/speech:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createSpeech
      summary: Sprachausgabe erzeugen
      description: Erzeugt Audio aus dem eingegebenen Text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioSpeechRequest'
      responses:
        '200':
          description: Audiodatei
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /audio/transcriptions:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createTranscription
      summary: Transkription erstellen
      description: Transkribiert Audio in die Eingabesprache.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranscriptionRequest'
      responses:
        '200':
          description: Transkriptionsantwort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranscriptionResponse'
  /audio/translations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createTranslation
      summary: Übersetzung erstellen
      description: Übersetzt das Audio ins Englische.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranslationRequest'
      responses:
        '200':
          description: Übersetzungsantwort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranslationResponse'
  /images/generations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createImage
      summary: Bild erstellen
      description: Erstellt anhand einer Eingabeaufforderung ein Bild.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesGenerationRequest'
      responses:
        '200':
          description: Bildantwort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesGenerationResponse'
            text/event-stream:
              schema:
                type: string
  /images/edits:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createImageEdit
      summary: Bildbearbeitung erstellen
      description: Erstellt ausgehend von einem Originalbild und einer Eingabeaufforderung ein bearbeitetes oder erweitertes Bild.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImagesEditRequest'
      responses:
        '200':
          description: Antwort zur Bildbearbeitung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesEditResponse'
            text/event-stream:
              schema:
                type: string
  /ocr:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createOcr
      summary: OCR ausführen
      description: Extrahiert mit dem angeforderten Modell Text aus einem Bild.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
      responses:
        '200':
          description: OCR-Antwort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResponse'
  /music/generate:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: generateMusic
      summary: Musik erzeugen
      description: Erzeugt Musik über einen einzelnen anbieterunabhängigen Endpoint. Phaseo wartet auf synchrone Anbieter und übernimmt die Abfrage ihrer Warteschlangen intern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicGenerateRequest'
      responses:
        '200':
          description: Antwort zur Musikgenerierung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicGenerateResponse'
  /endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listEndpoints
      summary: Endpoints auflisten
      description: Listet die auf Funktionen basierenden Gateway-Endpoint-IDs mit öffentlichen Pfaden, Modalitätssammlungen, Modell- und Anbieteranzahlen sowie Beispielmodellen auf.
      responses:
        '200':
          description: Endpoint-Metadaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCatalogueResponse'
  /files:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listFiles
      summary: Dateien auflisten
      description: Gibt mit dem gemeinsam genutzten Gateway-Schlüssel derzeit `not_supported` zurück. Speichere stattdessen die IDs hochgeladener Dateien und rufe sie direkt ab.
      responses:
        '400':
          description: Die Dateiliste wird im aktuellen Gateway-Modus nicht unterstützt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pricing/models:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listPricingModels
      summary: Modellpreise auflisten
      description: Gibt aktive Preiseinträge für Anbieter und Modelle zurück.
      responses:
        '200':
          description: Modellpreisliste
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  models:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '500':
          description: Fehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /moderations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createModeration
      summary: Moderation durchführen
      description: Prüft, ob ein Text gegen die Nutzungsrichtlinien von OpenAI verstößt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationsRequest'
      responses:
        '200':
          description: Moderationsergebnis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationsResponse'
  /embeddings:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createEmbedding
      summary: Embeddings erstellen
      description: Erstellt einen Embedding-Vektor, der den eingegebenen Text repräsentiert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: Embedding-Antwort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
  /rerank:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createRerank
      summary: Dokumente neu ordnen
      description: Ordnet eine Liste von Dokumenten nach ihrer Relevanz für eine Anfrage neu.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: Antwort zur Neusortierung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
  /parse:
    post:
      tags:
        - Gateway
      operationId: createParse
      summary: Dokumentbild analysieren
      description: Verarbeitet ein Dokumentbild zu Markdown oder geordneten Inhaltsblöcken. Die aktuelle Cohere Parse API akzeptiert URLs für entfernte Bilder und base64-kodierte Bilddaten-URIs; PDF- und Datei-URLs werden noch nicht unterstützt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: Analysiertes Dokument
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
  /budgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceBudget
      summary: Workspace-Ausgabenlimit löschen
      description: Entfernt eine Ausgabenobergrenze für den Workspace und setzt die Durchsetzung für dieses Intervall aus.
      responses:
        '200':
          description: Workspace-Budget gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetDeleteResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getWorkspaceBudget
      summary: Workspace-Budget abrufen
      description: Gibt eine Ausgabenobergrenze des Arbeitsbereichs mit aktuellem Verbrauch und verbleibendem Betrag zurück.
      responses:
        '200':
          description: Workspace-Budget
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceBudget
      summary: Workspace-Budget aktualisieren
      description: Ändert den Zeitraum oder die USD-Obergrenze eines bestehenden Workspace-Budgets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceBudgetUpdateInput'
      responses:
        '200':
          description: Workspace-Budget aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /byok/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteProviderCredential
      summary: Anbieterzugangsdaten löschen
      description: Entfernt Anbieterzugangsdaten dauerhaft. Eine wiederholte Löschung ist unbedenklich.
      responses:
        '200':
          description: Anbieterzugangsdaten gelöscht oder bereits nicht vorhanden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialDeleteResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getProviderCredential
      summary: Anbieter-Anmeldedaten abrufen
      description: Gibt sichere Metadaten zurück, ohne verschlüsselte Felder oder das rohe Geheimnis offenzulegen.
      responses:
        '200':
          description: Metadaten der Anbieter-Anmeldedaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateProviderCredential
      summary: Anbieter-Anmeldedaten aktualisieren
      description: Aktualisiert Metadaten, Filter oder Routing-Gruppe der Anmeldedaten oder ersetzt das nur beschreibbare Geheimnis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialUpdateRequest'
      responses:
        '200':
          description: Anbieter-Anmeldedaten aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/departments/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceDepartment
      summary: Workspace-Abteilung löschen
      description: Löscht eine manuell verwaltete Abteilung. Mit einem Verzeichnis synchronisierte Abteilungen können hier nicht gelöscht werden.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Abteilung gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceDepartment
      summary: Arbeitsbereichsabteilung aktualisieren
      description: Aktualisiert Name, Beschreibung, Symbol oder Farbe der Abteilung, ohne ihre Verzeichniszuordnung zu entfernen.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceDepartmentUpdateRequest'
      responses:
        '200':
          description: Abteilung aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDepartmentResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/group-mappings/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceGroupMapping
      summary: Verzeichnis-Gruppenzuordnung löschen
      description: Entfernt eine bereitgestellte Gruppenzuordnung aus dem Workspace.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Gruppenzuordnung gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceGroupMapping
      summary: Verzeichnis-Gruppenzuordnung aktualisieren
      description: Aktualisiert die durch eine Zuordnung festgelegte Zugriffsrolle oder Abteilungsposition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceGroupMappingUpdateRequest'
      responses:
        '200':
          description: Gruppenzuordnung aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGroupMappingResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /data-contribution/classifiers/{id}:
    parameters:
      - $ref: '#/components/parameters/DataContributionClassifierId'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteDataContributionClassifier
      summary: Datenbeitragsklassifikator löschen
      description: Löscht einen benutzerdefinierten Klassifikator. Der integrierte Startklassifikator kann nicht gelöscht werden.
      responses:
        '200':
          description: Klassifikator gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContributionClassifierDeleteResponse'
        default:
          description: Anfrage fehlgeschlagen oder Funktion nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateDataContributionClassifier
      summary: Datenbeitragsklassifizierer aktualisieren
      description: Aktualisiert einen benutzerdefinierten Workspace-Klassifizierer. Erfordert `settings:write` und Funktionszugriff.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataContributionClassifierUpdateRequest'
      responses:
        '200':
          description: Klassifizierer aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContributionClassifierResponse'
        default:
          description: Anfrage fehlgeschlagen oder Funktion nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /oauth-clients/{client_id}:
    parameters:
      - $ref: '#/components/parameters/OAuthClientId'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteOAuthClient
      summary: OAuth-Client löschen
      description: Löscht den Client, nachdem seine aktiven Autorisierungen widerrufen wurden.
      responses:
        '200':
          description: OAuth-Client gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientDeleteResponse'
        default:
          description: Anfrage fehlgeschlagen oder Funktion nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getOAuthClient
      summary: OAuth-Client abrufen
      description: Gibt eine aktive OAuth-Anwendung zurück. Erfordert `oauth_clients:read` und die OAuth-Betafunktion.
      responses:
        '200':
          description: OAuth-Client
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        default:
          description: Anfrage fehlgeschlagen oder Funktion nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateOAuthClient
      summary: OAuth-Client aktualisieren
      description: Aktualisiert Metadaten, Scopes oder Weiterleitungs-URIs der OAuth-Anwendung. `oauth_clients:write` erforderlich.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientUpdateRequest'
      responses:
        '200':
          description: OAuth-Client aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        default:
          description: Anfrage fehlgeschlagen oder Funktion nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook-endpoints/{id}:
    parameters:
      - $ref: '#/components/parameters/WebhookEndpointId'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWebhookEndpoint
      summary: Webhook-Endpoint löschen
      description: Deaktiviert einen Webhook-Endpoint logisch und stoppt künftige Zustellungen. Erfordert `settings:write`.
      responses:
        '200':
          description: Webhook-Endpoint gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointDeleteResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getWebhookEndpoint
      summary: Webhook-Endpoint abrufen
      description: Gibt einen asynchronen Webhook-Endpoint ohne Signaturgeheimnis zurück. Erfordert `settings:read`.
      responses:
        '200':
          description: Webhook-Endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWebhookEndpoint
      summary: Webhook-Endpunkt aktualisieren
      description: Aktualisiert die Zustellungseinstellungen des Endpunkts. `settings:write` erforderlich.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEndpointUpdateRequest'
      responses:
        '200':
          description: Webhook-Endpunkt aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/scim/tokens/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: revokeWorkspaceScimToken
      summary: SCIM-Token widerrufen
      description: Widerruft ein Bereitstellungstoken. Erfordert `settings:write`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token widerrufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        default:
          description: Anfrage fehlgeschlagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /notifications/destinations/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceNotificationDestination
      summary: Benachrichtigungsziel löschen
