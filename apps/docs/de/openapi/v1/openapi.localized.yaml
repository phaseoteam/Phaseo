  /batches/{batch_id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResults
      summary: Batch-Ergebnisse herunterladen
      description: Streamt vollständige anbietereigene Ergebniszeilen als JSONL für einen finalen Batch des authentifizierten Workspaces. Kombiniert Erfolgs- und Fehlerdateien, konvertiert Inline-Ausgaben und folgt der Ergebnispaginierung des Anbieters. Phaseo-API-Schlüssel verwenden. Downloads starten keine Inferenz und erzeugen keine zusätzlichen Nutzungskosten. Bestehende Dateiendpunkte bleiben verfügbar. Inline-Zeilen sind auf 8 MiB begrenzt; abgebrochene Downloads verwerfen und erneut herunterladen. Maximal 10 Downloadversuche pro Workspace und Batch in einem gleitenden 30-Minuten-Fenster, gemeinsam für API-Schlüssel und Aliase. Fehlgeschlagene oder abgebrochene Upstream-Versuche zählen mit. Eine 429-Antwort enthält Retry-After in Sekunden.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Originale JSONL-Ergebnisse des Anbieters
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Zugriff auf Batch-Vorschau verweigert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Batch nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Batch-Ergebnisse sind noch nicht bereit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Batch-Downloadlimit überschritten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Sekunden bis zum nächsten erlaubten Download
              schema:
                type: integer
        '501':
          description: Direkte Ergebnisdownloads werden von diesem Anbieter nicht unterstützt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Anbieterergebnisse konnten nicht abgerufen werden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Downloadzulassung vorübergehend nicht verfügbar; nach 30 Sekunden erneut versuchen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
