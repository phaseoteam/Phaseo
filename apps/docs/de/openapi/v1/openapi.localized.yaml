openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: Eine Gateway-API für den Zugriff auf verschiedene KI-Modelle über OpenAI-kompatible Endpunkte.
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: Globales Routing
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: Globales Routing
        - url: https://eu.api.phaseo.app/v1
          description: Regionales Anbieter-Routing für die EU (nur Text)
        - url: https://us.api.phaseo.app/v1
          description: Regionales Anbieter-Routing für die USA (nur Text)
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: Gateway-Modelle auflisten
      description: Gibt gemeinsam genutzte, nicht ausgeblendete Gateway-Modelle zurück. Standardmäßig werden aktuell öffentlich routbare Modelle angezeigt; mit `availability=all` lassen sich nicht routbare Verfügbarkeitsdatensätze einbeziehen.
      parameters:
        - name: search
          in: query
          description: Suche ohne Beachtung der Groß-/Kleinschreibung in Modell-IDs, Namen, Beschreibungen und Organisationen.
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: Suche nach Anbietern oder Modellorganisationen ohne Beachtung der Groß-/Kleinschreibung.
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: Eine unterstützte Eingabemodalität voraussetzen.
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: Mindestens diese Anzahl an Eingabe-Kontexttokens voraussetzen.
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: Maximaler Eingabetokenpreis in USD pro Million Tokens.
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: Nur Modelle mit mindestens einem routbaren Gateway-Angebot zurückgeben.
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: Feld zum Sortieren der Ergebnisse der Modellerkennung.
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: Optionale Sortierrichtung. Preise werden standardmäßig aufsteigend sortiert, andere Zahlenwerte absteigend.
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: Nach Endpunkten filtern
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: Nach Organisation filtern
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: Nach Anbieter-ID filtern
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Nach Anbieter-Rolloutstatus filtern
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Nach Anbieter-Routingstatus filtern
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Nach Modell-Routingstatus filtern
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Nach Anbieter-Fähigkeitsstatus filtern
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Nach Anbieter-Verfügbarkeitsstatus filtern
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Nach Anbieter-Verfügbarkeitsgrund filtern
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Nach Modellstatus filtern
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: Nach Eingabetypen filtern
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: Öffentlicher Alias für `input_types`.
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: Nach Ausgabetypen filtern
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: Öffentlicher Alias für `output_types`.
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: Nach Parametern filtern
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Öffentlicher Alias für `params`.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: Verfügbarkeitsfilter. `active` gibt nur öffentlich routbare Modelle zurück; `all` umfasst auch nicht routbare Verfügbarkeitsdatensätze.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: Anzahl der Ergebnisse begrenzen
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: Offset für die Paginierung
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: Antwortformat. Standardmäßig `json`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: Alias für `format`. Akzeptiert `json`, `rss` oder `atom`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: Modellliste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: RSS-2.0-XML-Feed
            application/atom+xml:
              schema:
                type: string
                description: Atom-XML-Feed
        '400':
          description: Ungültige Anfrageparameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Fehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: Funktionen der Modellendpunkte auflisten
      description: Gibt anbieterspezifische Endpunktzeilen für ein Modell zurück, einschließlich öffentlicher Pfade, Modalitäten, unterstützter Parameter, Verfügbarkeit, Routingstatus, Anbieter-Modell-Slugs und Preisübersichten der Endpunkte.
      parameters:
        - name: author
          in: path
          required: true
          description: Segment für Modellautor oder Organisation.
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: Modell-Slug-Segment.
          schema:
            type: string
        - name: provider
          in: query
          description: Nach Anbieter-ID filtern.
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Nach Anbieter-Rolloutstatus filtern.
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Nach Anbieter-Routingstatus filtern.
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Nach Modell-Routingstatus filtern.
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Nach Anbieter-Fähigkeitsstatus filtern.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Nach Anbieter-Verfügbarkeitsstatus filtern.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Nach Anbieter-Verfügbarkeitsgrund filtern.
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Nach kanonischem Modell-Lebenszyklusstatus filtern.
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Endpunktzeilen nach unterstützten Parameternamen oder Aliasnamen filtern.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: '`active` gibt öffentlich routbare Endpunktzeilen zurück; `all` umfasst auch demnächst verfügbare und inaktive Zeilen.'
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: Modellendpunkt-Funktionszeilen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: Ungültige Anfrageparameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Für die angeforderten Verfügbarkeits- und Anbieterfilter wurde kein Modell gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Fehler
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/me:
