          description: Erweiterungen nach kanonischer Anbieter-ID (z. B. atlascloud oder byteplus). Nur Optionen des gewählten Anbieters werden weitergeleitet. Nicht mit provider_params kombinierbar. Routing, Prompt, Callback, Dauer, Auflösung und Ausgabeanzahl müssen validierte Felder auf oberster Ebene verwenden.
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: Aktiver, vom Workspace verwalteter Webhook-Endpunkt. Sein verschlüsseltes, austauschbares Signaturgeheimnis wird nie in Videoauftragsmetadaten gespeichert.
            events:
              type: array
              description: Optionale Ereignisabonnements. Generische job.*- oder passende video.*-Ereignisse verwenden, z. B. video.status_changed, video.progress oder video.completed. Ohne Angabe werden job.status_changed und finale job.*-Ereignisse verwendet. Für Fortschritts-Callbacks job.progress oder video.progress ausdrücklich angeben. Mindestens ein angegebenes Ereignis muss für Videoaufträge gültig sein; fehlerhafte Listen oder Listen nur mit Ereignissen anderer Auftragsarten werden abgelehnt.
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: Öffentliche Zustellübersicht für vom Gateway verwaltete asynchrone Webhooks. Damit lässt sich der Ausführungsstatus des Auftrags vom Zustellzustand des Webhooks unterscheiden.
      properties:
        total_attempts:
          type: integer
          description: Gesamtzahl erfasster Zustellversuche für diesen Auftrag.
        delivered_events:
          type: integer
          description: Anzahl der Zustellschlüssel, die den Status zugestellt erreicht haben.
        delivered_event_types:
          type: array
          description: Mindestens einmal zugestellte Zustellschlüssel.
          items:
            type: string
          example:
            - video.completed
        pending_retries:
          type: integer
          description: Anzahl der Zustellschlüssel, für die derzeit ein Wiederholungsversuch geplant ist.
        next_retry_at:
          type: string
          nullable: true
          description: ISO-Zeitstempel des nächsten geplanten Wiederholungsversuchs, sofern vorhanden.
        last_attempt_at:
          type: string
          nullable: true
          description: ISO-Zeitstempel des letzten Zustellversuchs.
        last_attempt_status:
          type: string
          nullable: true
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
          description: Ergebnis des letzten Zustellversuchs.
        last_response_status:
          type: integer
          nullable: true
          description: Vom Webhook-Ziel zurückgegebener HTTP-Status, sofern verfügbar.
        last_delivered_at:
          type: string
          nullable: true
          description: ISO-Zeitstempel der letzten erfolgreichen Zustellung.
        last_failure_at:
          type: string
          nullable: true
          description: ISO-Zeitstempel des letzten fehlgeschlagenen oder erneut versuchten Zustellversuchs.
        last_error_message:
          type: string
          nullable: true
          description: Letzte Zustellfehlermeldung, sofern verfügbar.
    AsyncWebhookDeliveryAttempt:
      type: object
      description: Letzter Zustellversuch eines vom Gateway verwalteten asynchronen Webhooks.
      properties:
        id:
          type: string
          description: Stabile Versuchskennung für Audit und Fehlersuche.
        delivery_key:
          type: string
          description: Idempotenzschlüssel für die Zustellung dieses Ereignisses.
          example: video.completed
        event_type:
          type: string
          description: An das Webhook-Ziel zugestellter Ereignistyp.
          example: video.completed
        status:
          type: string
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: Bei eins beginnende Versuchsnummer für diesen Zustellschlüssel.
        max_attempts:
          type: integer
          description: Maximale Anzahl an Versuchen, bevor die Zustellung als dauerhaft fehlgeschlagen markiert wird.
        tried_at:
          type: string
          description: ISO-Zeitstempel dieses Versuchs.
        delivered_at:
          type: string
          nullable: true
          description: ISO-Zeitstempel der erfolgreichen Zustellung dieses Versuchs.
        next_retry_at:
          type: string
          nullable: true
          description: ISO-Zeitstempel des nächsten Wiederholungsversuchs nach diesem Versuch, sofern geplant.
        response_status:
          type: integer
          nullable: true
          description: Vom Webhook-Ziel zurückgegebener HTTP-Status, sofern verfügbar.
        error_message:
          type: string
          nullable: true
          description: Zustellfehlermeldung, sofern verfügbar.
        response_body_preview:
          type: string
          nullable: true
          description: Vorschau des Antworttexts des Webhook-Ziels mit unkenntlich gemachten sensiblen Daten.
    AsyncWebhookPublicState:
      type: object
      description: Bereinigte asynchrone Webhook-Konfiguration und Zustellstatus. Geheimnisse werden nie zurückgegeben; `has_secret` zeigt an, ob signierte Zustellungen aktiviert sind. Signierte Zustellungen enthalten die Header x-phaseo-signature, x-phaseo-timestamp, x-phaseo-event-id, x-phaseo-event-type, x-phaseo-delivery-key, x-phaseo-attempt und x-phaseo-max-attempts.
