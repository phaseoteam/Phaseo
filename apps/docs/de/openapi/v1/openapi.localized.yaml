          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: ID des vom Workspace verwalteten Webhook-Endpunkts.
            events:
              type: array
              description: Optionale Ereignisabonnements. Generische job.*- oder passende batch.*-Ereignisse verwenden, z. B. batch.progress oder batch.completed. Ohne Angabe werden finale job.*-Ereignisse verwendet. Für Fortschritts-Callbacks zur Anfragezahl job.progress oder batch.progress ausdrücklich angeben. Mindestens ein angegebenes Ereignis muss für Batch-Aufträge gültig sein; fehlerhafte Listen oder Listen nur mit Ereignissen anderer Auftragsarten werden abgelehnt.
