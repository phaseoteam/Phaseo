      x-beta: true
      tags:
        - Gateway
      operationId: listBatchModels
      summary: Fähigkeiten von Batch-Modellen auflisten
      description: Gibt datenbankgestützte Metadaten zu Batch-Modell-/Anbieterfähigkeiten zurück, einschließlich unterstützter Parameter wie erlaubter Eingabeendpunkte und Abschlusszeitfenster.
      parameters:
        - name: params
          in: query
          required: false
          description: Optionaler Filter unterstützter Parameter. Parameter wiederholen oder kommagetrennte Liste übergeben. Kanonische Namen und Aliase werden akzeptiert, z. B. `endpoint`, `request_endpoint`, `completion_window` oder `window`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: Liste der Batch-Modellfähigkeiten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchModelsResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /batches/capabilities:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listBatchCapabilities
      summary: Fähigkeiten von Batch-Anbietern auflisten
      description: Gibt die anbieterseitige Unterstützung für Batch-Eingabemodi per Datei-Upload und Anfrage-Liste zurück.
      responses:
        '200':
          description: Liste der Batch-Anbieterfähigkeiten
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchProviderCapability'
  /batches/files:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listBatchFiles
      summary: Batch-Dateien auflisten
      description: Gibt einen Fehler zurück, da das Auflisten von Dateien gemeinsamer Gateway-Schlüssel nicht unterstützt wird. Eigene Workspace-Dateien stattdessen direkt per ID abrufen.
      responses:
        '400':
          description: Auflisten von Dateien wird nicht unterstützt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: uploadBatchFile
      summary: Batch-Datei hochladen
      description: Lädt eine Anbieterdatei zur Stapelverarbeitung hoch und speichert den Besitz im authentifizierten Workspace. `model` übergeben, damit Phaseo den Anbieter ableiten kann. Ohne `model` und `provider` wird OpenAI verwendet.
      parameters:
        - name: model
          in: query
          required: false
          description: Modell-ID zum Ableiten des Anbieters der Batch-Datei.
          schema:
            $ref: '#/components/schemas/ModelId'
        - name: provider
          in: query
          required: false
          description: Erweiterte Anbieterüberschreibung für den Datei-Upload.
          schema:
            type: string
            enum:
              - openai
              - groq
              - together
              - mistral
        - name: x-phaseo-provider
          in: header
          required: false
          description: Header-Alternative zum Abfrageparameter `provider`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          description: Metadaten der hochgeladenen Datei
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fehler des vorgeschalteten Anbieters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
