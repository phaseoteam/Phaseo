            - responses
    ApiKey:
      type: object
      required:
        - id
        - hash
        - workspace_id
        - name
        - label
        - prefix
        - status
        - disabled
        - soft_blocked
        - scopes
        - creator_user_id
        - include_byok_in_limit
        - limit
        - limit_reset
        - limit_remaining
