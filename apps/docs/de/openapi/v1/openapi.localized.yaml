  /analytics:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getActivityAlias
      summary: Workspace-Analysen abrufen
      description: Gibt Kosten-, Anfrage- und Tokenaggregate nach Datum, Modell, Anbieter und Endpunkt für die letzten 30 abgeschlossenen UTC-Tage zurück.
      parameters:
        - name: date
          in: query
          description: Nach einem einzelnen UTC-Datum der letzten 30 abgeschlossenen Tage filtern (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: label_key
          in: query
          description: Anfragelabel-Schlüssel für die Ausgabenauswertung. Muss zusammen mit label_value angegeben werden.
          schema:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9_.:-]{1,64}$
        - name: label_value
          in: query
          description: Anfragelabel-Wert für die Ausgabenauswertung. Muss zusammen mit label_key angegeben werden.
          schema:
            type: string
            maxLength: 256
        - name: key_id
          in: query
          description: Nach API-Schlüsselkennung filtern.
          schema:
            type: string
        - name: end_user_id
          in: query
          description: Nach anwendungsdefinierter Endbenutzerkennung filtern.
          schema:
            type: string
            maxLength: 256
        - name: model
          in: query
          description: Nach kanonischem Slug des angefragten oder gerouteten Modells filtern.
          schema:
            $ref: '#/components/schemas/ModelId'
        - name: provider
          in: query
          description: Nach Anbieter-Slug filtern.
          schema:
            type: string
            maxLength: 128
        - name: endpoint
          in: query
          description: Nach Gateway-Endpunktkennung filtern.
          schema:
            type: string
            maxLength: 128
        - name: byok
          in: query
          description: Verwalteten oder BYOK-Datenverkehr filtern.
          schema:
            type: boolean
        - name: success
          in: query
          description: Erfolgreiche oder fehlgeschlagene Anfragen filtern.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Offset'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: Abgerufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          description: Fehlerhafte Anfrage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Zugriffsverweigerungsfehler
          content:
