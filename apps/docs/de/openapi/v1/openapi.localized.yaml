        - usage_weekly
        - usage_monthly
        - limits
        - usage_details
        - created_by
        - created_at
        - updated_at
        - last_used_at
        - expires_at
      properties:
        id:
          type: string
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        hash:
          type: string
          example: a3f5b7c9d8e1f23456789abcdeffedcba9876543210fedcba1234567890abcdef
        workspace_id:
          type: string
          format: uuid
          example: 22222222-2222-4222-8222-222222222222
        name:
          type: string
          nullable: true
          example: Analytics Service Key
        label:
          type: string
          nullable: true
          example: Analytics Service Key
        prefix:
          type: string
          nullable: true
          example: phaseo_v1_sk_abcd1234
        status:
          type: string
          nullable: true
          example: active
        disabled:
          type: boolean
          example: false
        soft_blocked:
          type: boolean
          example: false
        scopes:
          $ref: '#/components/schemas/ApiKeyScopeValue'
        creator_user_id:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true
          example: user_abc123
        created_at:
          type: string
          format: date-time
          nullable: true
          example: 2026-04-28T12:00:00Z
        updated_at:
          type: string
          format: date-time
          nullable: true
          example: 2026-04-28T12:15:00Z
        last_used_at:
          type: string
          format: date-time
          nullable: true
          example: 2026-04-28T12:30:00Z
        expires_at:
          type: string
          format: date-time
          nullable: true
          example: 2027-12-31T23:59:59Z
        include_byok_in_limit:
          type: boolean
          description: Gibt an, ob Anbieter-Anmeldedaten auf das Ausgabenlimit des Schlüssels angerechnet werden. Derzeit immer false.
        limit:
          type: number
          nullable: true
          description: Aktives Ausgabenlimit in USD.
        limit_reset:
          type: string
          nullable: true
          enum:
            - daily
            - weekly
            - monthly
        limit_remaining:
          type: number
          nullable: true
        usage:
          type: number
        usage_daily:
          type: number
        usage_weekly:
          type: number
        usage_monthly:
          type: number
        limits:
          $ref: '#/components/schemas/ApiKeyLimitWindows'
        usage_details:
          $ref: '#/components/schemas/ApiKeyUsageWindows'
      additionalProperties: false
