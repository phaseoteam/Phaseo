          description: Bestätigter Routenname stimmt nicht überein
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/keys:
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: replaceDynamicRouteKeys
      summary: Schlüssel dynamischer Route ersetzen
      description: Ersetzt API-Schlüsselzuweisungen atomar und aktualisiert die betroffenen Gateway-Kontexte.
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteKeysUpdateRequest'
      responses:
        '200':
          description: API-Schlüsselzuweisungen aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteKeysResponse'
        '400':
          description: Ungültige API-Schlüsselliste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dynamische Route nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ein oder mehrere API-Schlüssel sind nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/versions/{version}/deploy:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: deployDynamicRouteVersion
      summary: Version einer dynamischen Route bereitstellen
      description: Aktiviert eine unveränderliche Routenversion und aktualisiert die Kontexte der angehängten Schlüssel.
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
        - $ref: '#/components/parameters/DynamicRouteVersion'
      responses:
        '200':
          description: Routenversion bereitgestellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeployResponse'
        '400':
          description: Ungültige Routenversion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dynamische Route oder Version nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listEndpoints
      summary: Endpoints auflisten
      description: Listet die auf Funktionen basierenden Gateway-Endpoint-IDs mit öffentlichen Pfaden, Modalitätssammlungen, Modell- und Anbieteranzahlen sowie Beispielmodellen auf.
      responses:
        '200':
          description: Endpoint-Metadaten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCatalogueResponse'
