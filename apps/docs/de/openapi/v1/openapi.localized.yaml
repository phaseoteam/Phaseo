      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetCreateRequest'
      responses:
        '201':
          description: Voreinstellung erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetCreateResponse'
        '400':
          description: Ungültige Voreinstellung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Konflikt bei Voreinstellungsname, Slug oder Veröffentlichungsidentität
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}:
    parameters:
      - $ref: '#/components/parameters/PresetId'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getPreset
      summary: Voreinstellung abrufen
      description: Ruft eine aktive Voreinstellung anhand von UUID, Slug oder kanonischem Namen ab.
      responses:
        '200':
          description: Voreinstellung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '404':
          description: Voreinstellung nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updatePreset
      summary: Entwurf einer Voreinstellung aktualisieren
      description: Aktualisiert Entwurfsmetadaten oder -konfiguration, ohne die aktive veröffentlichte Version zu ändern.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetUpdateRequest'
      responses:
        '200':
          description: Voreinstellungsentwurf aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '400':
          description: Ungültige Aktualisierung der Voreinstellung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Voreinstellung nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Konflikt bei Voreinstellungsname, Slug oder Veröffentlichungsidentität
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deletePreset
      summary: Voreinstellung archivieren
      description: Löscht eine Voreinstellung logisch, nachdem optional der genaue Name bestätigt wurde.
      parameters:
        - name: confirm_name
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Voreinstellung archiviert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        '404':
          description: Voreinstellung nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Bestätigungsname der Voreinstellung stimmt nicht überein
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/PresetId'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listPresetVersions
      summary: Versionen der Voreinstellung auflisten
      description: Listet unveränderliche veröffentlichte Snapshots einer Voreinstellung in absteigender Versionsreihenfolge auf.
      responses:
        '200':
          description: Versionsliste der Voreinstellung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetVersionListResponse'
        '404':
          description: Voreinstellung nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: publishPresetVersion
      summary: Eine Voreinstellungsversion veröffentlichen
      description: Veröffentlicht den aktuellen Entwurf nach der Versionsmethode der Voreinstellung als neue unveränderliche Version.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetVersionPublishRequest'
      responses:
        '201':
          description: Voreinstellungsversion veröffentlicht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetVersionResponse'
        '400':
          description: Ungültige Versionsbezeichnung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Voreinstellung nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Keine Entwurfsänderungen zum Veröffentlichen vorhanden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/fork:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: forkPreset
      summary: Öffentliche Voreinstellung abzweigen
      description: Kopiert die aktive oder ausgewählte öffentliche Version als private Voreinstellung in den Management-Arbeitsbereich.
      parameters:
        - $ref: '#/components/parameters/PresetId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetForkRequest'
      responses:
        '201':
          description: Abzweigung der Voreinstellung erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '400':
          description: Die ausgewählte Quellversion ist nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Öffentliche Quellvoreinstellung nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ein eindeutiger Zielname oder Slug konnte nicht erstellt werden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/upstream:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: applyPresetUpstreamVersion
      summary: Eine Upstream-Version der Voreinstellung anwenden
      description: Wendet eine öffentliche Upstream-Version auf einen lokalen Fork-Entwurf an, ohne ihn zu veröffentlichen.
      parameters:
        - $ref: '#/components/parameters/PresetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetUpstreamApplyRequest'
      responses:
        '200':
          description: Upstream-Version auf Entwurf angewendet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetUpstreamApplyResponse'
        '400':
          description: '`version_id` ist erforderlich'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Voreinstellung nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Der lokale Entwurf enthält Änderungen oder die Upstream-Version ist nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /settings:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getWorkspaceSettings
      summary: Arbeitsbereichseinstellungen abrufen
      description: Gibt automatisierbare Standardwerte des Arbeitsbereichs für Routing, Anbieter, Datenschutz und Gateway zurück.
      responses:
        '200':
          description: Arbeitsbereichseinstellungen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceSettings
      summary: Arbeitsbereichseinstellungen aktualisieren
      description: Aktualisiert Routing-, Anbieter-, Datenschutz- oder Gateway-Standardwerte des Arbeitsbereichs und aktualisiert betroffene Gateway-Richtlinien-Caches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceSettingsUpdateRequest'
      responses:
        '200':
          description: Arbeitsbereichseinstellungen aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsResponse'
        '400':
          description: Ungültige Arbeitsbereichseinstellungen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listDynamicRoutes
      summary: Dynamische Routen auflisten
      description: Listet versionierte dynamische Routen des Arbeitsbereichs und ihre angehängten API-Schlüssel auf.
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: Liste dynamischer Routen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteListResponse'
        '400':
          description: Ungültige Paginierung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Nicht autorisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createDynamicRoute
      summary: Dynamische Route erstellen
      description: Erstellt eine dynamische Route mit ihrer ersten unveränderlichen Konfigurationsversion.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteCreateRequest'
      responses:
        '201':
          description: Dynamische Route erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '400':
          description: Ungültige dynamische Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Routenname oder Slug ist bereits vorhanden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}:
    parameters:
      - $ref: '#/components/parameters/DynamicRouteId'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getDynamicRoute
      summary: Dynamische Route abrufen
      description: Gibt eine dynamische Route des Arbeitsbereichs mit Versionen und angehängten API-Schlüsseln zurück.
      responses:
        '200':
          description: Dynamische Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '404':
          description: Dynamische Route nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateDynamicRoute
      summary: Dynamische Route aktualisieren
      description: Aktualisiert Routemetadaten und erstellt bei Konfigurationsänderungen eine neue unveränderliche Version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteUpdateRequest'
      responses:
        '200':
          description: Dynamische Route aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '400':
          description: Ungültige dynamische Route
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dynamische Route nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteDynamicRoute
      summary: Dynamische Route löschen
      description: Löscht eine Route dauerhaft und aktualisiert alle zuvor angehängten API-Schlüsselkontexte.
      parameters:
        - name: confirm_name
          in: query
          required: false
          description: Optionale Bestätigung des exakten Routennamens.
          schema:
            type: string
      responses:
        '200':
          description: Dynamische Route gelöscht
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeleteResponse'
        '404':
          description: Dynamische Route nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Bestätigter Routenname stimmt nicht überein
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/keys:
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: replaceDynamicRouteKeys
      summary: Schlüssel dynamischer Route ersetzen
      description: Ersetzt API-Schlüsselzuweisungen atomar und aktualisiert die betroffenen Gateway-Kontexte.
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteKeysUpdateRequest'
      responses:
        '200':
          description: API-Schlüsselzuweisungen aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteKeysResponse'
        '400':
          description: Ungültige API-Schlüsselliste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dynamische Route nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ein oder mehrere API-Schlüssel sind nicht verfügbar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/versions/{version}/deploy:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: deployDynamicRouteVersion
      summary: Version einer dynamischen Route bereitstellen
      description: Aktiviert eine unveränderliche Routenversion und aktualisiert die Kontexte der angehängten Schlüssel.
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
        - $ref: '#/components/parameters/DynamicRouteVersion'
      responses:
        '200':
          description: Routenversion bereitgestellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeployResponse'
        '400':
          description: Ungültige Routenversion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Dynamische Route oder Version nicht gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Authentifizierung mit Bearer-Token
  schemas:
    WorkspaceAppListResponse:
      type: object
      required:
        - data
        - total_count
        - offset
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceApp'
        total_count:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false
    WorkspaceApp:
      type: object
      required:
        - id
        - title
        - app_key
        - category
        - docs_url
        - url
        - image_url
        - is_public
        - is_active
        - is_managed
        - last_seen
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        app_key:
          type: string
        category:
          type: string
          nullable: true
        docs_url:
          type: string
          format: uri
          nullable: true
        url:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        is_public:
          type: boolean
        is_active:
          type: boolean
        is_managed:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        ok:
          type: boolean
          example: false
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          example: error_type
        message:
          type: string
          example: Human-readable error message
        description:
          type: string
          example: Additional error details.
        generation_id:
          type: string
          example: G-abc123
        status_code:
          type: integer
          example: 502
        error_type:
          type: string
          enum:
            - user
            - system
          example: system
        error_origin:
          type: string
          enum:
            - user
            - gateway
            - upstream
          example: upstream
        reason:
          type: string
          example: all_candidates_failed
        attempt_count:
          type: integer
          example: 2
        failed_providers:
          type: array
          items:
            type: string
          example:
            - google-ai-studio
            - openai
        failed_statuses:
          type: array
          items:
            type: integer
          example:
            - 403
            - 429
        upstream_error:
          $ref: '#/components/schemas/ErrorUpstreamError'
        failure_sample:
          type: array
          items:
            $ref: '#/components/schemas/ErrorFailureSampleItem'
        provider_failure_diagnostics:
          $ref: '#/components/schemas/ErrorProviderFailureDiagnostics'
        routing_diagnostics:
          $ref: '#/components/schemas/ErrorRoutingDiagnostics'
        provider_candidate_diagnostics:
          $ref: '#/components/schemas/ErrorProviderCandidateDiagnostics'
        provider_enablement:
          $ref: '#/components/schemas/ErrorProviderEnablementDiagnostics'
        missing_pricing_providers:
          type: array
          items:
            type: string
        provider_payment_required_provider:
          type: string
          example: openai
        provider_payment_required_support_notice:
          type: string
          example: Our upstream provider billing appears to be unavailable. If this persists, contact support.
        details:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ErrorUpstreamError:
      type: object
      properties:
        code:
          type: string
          nullable: true
          example: PERMISSION_DENIED
        message:
          type: string
          nullable: true
          example: The caller does not have permission.
        description:
          type: string
          nullable: true
        param:
          type: string
          nullable: true
    ErrorFailureSampleItem:
      type: object
      properties:
        provider:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        upstream_error_code:
          type: string
          nullable: true
        upstream_error_message:
          type: string
          nullable: true
        upstream_error_description:
          type: string
          nullable: true
        upstream_error_param:
          type: string
          nullable: true
        upstream_payload_preview:
          type: string
          nullable: true
        retryable:
          type: boolean
          nullable: true
      additionalProperties: true
    ErrorProviderFailureDiagnostics:
      type: object
      properties:
        category:
          type: string
          enum:
            - credentials_not_configured
            - credentials_invalid_or_forbidden
            - provider_access_missing
            - region_or_project_restriction
            - model_unavailable_for_endpoint
            - rate_limited
            - server_error
        hint:
          type: string
        provider:
          type: string
          nullable: true
    ErrorRoutingDiagnostics:
      type: object
      properties:
        filterStages:
          type: array
          items:
            type: object
            properties:
              stage:
                type: string
              beforeCount:
                type: integer
              afterCount:
                type: integer
              droppedProviders:
                type: array
                items:
                  type: object
                  properties:
                    providerId:
                      type: string
                      nullable: true
                    reason:
                      type: string
                      nullable: true
                  additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    ErrorProviderCandidateDiagnostics:
      type: object
      properties:
        totalProviders:
          type: integer
        supportsEndpointCount:
          type: integer
        candidateCount:
          type: integer
        droppedUnsupportedEndpoint:
          type: array
          items:
            type: string
        droppedMissingAdapter:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
                nullable: true
              endpoint:
                type: string
                nullable: true
            additionalProperties: true
      additionalProperties: true
    ErrorProviderEnablementDiagnostics:
      type: object
      properties:
        capability:
          type: string
        providersBefore:
          type: array
          items:
            type: string
        providersAfter:
          type: array
          items:
            type: string
        dropped:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
                nullable: true
              reason:
                type: string
                nullable: true
            additionalProperties: true
      additionalProperties: true
    PresetPublisherResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PresetPublisher'
      additionalProperties: false
    PresetPublisher:
      type: object
      required:
        - workspace_id
        - handle
      properties:
        workspace_id:
          type: string
          format: uuid
        handle:
          type: string
          minLength: 3
          maxLength: 40
          nullable: true
      additionalProperties: false
    AudioSpeechRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          type: string
        voice:
          type: string
        speed:
          type: number
          minimum: 0.25
          maximum: 4
        format:
          type: string
          enum:
            - mp3
            - wav
            - ogg
            - aac
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
        config:
          type: object
          additionalProperties: true
          properties:
            elevenlabs:
              type: object
              additionalProperties: true
              properties:
                voice_id:
                  type: string
                language_code:
                  type: string
                output_format:
                  type: string
                voice_settings:
                  type: object
                  additionalProperties: true
                  properties:
                    stability:
                      type: number
                    similarity_boost:
                      type: number
    ProviderRoutingOptions:
      type: object
      description: Anbieterrouting-Präferenzen für die Auswahl durch das Gateway.
      properties:
        order:
          type: array
          items:
            type: string
        only:
          type: array
          items:
            type: string
        ignore:
          type: array
          items:
            type: string
        include_alpha:
          type: boolean
          description: Alpha-Anbieter in das Routing einbeziehen (standardmäßig deaktiviert).
        allow_fallbacks:
          type: boolean
          nullable: true
          description: Nach einem Fehler auf einen anderen geeigneten Anbieter ausweichen.
        require_parameters:
          type: boolean
          nullable: true
          description: Vor dem Routing die Unterstützung der angeforderten Parameter durch den Anbieter voraussetzen.
        required_execution_region:
          type: string
          nullable: true
          description: Das Routing auf Anbieter mit der angeforderten Ausführungsregion beschränken.
        required_data_region:
          type: string
          nullable: true
          description: Das Routing auf Anbieter mit der angeforderten Datenregion beschränken.
        require_zero_data_retention:
          type: boolean
          nullable: true
          description: Das Routing auf Anbieter beschränken, die keine Datenspeicherung unterstützen.
        data_collection:
