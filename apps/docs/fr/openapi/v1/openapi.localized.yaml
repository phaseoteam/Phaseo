  schemas:
    ProviderRoutingOptions:
      type: object
      description: Préférences de routage des fournisseurs pour la sélection par la passerelle.
      properties:
        order:
          type: array
          items:
            type: string
        only:
          type: array
          items:
            type: string
        ignore:
          type: array
          items:
            type: string
        include_alpha:
          type: boolean
          description: Inclure les fournisseurs alpha dans le routage (désactivé par défaut).
        allow_fallbacks:
          type: boolean
          nullable: true
          description: Autoriser le repli vers un autre fournisseur éligible après un échec.
        require_parameters:
          type: boolean
          nullable: true
          description: Exiger la prise en charge des paramètres demandés par le fournisseur avant le routage.
        required_execution_region:
          type: string
          nullable: true
          description: Limiter le routage aux fournisseurs disposant de la région d’exécution demandée.
        required_data_region:
          type: string
          nullable: true
          description: Limiter le routage aux fournisseurs disposant de la région de données demandée.
        require_zero_data_retention:
          type: boolean
          nullable: true
          description: Limiter le routage aux fournisseurs qui prennent en charge la conservation nulle des données.
        data_collection:
