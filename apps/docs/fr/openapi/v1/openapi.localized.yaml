  /analytics:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getActivityAlias
      summary: Obtenir les analyses de l’espace de travail
      description: Renvoie les agrégats de coût, de requêtes et de tokens regroupés par date, modèle, fournisseur et endpoint pour les 30 derniers jours UTC complets.
      parameters:
        - name: date
          in: query
          description: Filtre sur une seule date UTC parmi les 30 derniers jours complets (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: label_key
          in: query
          description: Clé d’étiquette de requête à inclure dans la ventilation des dépenses. Doit être fournie avec label_value.
          schema:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9_.:-]{1,64}$
        - name: label_value
          in: query
          description: Valeur d’étiquette de requête à inclure dans la ventilation des dépenses. Doit être fournie avec label_key.
          schema:
            type: string
            maxLength: 256
        - name: key_id
          in: query
          description: Filtre par identifiant de clé API.
          schema:
            type: string
        - name: end_user_id
          in: query
          description: Filtre par identifiant d’utilisateur final défini par l’application.
          schema:
            type: string
            maxLength: 256
        - name: model
          in: query
          description: Filtre par slug canonique du modèle demandé ou utilisé lors du routage.
          schema:
            $ref: '#/components/schemas/ModelId'
        - name: provider
          in: query
          description: Filtre par slug du fournisseur.
          schema:
            type: string
            maxLength: 128
        - name: endpoint
          in: query
          description: Filtre par identifiant d’endpoint de la passerelle.
          schema:
            type: string
            maxLength: 128
        - name: byok
          in: query
          description: Filtre le trafic géré ou BYOK.
          schema:
            type: boolean
        - name: success
          in: query
          description: Filtre les requêtes réussies ou échouées.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Offset'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: Récupéré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          description: Erreur de requête incorrecte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Erreur d’accès interdit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur interne du serveur
