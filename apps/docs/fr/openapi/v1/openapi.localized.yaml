      x-beta: true
      tags:
        - Gateway
      operationId: listTeamModels
      summary: Lister les modèles de la passerelle propres à l’équipe
      description: Renvoie la liste des modèles de passerelle propres à l’équipe. Par défaut, seuls les modèles actuellement routables publiquement sont renvoyés ; utilisez `availability=all` pour inclure les états de disponibilité non routables.
      parameters:
        - name: endpoints
          in: query
          description: Filtrer par points de terminaison
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: Filtrer par organisation
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: Filtrer par ID du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Filtrer par état de déploiement du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrer par état de routage du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrer par état de routage du modèle
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Filtrer par état des capacités du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Filtrer par état de disponibilité du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Filtrer par motif de disponibilité du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Filtrer par état du modèle
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: Filtrer par types d’entrée
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: Filtrer par types de sortie
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: Filtrer par paramètres
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: Filtre de disponibilité. `active` renvoie uniquement les modèles routables publiquement ; `all` inclut les états de disponibilité non routables.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: Limiter le nombre de résultats
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: Décalage pour la pagination
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: Format de réponse. `json` est utilisé par défaut.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: Alias de `format`. Accepte `json`, `rss` ou `atom`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: Liste des modèles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: Flux XML RSS 2.0
            application/atom+xml:
              schema:
                type: string
                description: Flux XML Atom
        '400':
          description: Paramètres de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listProviders
      summary: Lister les fournisseurs
      description: Renvoie la liste des fournisseurs d’API disponibles.
      parameters:
        - name: limit
          in: query
          description: Limiter le nombre de résultats
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: Décalage pour la pagination
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Liste des fournisseurs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 25
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
        '500':
          description: Erreur
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
  /generations:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getGeneration
      summary: Récupérer une génération
      description: Récupère une génération précise à partir de son ID.
      parameters:
        - name: id
          in: query
          required: true
          description: ID de la génération
          schema:
            type: string
      responses:
        '200':
          description: Données de la génération
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  reason:
                    type: string
        '404':
          description: Introuvable
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
  /chat/completions:
    post:
      servers:
        - url: https://api.phaseo.app/v1
          description: Routage mondial
        - url: https://eu.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs de l’UE (texte uniquement)
        - url: https://us.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs des États-Unis (texte uniquement)
      tags:
        - Gateway
      operationId: createChatCompletion
      summary: Créer une complétion de chat
      description: Crée une complétion pour le message de chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
            examples:
              datetimeServerTool:
                summary: Built-in datetime server tool
                value:
                  model: openai/gpt-5-nano
                  stream: false
                  messages:
                    - role: user
                      content: What is the current datetime in Europe/London?
                  tools:
                    - type: gateway:datetime
                      parameters:
                        timezone: Europe/London
                  tool_choice: auto
      responses:
        '200':
          description: Réponse de complétion de chat
          headers:
            x-request-id:
              $ref: '#/components/headers/PublicRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
        '429':
          $ref: '#/components/responses/UpstreamRateLimited'
  /responses:
    post:
      servers:
        - url: https://api.phaseo.app/v1
          description: Routage mondial
        - url: https://eu.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs de l’UE (texte uniquement)
        - url: https://us.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs des États-Unis (texte uniquement)
      tags:
        - Gateway
      operationId: createResponse
      summary: Créer une réponse
      description: Crée une réponse à l’aide de Responses API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
            examples:
              datetimeServerTool:
                summary: Built-in datetime server tool
                value:
                  model: openai/gpt-5-nano
                  stream: false
                  input:
                    - role: user
                      content: Give me the current datetime in Asia/Tokyo.
                  tools:
                    - type: gateway:datetime
                      parameters:
                        timezone: Asia/Tokyo
                  tool_choice: auto
      responses:
        '200':
          description: Réponse
          headers:
            x-request-id:
              $ref: '#/components/headers/PublicRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
        '429':
          $ref: '#/components/responses/UpstreamRateLimited'
  /async/{kind}/{id}/ws:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: openAsyncJobWebSocket
      summary: Open async job websocket
      description: |
        Opens a persistent websocket session for owned async batch or video job updates.
        WebSocket handshake uses HTTP GET upgrade semantics and returns `101 Switching Protocols` on success (not `200`). The socket emits a `job.snapshot` immediately after upgrade and subsequent `job.updated` envelopes when the normalized async job payload changes.
        If `close_on_terminal` is enabled, the gateway closes the socket after a terminal `completed`, `failed`, `cancelled`, or `expired` update.
      parameters:
        - name: kind
          in: path
          required: true
          description: Async job kind.
          schema:
            type: string
            enum:
              - batch
              - video
        - name: id
          in: path
          required: true
          description: Gateway-owned async job id.
          schema:
            type: string
        - name: interval_ms
          in: query
          required: false
          description: Polling interval used by the websocket recovery loop.
          schema:
            type: integer
            minimum: 1000
            maximum: 10000
            default: 2500
        - name: close_on_terminal
          in: query
          required: false
          description: Close the socket after a terminal lifecycle update.
          schema:
            type: boolean
            default: true
      responses:
        '101':
          description: WebSocket upgrade accepted.
          x-websocket:
            clientEvent:
              $ref: '#/components/schemas/AsyncJobWebSocketClientEvent'
            serverEvent:
              $ref: '#/components/schemas/AsyncJobWebSocketServerEvent'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Async job not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '426':
          description: WebSocket upgrade required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobWebSocketUpgradeRequiredResponse'
  /messages:
    post:
      servers:
        - url: https://api.phaseo.app/v1
          description: Routage mondial
        - url: https://eu.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs de l’UE (texte uniquement)
        - url: https://us.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs des États-Unis (texte uniquement)
      tags:
        - Gateway
      operationId: createAnthropicMessage
      summary: Créer un message
      description: Crée un message à l’aide de l’API Anthropic Messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessagesRequest'
            examples:
              datetimeServerTool:
                summary: Built-in datetime server tool
                value:
                  model: anthropic/claude-sonnet-4
                  max_tokens: 512
                  stream: false
                  messages:
                    - role: user
                      content: What time is it in America/New_York right now?
                  tools:
                    - type: gateway:datetime
                      parameters:
                        timezone: America/New_York
                  tool_choice:
                    type: auto
      responses:
        '200':
          description: Réponse du message
          headers:
            x-request-id:
              $ref: '#/components/headers/PublicRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessagesResponse'
            text/event-stream:
              schema:
                type: string
  /embeddings:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createEmbedding
      summary: Créer des embeddings
      description: Crée un vecteur d’embedding qui représente le texte fourni.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: Réponse des embeddings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
  /moderations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createModeration
      summary: Effectuer une modération
      description: Détermine si le texte enfreint les règles d’utilisation d’OpenAI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationsRequest'
      responses:
        '200':
          description: Résultat de modération
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationsResponse'
