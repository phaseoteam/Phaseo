      schema:
        type: string
        pattern: ^G-[0-9A-HJKMNP-TV-Z]{26}$
    UpstreamRateLimitValue:
      description: Métadonnées de quota du fournisseur, uniquement pour BYOK. Omission pour les requêtes utilisant un fournisseur géré.
      schema:
        type: string
  parameters:
