      summary: Prendre des décisions structurées
      description: 'Pour les nouveaux appels, utilisez le format compatible OpenAI : input contient du texte ou des messages utilisateur avec des éléments input_image intégrés, et questions est une liste ordonnée de questions predicate, choice ou score. Les réponses conservent cet ordre et les noms facultatifs. Les valeurs booléennes restent booléennes. Les URL d’images hébergées ne sont pas prises en charge ; Luna accepte jusqu’à 128 images intégrées, les autres fournisseurs ayant leurs propres limites. Le détail explicite des images et safety_identifier nécessitent une route OpenAI. Le format historique avec state, des questions nommées, noul et criteria reste disponible et renvoie un objet de réponses. Together Tev nécessite ce format car il renvoie des étiquettes sans probabilités. Les exemples historiques restent valides.'
