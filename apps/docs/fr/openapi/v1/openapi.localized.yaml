          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: ID d’endpoint webhook géré par l’espace de travail.
            events:
              type: array
              description: Abonnements facultatifs aux événements. Utilisez les événements génériques job.* ou les événements batch.* correspondants, par exemple batch.progress ou batch.completed. Par défaut, les événements finaux job.* sont utilisés. Incluez explicitement job.progress ou batch.progress pour les callbacks de progression du nombre de requêtes. Si la liste est fournie, au moins un événement doit être valide pour les tâches par lots ; les listes mal formées ou ne contenant que des événements d’un autre type sont rejetées.
