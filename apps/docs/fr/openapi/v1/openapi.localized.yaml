        model:
          type: string
          description: ID du modèle utilisé pour déduire le fournisseur du lot. Les lignes de requête peuvent aussi inclure body.model ; le modèle de premier niveau est prioritaire.
        prompts:
          type: array
          description: Format abrégé de prompt simple. Phaseo compile chaque prompt en ligne de lot native du fournisseur pour le modèle choisi.
          items:
            type: string
        items:
          type: array
          description: Format abrégé de prompt structuré. Les éléments peuvent inclure `id`, `custom_id`, `prompt`, `messages`, `input`, `system`, `max_tokens`, `temperature` ou un `body` avancé.
          items:
            type: object
            additionalProperties: true
        system:
          type: string
          description: Instruction système facultative appliquée aux lignes de prompts abrégés.
        max_tokens:
          type: integer
          description: Limite maximale facultative de tokens appliquée aux lignes de prompts abrégés.
        temperature:
          type: number
          description: Température d’échantillonnage facultative appliquée aux lignes de prompts abrégés.
        input_file_id:
          type: string
          description: ID d’un fichier existant du fournisseur pour créer un lot par téléversement de fichier.
        requests:
          type: array
          description: Lignes avancées de requêtes par lots. Fournissez exactement un champ parmi `prompts`, `items`, `requests` et `input_file_id`.
          items:
            $ref: '#/components/schemas/BatchRequestItem'
        endpoint:
          type: string
          enum:
            - /v1/chat/completions
            - /v1/responses
            - /v1/messages
            - /v1/embeddings
            - /v1/generateContent
          description: Format de requête côté client. Toutes les requêtes d’un lot utilisent cet endpoint. Si omis, Phaseo choisit une valeur par défaut native du fournisseur selon le modèle.
