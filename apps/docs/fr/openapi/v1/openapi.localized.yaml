openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: Une API de passerelle pour accéder à divers modèles d’IA via des points de terminaison compatibles avec OpenAI.
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: Routage mondial
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: Routage mondial
        - url: https://eu.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs de l’UE (texte uniquement)
        - url: https://us.api.phaseo.app/v1
          description: Routage régional vers les fournisseurs des États-Unis (texte uniquement)
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: Lister les modèles de la passerelle
      description: Renvoie les modèles partagés et visibles de la passerelle. Par défaut, seuls les modèles actuellement routables publiquement sont renvoyés ; utilisez `availability=all` pour inclure les états de disponibilité non routables.
      parameters:
        - name: search
          in: query
          description: Recherche insensible à la casse dans les identifiants, noms et descriptions des modèles et les organisations.
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: Recherche insensible à la casse de fournisseurs ou d’organisations de modèles.
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: Exiger une modalité d’entrée prise en charge.
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: Exiger au moins ce nombre de tokens de contexte d’entrée.
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: Prix maximal en USD par million de tokens d’entrée.
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: Renvoyer uniquement les modèles ayant au moins une offre routable du gateway.
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: Champ utilisé pour trier les résultats de découverte des modèles.
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: Sens de tri facultatif. Les prix sont triés par ordre croissant par défaut ; les autres valeurs numériques par ordre décroissant.
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: Filtrer par points de terminaison
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: Filtrer par organisation
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: Filtrer par ID du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Filtrer par état de déploiement du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrer par état de routage du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrer par état de routage du modèle
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Filtrer par état des capacités du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Filtrer par état de disponibilité du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Filtrer par motif de disponibilité du fournisseur
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Filtrer par état du modèle
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: Filtrer par types d’entrée
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: Alias public de `input_types`.
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: Filtrer par types de sortie
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: Alias public de `output_types`.
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: Filtrer par paramètres
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Alias public de `params`.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: Filtre de disponibilité. `active` renvoie uniquement les modèles routables publiquement ; `all` inclut les états de disponibilité non routables.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: Limiter le nombre de résultats
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: Décalage pour la pagination
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: Format de réponse. `json` est utilisé par défaut.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: Alias de `format`. Accepte `json`, `rss` ou `atom`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: Liste des modèles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: Flux XML RSS 2.0
            application/atom+xml:
              schema:
                type: string
                description: Flux XML Atom
        '400':
          description: Paramètres de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: Lister les capacités des points de terminaison du modèle
      description: Renvoie les lignes de points de terminaison propres au fournisseur pour un modèle, avec les chemins publics, les modalités, les paramètres pris en charge, la disponibilité, l’état de routage, les slugs des modèles fournisseur et les récapitulatifs tarifaires des points de terminaison.
      parameters:
        - name: author
          in: path
          required: true
          description: Segment correspondant à l’auteur ou à l’organisation du modèle.
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: Segment slug du modèle.
          schema:
            type: string
        - name: provider
          in: query
          description: Filtrer par ID du fournisseur.
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Filtrer par état de déploiement du fournisseur.
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrer par état de routage du fournisseur.
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrer par état de routage du modèle.
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Filtrer par état des capacités du fournisseur.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Filtrer par état de disponibilité du fournisseur.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Filtrer par motif de disponibilité du fournisseur.
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Filtrer par état canonique du cycle de vie du modèle.
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Filtrer les lignes de points de terminaison par nom de paramètre pris en charge ou par alias.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: '`active` renvoie les lignes de points de terminaison routables publiquement ; `all` inclut aussi celles à venir et inactives.'
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: Lignes de capacités des points de terminaison du modèle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: Paramètres de requête invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Aucun modèle ne correspond aux filtres de disponibilité et de fournisseur demandés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erreur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/me:
