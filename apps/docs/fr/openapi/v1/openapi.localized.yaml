    VideoGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        duration:
          type: integer
          description: Durée souhaitée en secondes (selon le fournisseur/modèle).
        input_video_duration:
          type: number
          format: double
          minimum: 0
          maximum: 3600
          exclusiveMinimum: true
          description: Durée de la vidéo source en secondes. Obligatoire si le fournisseur facture cette durée séparément de la sortie générée.
        input_audio_duration:
          type: number
          format: double
          minimum: 2
          maximum: 20
          description: Durée déclarée de l’audio source en secondes, utilisée pour valider la plage du fournisseur. Les fournisseurs qui ne communiquent pas une consommation faisant autorité peuvent facturer selon leur durée d’entrée maximale prise en charge.
        size:
          type: string
          description: Dimensions explicites (par exemple 1280x720). Incompatible avec resolution ou aspect_ratio.
        resolution:
          type: string
          description: 480p, 720p, 1080p, 1K, 2K, 4K. Compatible avec aspect_ratio. Incompatible avec size.
        aspect_ratio:
          type: string
          description: Format d’image tel que 16:9, 9:16 ou 1:1. Compatible avec resolution. Incompatible avec size.
        seed:
          type: integer
        sample_count:
          type: integer
          minimum: 1
          maximum: 4
        negative_prompt:
          type: string
        generate_audio:
          type: boolean
        enhance_prompt:
          type: boolean
        compression_quality:
          type: integer
        person_generation:
          type: string
        resize_mode:
          type: string
        input_references:
          type: array
          description: Entrées HTTPS d’image, d’audio ou de vidéo conditionnant la génération. Les types, rôles, nombres et combinaisons pris en charge dépendent du modèle choisi. Consultez GET /videos/models avant d’envoyer une tâche. L’alias de compatibilité au singulier input_reference, absent de ce schéma, accepte une image multipart ou un objet contenant exactement un champ parmi file_id et image_url. La prise en charge dépend du fournisseur.
          items:
            $ref: '#/components/schemas/VideoInputReference'
        frame_images:
          type: array
          minItems: 1
          maxItems: 2
          description: Images HTTPS de la première/dernière image. Chaque frame_type ne peut apparaître qu’une fois. Ne fournissez pas également input_reference ou de rôles d’image dans input_references.
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - frame_type
              - image_url
            properties:
              type:
                type: string
                enum:
                  - image_url
              frame_type:
                type: string
                enum:
                  - first_frame
                  - last_frame
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        provider_params:
          type: object
          additionalProperties: true
          description: Extensions propres au fournisseur uniquement. La transmission intégrale de la requête et les doublons de champs de routage, prompt, callback ou facturation sont rejetés.
        provider_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: Extensions indexées par ID canonique du fournisseur (par exemple atlascloud ou byteplus). Seules les options du fournisseur choisi sont transmises. Incompatible avec provider_params. Le routage, prompt, callback, la durée, résolution et le nombre de sorties doivent utiliser les champs de premier niveau validés.
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: Endpoint webhook actif géré par l’espace de travail. Son secret de signature chiffré et renouvelable n’est jamais stocké dans les métadonnées de la tâche vidéo.
            events:
              type: array
              description: Abonnements facultatifs aux événements. Utilisez les événements génériques job.* ou les événements video.* correspondants, par exemple video.status_changed, video.progress ou video.completed. Par défaut, job.status_changed et les événements finaux job.* sont utilisés. Incluez explicitement job.progress ou video.progress pour les callbacks de progression. Si la liste est fournie, au moins un événement doit être valide pour les tâches vidéo ; les listes mal formées ou ne contenant que des événements d’un autre type sont rejetées.
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: Résumé public de livraison des webhooks asynchrones gérés par la passerelle. Permet de distinguer l’état d’exécution de la tâche de la santé de livraison du webhook.
      properties:
        total_attempts:
          type: integer
          description: Nombre total de tentatives de livraison enregistrées pour cette tâche.
        delivered_events:
          type: integer
          description: Nombre de clés de livraison ayant atteint l’état livré.
        delivered_event_types:
          type: array
          description: Clés de livraison livrées au moins une fois.
          items:
            type: string
          example:
            - video.completed
        pending_retries:
          type: integer
          description: Nombre de clés de livraison actuellement programmées pour une nouvelle tentative.
        next_retry_at:
          type: string
          nullable: true
          description: Horodatage ISO de la prochaine tentative programmée, le cas échéant.
        last_attempt_at:
          type: string
          nullable: true
          description: Horodatage ISO de la tentative de livraison la plus récente.
        last_attempt_status:
          type: string
          nullable: true
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
          description: Résultat de la tentative de livraison la plus récente.
        last_response_status:
          type: integer
          nullable: true
          description: Statut HTTP renvoyé par la destination du webhook, si disponible.
        last_delivered_at:
          type: string
          nullable: true
          description: Horodatage ISO de la livraison réussie la plus récente.
        last_failure_at:
          type: string
          nullable: true
          description: Horodatage ISO de la tentative échouée ou en cours de nouvelle tentative la plus récente.
        last_error_message:
          type: string
          nullable: true
          description: Message d’erreur de livraison le plus récent, si disponible.
    AsyncWebhookDeliveryAttempt:
      type: object
      description: Tentative récente de livraison d’un webhook asynchrone géré par la passerelle.
      properties:
        id:
          type: string
          description: Identifiant stable de tentative pour l’audit et le débogage.
        delivery_key:
          type: string
          description: Clé d’idempotence pour la livraison de cet événement.
          example: video.completed
        event_type:
          type: string
          description: Type d’événement livré à la destination du webhook.
          example: video.completed
        status:
          type: string
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: Numéro de tentative pour cette clé de livraison, à partir de un.
        max_attempts:
          type: integer
          description: Nombre maximal de tentatives avant de marquer la livraison comme définitivement échouée.
        tried_at:
          type: string
          description: Horodatage ISO de cette tentative.
        delivered_at:
          type: string
          nullable: true
          description: Horodatage ISO de la livraison réussie de cette tentative.
        next_retry_at:
          type: string
          nullable: true
          description: Horodatage ISO de la prochaine tentative après celle-ci, si programmée.
        response_status:
          type: integer
          nullable: true
          description: Statut HTTP renvoyé par la destination du webhook, si disponible.
        error_message:
          type: string
          nullable: true
          description: Message d’erreur de livraison, si disponible.
        response_body_preview:
          type: string
          nullable: true
          description: Aperçu du corps de réponse de la destination du webhook avec données sensibles masquées.
    AsyncWebhookPublicState:
      type: object
      description: Configuration nettoyée du webhook asynchrone et état de livraison. Les secrets ne sont jamais renvoyés ; `has_secret` indique si les livraisons signées sont activées. Les livraisons signées incluent les en-têtes x-phaseo-signature, x-phaseo-timestamp, x-phaseo-event-id, x-phaseo-event-type, x-phaseo-delivery-key, x-phaseo-attempt et x-phaseo-max-attempts.
      properties:
        url:
          type: string
          format: uri
          nullable: true
        events:
          type: array
          items:
            type: string
        has_secret:
          type: boolean
        delivery:
          $ref: '#/components/schemas/AsyncWebhookDeliverySummary'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AsyncWebhookDeliveryAttempt'
    VideoGenerationResponse:
