  /batches/{batch_id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResults
      summary: Télécharger les résultats du lot
      description: Diffuse les lignes complètes de résultats natifs du fournisseur au format JSONL pour un lot final appartenant à l’espace de travail authentifié. Combine les fichiers de réussite et d’erreur, convertit les sorties en ligne et suit la pagination du fournisseur. Utilisez une clé API Phaseo. Les téléchargements ne lancent aucune inférence et n’ajoutent pas de frais d’utilisation. Les endpoints de fichiers existants restent disponibles. Les lignes en ligne sont limitées à 8 MiB ; les téléchargements interrompus doivent être supprimés puis recommencés. Limite de 10 tentatives par espace de travail et par lot dans une fenêtre glissante de 30 minutes, partagée entre clés API et alias. Les tentatives en amont échouées ou annulées comptent. Une réponse 429 inclut Retry-After en secondes.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Résultats JSONL originaux du fournisseur
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: Non autorisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Accès à l’aperçu des lots refusé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lot introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Les résultats du lot ne sont pas prêts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de téléchargement du lot dépassée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Secondes avant qu’un nouveau téléchargement soit autorisé
              schema:
                type: integer
        '501':
          description: Ce fournisseur ne prend pas en charge le téléchargement direct des résultats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Les résultats du fournisseur n’ont pas pu être récupérés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission au téléchargement temporairement indisponible ; réessayez après 30 secondes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
