                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Une ou plusieurs clés API ne sont pas disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/versions/{version}/deploy:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: deployDynamicRouteVersion
      summary: Déployer une version de route dynamique
      description: Active une version immuable de la route et actualise les contextes des clés qui y sont associées.
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
        - $ref: '#/components/parameters/DynamicRouteVersion'
      responses:
        '200':
          description: Version de la route déployée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeployResponse'
        '400':
          description: Version de route invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Route dynamique ou version introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listEndpoints
      summary: Lister les endpoints
      description: Liste les identifiants d’endpoints de la passerelle fondés sur les capacités, avec leurs chemins publics, collections de modalités, nombres de modèles et de fournisseurs, ainsi que des modèles exemples.
      responses:
        '200':
          description: Métadonnées des endpoints
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCatalogueResponse'
tags:
  - name: Gateway
    description: Core Phaseo Gateway operations.
components:
  securitySchemes:
