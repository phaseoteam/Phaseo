    post:
      x-beta: true
      tags:
        - Gateway
      operationId: uploadBatchFile
      summary: Téléverser un fichier de lot
      description: Téléverse un fichier du fournisseur pour le traitement par lots et enregistre sa propriété dans l’espace de travail authentifié. Passez `model` pour que Phaseo puisse déduire le fournisseur. OpenAI est utilisé par défaut si `model` et `provider` sont tous deux omis.
      parameters:
        - name: model
          in: query
          required: false
          description: ID du modèle utilisé pour déduire le fournisseur du fichier de traitement par lots.
          schema:
            $ref: '#/components/schemas/ModelId'
        - name: provider
          in: query
          required: false
          description: Remplacement avancé du fournisseur pour le téléversement du fichier.
          schema:
            type: string
            enum:
              - openai
              - groq
              - together
              - mistral
        - name: x-phaseo-provider
          in: header
          required: false
          description: Alternative dans l’en-tête au paramètre de requête `provider`.
