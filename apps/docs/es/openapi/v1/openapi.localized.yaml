          description: Calidad de renderizado de imágenes. xhigh y max solo están disponibles para los modelos GPT Image 2.5.
        stream:
          type: boolean
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
        output_format:
          type: string
          enum:
            - png
            - jpeg
            - webp
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        background:
          type: string
          enum:
            - transparent
            - opaque
            - auto
        moderation:
          type: string
          enum:
            - auto
            - low
        input_fidelity:
          type: string
          enum:
            - high
            - low
        user:
          type: string
        meta:
          type: boolean
        usage:
