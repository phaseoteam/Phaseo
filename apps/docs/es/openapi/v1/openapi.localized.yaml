            $ref: '#/components/schemas/Image'
    VideoGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        duration:
          type: integer
          description: Duración deseada en segundos (depende del proveedor/modelo).
        input_video_duration:
          type: number
          format: double
          minimum: 0
          maximum: 3600
          exclusiveMinimum: true
          description: Duración del vídeo de origen en segundos. Obligatoria cuando el proveedor factura la duración del vídeo de origen por separado de la salida generada.
        input_audio_duration:
          type: number
          format: double
          minimum: 2
          maximum: 20
          description: Duración declarada del audio de origen en segundos, usada para validar el intervalo admitido por el proveedor. Los proveedores que no informan del uso definitivo pueden facturar según el máximo de duración de entrada que admiten.
        size:
          type: string
          description: Dimensiones explícitas (por ejemplo, 1280x720). No puede combinarse con resolution ni aspect_ratio.
        resolution:
          type: string
          description: 480p, 720p, 1080p, 1K, 2K, 4K. Puede combinarse con aspect_ratio. No puede combinarse con size.
        aspect_ratio:
          type: string
          description: Relación de aspecto como 16:9, 9:16 o 1:1. Puede combinarse con resolution. No puede combinarse con size.
        seed:
          type: integer
        sample_count:
          type: integer
          minimum: 1
          maximum: 4
        negative_prompt:
          type: string
        generate_audio:
          type: boolean
        enhance_prompt:
          type: boolean
        compression_quality:
          type: integer
        person_generation:
          type: string
        resize_mode:
          type: string
        input_references:
          type: array
          description: Entradas HTTPS de imagen, audio o vídeo que condicionan la generación. Los tipos, roles, cantidades y combinaciones admitidos dependen del modelo seleccionado. Consulte GET /videos/models antes de enviar un trabajo. El alias de compatibilidad singular input_reference, omitido en este esquema, acepta una imagen multipart o un objeto con exactamente uno de file_id o image_url. La compatibilidad depende del proveedor.
          items:
            $ref: '#/components/schemas/VideoInputReference'
        frame_images:
          type: array
          minItems: 1
          maxItems: 2
          description: Imágenes HTTPS del primer/último fotograma. Cada frame_type puede aparecer una vez. No proporcione además input_reference ni roles de fotograma en input_references.
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - frame_type
              - image_url
            properties:
              type:
                type: string
                enum:
                  - image_url
              frame_type:
                type: string
                enum:
                  - first_frame
                  - last_frame
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        provider_params:
          type: object
          additionalProperties: true
          description: Solo extensiones específicas del proveedor. Se rechazan el paso completo de la solicitud y los campos duplicados de enrutamiento, prompt, callback o facturación.
        provider_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: Extensiones identificadas por el ID canónico del proveedor (por ejemplo, atlascloud o byteplus). Solo se reenvían las opciones del proveedor seleccionado. No puede combinarse con provider_params. Los campos de enrutamiento, prompt, callback, duración, resolución y cantidad de salidas deben usar campos validados de nivel superior.
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: Endpoint de webhook activo gestionado por el espacio de trabajo. Su secreto de firma cifrado y rotativo nunca se almacena en los metadatos del trabajo de vídeo.
            events:
              type: array
              description: Suscripciones opcionales a eventos. Use eventos genéricos job.* o eventos video.* correspondientes, por ejemplo video.status_changed, video.progress o video.completed. Si se omiten, se usan job.status_changed y eventos finales job.*. Incluya job.progress o video.progress explícitamente para callbacks de progreso. Si se especifican, al menos un evento debe ser válido para trabajos de vídeo; se rechazan las listas mal formadas o compuestas solo de eventos de otro tipo.
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: Resumen público de entrega de webhooks asíncronos gestionados por la pasarela. Permite distinguir el estado de ejecución del trabajo del estado de entrega del webhook.
      properties:
        total_attempts:
          type: integer
          description: Total de intentos de entrega registrados para este trabajo.
        delivered_events:
          type: integer
          description: Número de claves de entrega que han alcanzado el estado entregado.
        delivered_event_types:
          type: array
          description: Claves de entrega entregadas al menos una vez.
          items:
            type: string
          example:
            - video.completed
        pending_retries:
          type: integer
          description: Número de claves de entrega con un reintento programado actualmente.
        next_retry_at:
          type: string
          nullable: true
          description: Marca de tiempo ISO del próximo reintento programado, si existe.
        last_attempt_at:
          type: string
          nullable: true
          description: Marca de tiempo ISO del intento de entrega más reciente.
        last_attempt_status:
          type: string
          nullable: true
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
          description: Resultado del intento de entrega más reciente.
        last_response_status:
          type: integer
          nullable: true
          description: Estado HTTP devuelto por el destino del webhook, si está disponible.
        last_delivered_at:
          type: string
          nullable: true
          description: Marca de tiempo ISO de la entrega correcta más reciente.
        last_failure_at:
          type: string
          nullable: true
          description: Marca de tiempo ISO del intento fallido o en reintento más reciente.
        last_error_message:
          type: string
          nullable: true
          description: Mensaje de error de entrega más reciente, si está disponible.
    AsyncWebhookDeliveryAttempt:
      type: object
      description: Intento reciente de entrega de un webhook asíncrono gestionado por la pasarela.
      properties:
        id:
          type: string
          description: Identificador estable del intento para auditoría y depuración.
        delivery_key:
          type: string
          description: Clave de idempotencia para la entrega de este evento.
          example: video.completed
        event_type:
          type: string
          description: Tipo de evento entregado al destino del webhook.
          example: video.completed
        status:
          type: string
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: Número de intento para esta clave de entrega, comenzando en uno.
        max_attempts:
          type: integer
          description: Máximo de intentos antes de marcar la entrega como fallida permanentemente.
        tried_at:
          type: string
          description: Marca de tiempo ISO de este intento.
        delivered_at:
          type: string
          nullable: true
          description: Marca de tiempo ISO de la entrega correcta de este intento.
        next_retry_at:
          type: string
          nullable: true
          description: Marca de tiempo ISO del próximo reintento tras este intento, si está programado.
        response_status:
          type: integer
          nullable: true
          description: Estado HTTP devuelto por el destino del webhook, si está disponible.
        error_message:
          type: string
          nullable: true
          description: Mensaje de error de entrega, si está disponible.
        response_body_preview:
          type: string
          nullable: true
          description: Vista previa del cuerpo de respuesta del destino del webhook con información sensible oculta.
    AsyncWebhookPublicState:
      type: object
      description: Configuración depurada del webhook asíncrono y estado de entrega. Nunca se devuelven secretos; `has_secret` indica si las entregas firmadas están habilitadas. Las entregas firmadas incluyen las cabeceras x-phaseo-signature, x-phaseo-timestamp, x-phaseo-event-id, x-phaseo-event-type, x-phaseo-delivery-key, x-phaseo-attempt y x-phaseo-max-attempts.
      properties:
        url:
          type: string
          format: uri
          nullable: true
        events:
          type: array
          items:
            type: string
        has_secret:
          type: boolean
        delivery:
          $ref: '#/components/schemas/AsyncWebhookDeliverySummary'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AsyncWebhookDeliveryAttempt'
    VideoGenerationResponse:
