          in: query
          description: Filtra por slug del proveedor.
          schema:
            type: string
            maxLength: 128
        - name: endpoint
          in: query
          description: Filtra por identificador del endpoint de la pasarela.
          schema:
            type: string
            maxLength: 128
        - name: byok
          in: query
          description: Filtra tráfico gestionado o BYOK.
          schema:
            type: boolean
        - name: success
          in: query
          description: Filtra solicitudes correctas o fallidas.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Offset'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: Obtenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          description: Error de solicitud incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado
          content:
