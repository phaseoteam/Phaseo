          in: query
          description: Limitar el número de resultados
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: Desplazamiento para la paginación
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: format
          in: query
          description: Formato de respuesta. De forma predeterminada, es `json`.
          schema:
            type: string
