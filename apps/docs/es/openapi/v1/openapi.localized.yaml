          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrar por estado de enrutamiento del proveedor
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrar por estado de enrutamiento del modelo
          schema:
            type: array
