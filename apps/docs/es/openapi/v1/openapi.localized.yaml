          nullable: true
          description: Marca de tiempo ISO del próximo reintento programado del webhook del usuario, si está en cola.
        last_webhook_progress:
          type: number
          nullable: true
          description: Último intervalo aproximado de progreso enviado a los consumidores de webhooks.
        last_webhook_progress_at:
