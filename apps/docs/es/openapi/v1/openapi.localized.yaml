openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: Una API de pasarela para acceder a diversos modelos de IA mediante endpoints compatibles con OpenAI.
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: Enrutamiento global
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: Enrutamiento global
        - url: https://eu.api.phaseo.app/v1
          description: Enrutamiento regional a proveedores de la UE (solo texto)
        - url: https://us.api.phaseo.app/v1
          description: Enrutamiento regional a proveedores de EE. UU. (solo texto)
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: Listar modelos de la pasarela
      description: Devuelve los modelos compartidos y visibles de la pasarela. De forma predeterminada, muestra los modelos que se pueden enrutar públicamente; usa `availability=all` para incluir registros de disponibilidad que no se pueden enrutar.
      parameters:
        - name: search
          in: query
          description: Búsqueda sin distinguir mayúsculas en identificadores, nombres y descripciones de modelos y organizaciones.
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: Búsqueda de proveedores u organizaciones de modelos sin distinguir mayúsculas.
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: Exigir una modalidad de entrada compatible.
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: Exigir al menos este número de tokens de contexto de entrada.
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: Precio máximo en USD de entrada por millón de tokens.
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: Devolver solo modelos con al menos una oferta enrutable del gateway.
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: Campo usado para ordenar los resultados del descubrimiento de modelos.
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: Dirección de orden opcional. Los precios se ordenan de forma ascendente por defecto; los demás valores numéricos, de forma descendente.
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: Filtrar por endpoints
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: Filtrar por organización
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: Filtrar por ID del proveedor
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Filtrar por estado de despliegue del proveedor
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrar por estado de enrutamiento del proveedor
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrar por estado de enrutamiento del modelo
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Filtrar por estado de capacidades del proveedor
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Filtrar por estado de disponibilidad del proveedor
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Filtrar por motivo de disponibilidad del proveedor
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Filtrar por estado del modelo
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: Filtrar por tipos de entrada
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: Alias público de `input_types`.
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: Filtrar por tipos de salida
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: Alias público de `output_types`.
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: Filtrar por parámetros
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Alias público de `params`.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: Filtro de disponibilidad. `active` devuelve solo los modelos enrutables públicamente; `all` incluye registros de disponibilidad no enrutables.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: Limitar el número de resultados
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: Desplazamiento para la paginación
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: Formato de respuesta. De forma predeterminada, es `json`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: Alias de `format`. Acepta `json`, `rss` o `atom`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: Lista de modelos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: Feed XML RSS 2.0
            application/atom+xml:
              schema:
                type: string
                description: Feed XML Atom
        '400':
          description: Parámetros de solicitud no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: Listar las capacidades de los endpoints del modelo
      description: Devuelve filas de endpoints específicas del proveedor para un modelo, incluidos los paths públicos, las modalidades, los parámetros compatibles, la disponibilidad, el estado de enrutamiento, los slugs del modelo del proveedor y los resúmenes de precios de los endpoints.
      parameters:
        - name: author
          in: path
          required: true
          description: Segmento del autor o la organización del modelo.
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: Segmento del slug del modelo.
          schema:
            type: string
        - name: provider
          in: query
          description: Filtrar por ID del proveedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Filtrar por estado de despliegue del proveedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrar por estado de enrutamiento del proveedor.
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrar por estado de enrutamiento del modelo.
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Filtrar por estado de capacidades del proveedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Filtrar por estado de disponibilidad del proveedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Filtrar por motivo de disponibilidad del proveedor.
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Filtrar por estado del ciclo de vida canónico del modelo.
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Filtrar las filas de endpoints por nombres de parámetros compatibles o sus alias.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: '`active` devuelve las filas de endpoints enrutables públicamente; `all` también incluye las que están próximas y las inactivas.'
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: Filas de capacidades de endpoints del modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: Parámetros de solicitud no válidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No se encontró el modelo con los filtros de disponibilidad y proveedor solicitados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
