  /decisions:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: makeDecision
      summary: Tomar decisiones estructuradas
      description: 'Para llamadas nuevas, usa el formato compatible con OpenAI: input contiene texto o mensajes de usuario con partes input_image integradas, y questions es una lista ordenada de preguntas predicate, choice o score. Las respuestas mantienen el orden y los nombres opcionales. Los valores booleanos siguen siendo booleanos. No se admiten URL de imágenes alojadas; Luna admite hasta 128 imágenes integradas, con límites propios para otros proveedores. El detalle explícito de imagen y safety_identifier requieren una ruta OpenAI. El formato anterior con state, mapas de preguntas, noul y criteria sigue funcionando y devuelve un mapa de respuestas. Together Tev requiere ese formato porque devuelve etiquetas sin probabilidades. Los ejemplos anteriores siguen siendo válidos.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionCreateRequest'
      responses:
