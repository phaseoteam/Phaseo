      summary: Subir archivo por lotes
      description: Sube un archivo del proveedor para procesamiento por lotes y registra su propiedad en el espacio de trabajo autenticado. Pase `model` para que Phaseo pueda inferir el proveedor. Por defecto se usa OpenAI si se omiten tanto `model` como `provider`.
