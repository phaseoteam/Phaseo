      required:
        - id
        - type
        - data
      properties:
        id:
          type: string
          maxLength: 80
        type:
          type: string
          enum:
            - start
            - condition
            - percentage
            - model
            - rate_limit
            - budget_limit
            - end
        position:
          type: object
          nullable: true
          required:
            - x
            - 'y'
          properties:
            x:
              type: number
            'y':
              type: number
          additionalProperties: false
        data:
          type: object
          additionalProperties: true
      additionalProperties: false
    DynamicRouteEdge:
      type: object
      required:
        - id
        - source
        - target
      properties:
        id:
          type: string
          maxLength: 100
        source:
          type: string
          maxLength: 80
        target:
          type: string
          maxLength: 80
        sourceHandle:
          type: string
          maxLength: 80
          nullable: true
      additionalProperties: false
    DynamicRouteAction:
      type: object
      properties:
        model:
          type: string
          maxLength: 256
        modelFallbacks:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 256
        routingMode:
          $ref: '#/components/schemas/WorkspaceRoutingMode'
        providerOrder:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        providerOnly:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        providerIgnore:
          type: array
          maxItems: 64
          items:
            type: string
            maxLength: 128
        allowFallbacks:
          type: boolean
      additionalProperties: false
    DynamicRouteRule:
      type: object
      required:
        - id
        - name
        - enabled
        - condition
        - action
      properties:
        id:
          type: string
          maxLength: 80
        name:
          type: string
          maxLength: 120
        enabled:
          type: boolean
        condition:
          $ref: '#/components/schemas/DynamicRouteCondition'
        action:
          $ref: '#/components/schemas/DynamicRouteAction'
      additionalProperties: false
    DynamicRouteCondition:
      type: object
      required:
        - field
        - operator
      properties:
        field:
          type: string
          enum:
            - always
            - endpoint
            - model
            - session_id
            - metadata
        operator:
          type: string
          enum:
            - equals
            - not_equals
            - contains
            - starts_with
            - exists
        value:
          type: string
          maxLength: 512
          nullable: true
        metadataKey:
          type: string
          maxLength: 128
          nullable: true
      additionalProperties: false
    DynamicRouteVersion:
      type: object
      required:
        - version
        - status
      properties:
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - draft
            - deployed
            - superseded
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    DynamicRouteCreateRequest:
      type: object
      required:
        - name
        - config
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        slug:
          type: string
          maxLength: 63
        description:
          type: string
          maxLength: 500
          nullable: true
        status:
          type: string
          enum:
            - active
            - paused
        config:
          $ref: '#/components/schemas/DynamicRouteConfig'
      additionalProperties: false
    DynamicRouteResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/DynamicRoute'
      additionalProperties: false
    DynamicRouteUpdateRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
          nullable: true
        status:
          type: string
          enum:
            - active
            - paused
        config:
          $ref: '#/components/schemas/DynamicRouteConfig'
      additionalProperties: false
    DynamicRouteDeleteResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - deleted
          properties:
            id:
              type: string
              format: uuid
            deleted:
              type: boolean
              enum:
                - true
          additionalProperties: false
      additionalProperties: false
    DynamicRouteKeysUpdateRequest:
      type: object
      required:
        - key_ids
      properties:
        key_ids:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            format: uuid
      additionalProperties: false
    DynamicRouteKeysResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - key_ids
          properties:
            id:
              type: string
              format: uuid
            key_ids:
              type: array
              items:
                type: string
                format: uuid
          additionalProperties: false
      additionalProperties: false
    DynamicRouteDeployResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - id
            - deployed_version
          properties:
            id:
              type: string
              format: uuid
            deployed_version:
              type: integer
              minimum: 1
          additionalProperties: false
      additionalProperties: false
  parameters:
    DataContributionClassifierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuardrailId:
      name: id
      in: path
      required: true
      description: Identificador del guardrail.
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      required: false
      description: Número de registros que se omitirán.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit100:
      name: limit
      in: query
      required: false
      description: Número máximo de registros que se devolverán.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    WorkspaceId:
      name: id
      in: path
      required: true
      description: UUID o slug del espacio de trabajo.
      schema:
        type: string
    WorkspaceJoinRequestId:
      name: request_id
      in: path
      required: true
      description: Identificador de la solicitud para unirse.
      schema:
        type: string
        format: uuid
    ObservabilityDestinationId:
      name: id
      in: path
      required: true
      description: Identificador del destino de observabilidad.
      schema:
        type: string
        format: uuid
    PresetId:
      name: id
      in: path
      required: true
      description: UUID, slug o nombre canónico del ajuste preestablecido.
      schema:
        type: string
    DynamicRouteId:
      name: id
      in: path
      required: true
      description: Identificador de la ruta dinámica.
      schema:
        type: string
        format: uuid
    DynamicRouteVersion:
      name: version
      in: path
      required: true
      description: Versión inmutable de la ruta dinámica.
      schema:
        type: integer
        minimum: 1
  responses:
    UpstreamRateLimited:
      description: El proveedor de origen seleccionado limitó la tasa de solicitudes.
      headers:
        Retry-After:
          description: Indicación validada del proveedor sobre los segundos que deben transcurrir antes de reintentar.
          schema:
            type: integer
            minimum: 0
            maximum: 86400
        X-Phaseo-Upstream-RateLimit-Limit:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Limit-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Limit-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    UpstreamRateLimitValue:
      description: Metadatos de cuota del proveedor, solo para BYOK. Se omiten en las solicitudes gestionadas por Phaseo.
      schema:
        type: string
