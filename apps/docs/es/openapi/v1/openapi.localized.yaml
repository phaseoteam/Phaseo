                type: string
        webhook_endpoint_id:
          type: string
          description: Alias práctico de webhook.endpoint_id.
        debug:
          $ref: '#/components/schemas/DebugOptions'
        provider:
          allOf:
            - $ref: '#/components/schemas/ProviderRoutingOptions'
          description: Restricción avanzada de enrutamiento. La mayoría de las solicitudes deberían inferir el proveedor a partir del modelo.
