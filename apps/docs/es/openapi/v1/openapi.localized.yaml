  /batches/{batch_id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResults
      summary: Descargar resultados del lote
      description: Transmite filas completas de resultados nativos del proveedor como JSONL para un lote en estado final del espacio de trabajo autenticado. Combina archivos de resultados correctos y de errores, convierte salidas en línea y sigue la paginación de resultados del proveedor. Use una clave API de Phaseo. Las descargas no envían solicitudes de inferencia ni añaden cargos de uso. Los endpoints de archivos existentes siguen disponibles. Las filas en línea están limitadas a 8 MiB; las descargas interrumpidas deben descartarse y repetirse. Máximo de 10 intentos de descarga por espacio de trabajo y lote en una ventana móvil de 30 minutos, compartido entre claves API y alias. Cuentan los intentos fallidos o cancelados del proveedor. Una respuesta 429 incluye Retry-After en segundos.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultados JSONL originales del proveedor
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso a la vista previa de lotes denegado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lote no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Los resultados del lote no están listos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Límite de descargas del lote superado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Segundos hasta que se permita otra descarga
              schema:
                type: integer
        '501':
          description: Este proveedor no admite descargas directas de resultados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: No se pudieron obtener los resultados del proveedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: La admisión de descargas no está disponible temporalmente; reintente tras 30 segundos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
