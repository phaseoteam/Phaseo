        - Gateway
      operationId: getActivityAlias
      summary: Obtener análisis del espacio de trabajo
      description: Devuelve agregados de coste, solicitudes y tokens agrupados por fecha, modelo, proveedor y endpoint para los últimos 30 días UTC completos.
      parameters:
        - name: date
          in: query
          description: Filtra por una única fecha UTC de los últimos 30 días completos (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: label_key
          in: query
          description: Clave de etiqueta de solicitud que se incluye en el segmento de gasto. Debe proporcionarse junto con label_value.
          schema:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9_.:-]{1,64}$
        - name: label_value
          in: query
          description: Valor de etiqueta de solicitud que se incluye en el segmento de gasto. Debe proporcionarse junto con label_key.
          schema:
            type: string
            maxLength: 256
        - name: key_id
          in: query
          description: Filtra por identificador de clave API.
          schema:
            type: string
        - name: end_user_id
          in: query
          description: Filtra por identificador de usuario final definido por la aplicación.
          schema:
            type: string
            maxLength: 256
        - name: model
          in: query
          description: Filtra por slug canónico del modelo solicitado o utilizado en el enrutamiento.
          schema:
            $ref: '#/components/schemas/ModelId'
