    BatchRequest:
      type: object
      properties:
        provider_options:
          type: object
          description: Extensiones limitadas por ID canónico del proveedor. OpenAI acepta output_expires_after; Mistral acepta metadata. Solo se aplican las opciones del proveedor seleccionado. No duplique una opción en el nivel superior. Las opciones no pueden sustituir filas valoradas, modelos ni archivos.
          additionalProperties:
            type: object
            additionalProperties: true
        model:
          type: string
          description: ID del modelo usado para inferir el proveedor del lote. Las filas de solicitud también pueden incluir body.model; se prefiere el modelo de nivel superior.
        prompts:
          type: array
          description: Formato abreviado de prompt simple. Phaseo convierte cada prompt en una fila de lote nativa del proveedor para el modelo seleccionado.
          items:
            type: string
        items:
          type: array
          description: Formato abreviado de prompt estructurado. Los elementos pueden incluir `id`, `custom_id`, `prompt`, `messages`, `input`, `system`, `max_tokens`, `temperature` o un `body` avanzado.
          items:
            type: object
            additionalProperties: true
        system:
          type: string
          description: Instrucción de sistema opcional aplicada a las filas de prompts abreviados.
        max_tokens:
          type: integer
          description: Límite máximo de tokens opcional aplicado a las filas de prompts abreviados.
        temperature:
          type: number
          description: Temperatura de muestreo opcional aplicada a las filas de prompts abreviados.
        input_file_id:
          type: string
          description: ID de archivo existente del proveedor para crear lotes mediante carga de archivos.
        requests:
          type: array
          description: Filas avanzadas de solicitud por lotes. Proporcione exactamente uno de `prompts`, `items`, `requests` o `input_file_id`.
          items:
            $ref: '#/components/schemas/BatchRequestItem'
        endpoint:
          type: string
          enum:
            - /v1/chat/completions
            - /v1/responses
            - /v1/messages
            - /v1/embeddings
            - /v1/generateContent
          description: Formato de solicitud para el cliente. Todas las solicitudes de un lote usan este endpoint. Si se omite, Phaseo elige un valor predeterminado nativo del proveedor a partir del modelo.
        completion_window:
          type: string
        metadata:
          type: object
          additionalProperties: true
        session_id:
          type: string
          maxLength: 256
          description: Identificador único para agrupar solicitudes relacionadas (por ejemplo, una conversación o un flujo de trabajo de agente) y facilitar la observabilidad.
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: ID del endpoint de webhook gestionado por el espacio de trabajo.
            events:
              type: array
              description: Suscripciones opcionales a eventos. Use eventos genéricos job.* o eventos batch.* correspondientes, por ejemplo batch.progress o batch.completed. Si se omiten, se usan eventos finales job.*. Incluya job.progress o batch.progress explícitamente para callbacks de progreso del recuento de solicitudes. Si se especifican, al menos un evento debe ser válido para trabajos por lotes; se rechazan las listas mal formadas o compuestas solo de eventos de otro tipo.
