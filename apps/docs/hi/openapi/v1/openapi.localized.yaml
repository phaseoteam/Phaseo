          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: वर्कस्पेस द्वारा प्रबंधित webhook एंडपॉइंट ID।
            events:
              type: array
              description: वैकल्पिक इवेंट सदस्यताएँ। सामान्य job.* या संबंधित batch.* इवेंट उपयोग करें, जैसे batch.progress या batch.completed। छोड़ने पर अंतिम job.* इवेंट उपयोग होते हैं। अनुरोध-संख्या प्रगति callbacks के लिए job.progress या batch.progress स्पष्ट रूप से शामिल करें। सूची देने पर कम से कम एक इवेंट बैच जॉब के लिए मान्य होना चाहिए; केवल अन्य प्रकार के इवेंट वाली या गलत प्रारूप वाली सूचियाँ अस्वीकार होती हैं।
