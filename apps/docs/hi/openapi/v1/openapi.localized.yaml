            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: मॉडल की सूची
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML फ़ीड
            application/atom+xml:
              schema:
                type: string
                description: Atom XML फ़ीड
        '400':
          description: अमान्य अनुरोध पैरामीटर
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: अनधिकृत
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: त्रुटि
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listProviders
      summary: प्रदाताओं की सूची बनाएँ
      description: उपलब्ध API प्रदाताओं की सूची लौटाता है।
      parameters:
        - name: limit
          in: query
          description: परिणामों की संख्या सीमित करें
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: पेजिनेशन के लिए ऑफ़सेट
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: प्रदाताओं की सूची
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 25
