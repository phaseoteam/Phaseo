      summary: संरचित निर्णय लें
      description: 'नई कॉल के लिए OpenAI-संगत प्रारूप इस्तेमाल करें: input में टेक्स्ट या इनलाइन input_image वाले उपयोगकर्ता संदेश होते हैं और questions में predicate, choice या score प्रश्नों की क्रमबद्ध सूची होती है। उत्तर वही क्रम और वैकल्पिक नाम रखते हैं। बूलियन विकल्प बूलियन ही रहते हैं। होस्ट किए गए चित्र URL समर्थित नहीं हैं; Luna अधिकतम 128 इनलाइन चित्र स्वीकार करता है और अन्य प्रदाताओं की अपनी सीमाएँ हैं। स्पष्ट चित्र विवरण और safety_identifier के लिए OpenAI रूट आवश्यक है। पुराना state, नामित प्रश्न मैप, noul और criteria प्रारूप समर्थित है और उत्तर मैप लौटाता है। Together Tev को वही प्रारूप चाहिए क्योंकि वह संभावनाओं के बिना लेबल लौटाता है। पुराने उदाहरण मान्य हैं।'
      requestBody:
