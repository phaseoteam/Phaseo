components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer टोकन से प्रमाणीकरण
  schemas:
    WorkspaceAppListResponse:
      type: object
      required:
        - data
        - total_count
        - offset
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceApp'
        total_count:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false
    WorkspaceApp:
      type: object
      required:
        - id
        - title
        - app_key
        - category
        - docs_url
        - url
        - image_url
        - is_public
        - is_active
        - is_managed
        - last_seen
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        app_key:
          type: string
        category:
          type: string
          nullable: true
        docs_url:
          type: string
          format: uri
          nullable: true
        url:
          type: string
          nullable: true
        image_url:
