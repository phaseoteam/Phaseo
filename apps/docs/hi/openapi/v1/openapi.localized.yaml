            - cancelled
            - expired
        lifecycle_status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
            - cancelled
            - expired
          description: पोलिंग, WebSocket और webhook उपभोक्ताओं के लिए सामान्यीकृत एसिंक्रोनस जीवनचक्र स्थिति।
        cancel_url:
          type: string
          format: uri
          nullable: true
          description: संगतता के लिए आरक्षित; वर्तमान में हमेशा null।
        output_access:
          type: string
          enum:
            - bytes
            - signed_url
            - both
        generation_id:
          type: string
          nullable: true
        native_video_id:
          type: string
          nullable: true
          description: प्रदाता का मूल वीडियो/जॉब ID, जब वह गेटवे के स्वामित्व वाले ID से अलग हो।
        created_at:
          oneOf:
            - type: integer
            - type: string
        started_at:
          nullable: true
          oneOf:
            - type: integer
            - type: string
        completed_at:
          nullable: true
          oneOf:
            - type: integer
            - type: string
        object:
          type: string
          example: video
        poll_after_seconds:
          type: integer
          example: 20
        provider:
          type: string
        seconds:
          type: number
        size:
          type: string
        audio:
          type: boolean
        content_url:
          type: string
          description: जब output_access में bytes शामिल हों तब मौजूद (प्रमाणित एंडपॉइंट)।
        download_url:
          type: string
          nullable: true
          description: स्थिति completed होने पर सीधे डाउनलोड के लिए प्रथम-पक्ष हस्ताक्षरित URL।
        expires_at:
          type: integer
          nullable: true
          description: हस्ताक्षरित download_url की समय-सीमा समाप्त होने का Unix टाइमस्टैम्प (सेकंड)।
        progress:
          type: integer
          nullable: true
        progress_source:
          type: string
        asset:
          type: object
