  /batch/{id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResultsAlias
      summary: Download batch results (alias)
      description: प्रमाणित वर्कस्पेस के स्वामित्व वाले अंतिम बैच के लिए प्रदाता की मूल पूर्ण परिणाम पंक्तियाँ JSONL के रूप में स्ट्रीम करता है। सफल और त्रुटि फ़ाइलें मिलाता है, inline आउटपुट बदलता है और प्रदाता के परिणाम पेजिनेशन का पालन करता है। Phaseo API कुंजी उपयोग करें। डाउनलोड अनुमान अनुरोध नहीं भेजते और उपयोग शुल्क नहीं जोड़ते। मौजूदा फ़ाइल एंडपॉइंट उपलब्ध रहते हैं। Inline पंक्तियों की सीमा 8 MiB है; बाधित डाउनलोड त्यागकर दोबारा डाउनलोड करें। प्रति वर्कस्पेस प्रति बैच चलती 30-मिनट अवधि में 10 डाउनलोड प्रयास की सीमा है, जो API कुंजियों और aliases में साझा है। विफल या रद्द अपस्ट्रीम प्रयास भी गिने जाते हैं। 429 जवाब में सेकंड में Retry-After होता है।
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: प्रदाता के मूल JSONL परिणाम
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: अनधिकृत
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: बैच पूर्वावलोकन की पहुँच अस्वीकृत
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: बैच नहीं मिला
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: बैच परिणाम तैयार नहीं हैं
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: बैच डाउनलोड सीमा पार हुई
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: दूसरा डाउनलोड अनुमत होने तक सेकंड
              schema:
                type: integer
        '501':
          description: यह प्रदाता सीधे परिणाम डाउनलोड समर्थित नहीं करता
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: प्रदाता के परिणाम प्राप्त नहीं किए जा सके
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: डाउनलोड की अनुमति अस्थायी रूप से अनुपलब्ध; 30 सेकंड बाद पुनः प्रयास करें
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
