openapi: 3.0.3
info:
  title: Phaseo Gateway API
  version: 1.0.0
servers:
  - url: https://api.phaseo.app/v1
security:
  - BearerAuth: []
paths:
  /apps:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listWorkspaceApps
      summary: वर्कस्पेस ऐप सूचीबद्ध करें
      description: स्वचालित रूप से असाइन किए गए वर्कस्पेस ऐप्लिकेशन और उनके संपादन योग्य मेटाडेटा की सूची देता है। इसके लिए `settings:read` अनुमति आवश्यक है।
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: वर्कस्पेस ऐप्लिकेशन
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAppListResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/publisher:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getPresetPublisher
      summary: प्रीसेट प्रकाशक का सार्वजनिक हैंडल प्राप्त करें
      description: वर्कस्पेस के सार्वजनिक प्रीसेट प्रकाशक का मानक हैंडल लौटाता है।
      responses:
        '200':
          description: प्रकाशक का हैंडल
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetPublisherResponse'
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: updatePresetPublisher
      summary: प्रीसेट प्रकाशक हैंडल अपडेट करें
      description: पिछले हैंडल को alias के रूप में रखते हुए कार्यस्थान के प्रकाशक हैंडल का नाम बदलता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetPublisherUpdateRequest'
      responses:
        '200':
          description: प्रकाशक हैंडल अपडेट किया गया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetPublisherResponse'
        '400':
          description: अमान्य प्रकाशक हैंडल
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: प्रकाशक हैंडल उपलब्ध नहीं है
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audio/speech:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createSpeech
      summary: वाणी उत्पन्न करें
      description: दिए गए पाठ से ऑडियो बनाता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioSpeechRequest'
      responses:
        '200':
          description: ऑडियो फ़ाइल
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /audio/transcriptions:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createTranscription
      summary: ट्रांसक्रिप्शन बनाएँ
      description: ऑडियो को इनपुट भाषा में लिखित रूप देता है।
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranscriptionRequest'
      responses:
        '200':
          description: ट्रांसक्रिप्शन प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranscriptionResponse'
  /audio/translations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createTranslation
      summary: अनुवाद बनाएँ
      description: ऑडियो का अंग्रेज़ी में अनुवाद करता है।
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranslationRequest'
      responses:
        '200':
          description: अनुवाद प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranslationResponse'
  /images/generations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createImage
      summary: छवि बनाएँ
      description: दिए गए प्रॉम्प्ट के आधार पर छवि बनाता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesGenerationRequest'
      responses:
        '200':
          description: छवि प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesGenerationResponse'
  /images/edits:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createImageEdit
      summary: छवि संपादन बनाएँ
      description: मूल छवि और प्रॉम्प्ट के आधार पर संपादित या विस्तारित छवि बनाता है।
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImagesEditRequest'
      responses:
        '200':
          description: छवि संपादन प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesEditResponse'
  /ocr:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createOcr
      summary: OCR चलाएँ
      description: अनुरोधित मॉडल का उपयोग करके छवि से पाठ निकालता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
      responses:
        '200':
          description: OCR प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResponse'
  /music/generate:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: generateMusic
      summary: संगीत बनाएँ
      description: एक प्रदाता-स्वतंत्र endpoint के माध्यम से संगीत बनाता है। Phaseo सिंक्रोनस प्रदाताओं के पूरा होने तक प्रतीक्षा करता है और उनकी कतारों की जाँच को आंतरिक रूप से संभालता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicGenerateRequest'
      responses:
        '200':
          description: संगीत निर्माण प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicGenerateResponse'
  /endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listEndpoints
      summary: एंडपॉइंट की सूची बनाएँ
      description: क्षमताओं पर आधारित गेटवे endpoint ID की सूची उनके सार्वजनिक पथ, modality संग्रह, मॉडल और प्रदाता की संख्या तथा नमूना मॉडल सहित देता है।
      responses:
        '200':
          description: एंडपॉइंट मेटाडेटा
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCatalogueResponse'
  /files:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listFiles
      summary: फ़ाइलों की सूची बनाएँ
      description: साझा गेटवे कुंजी के साथ यह फ़िलहाल `not_supported` लौटाता है। इसके बजाय अपलोड की गई फ़ाइलों के ID सहेजें और उन्हें सीधे प्राप्त करें।
      responses:
        '400':
          description: वर्तमान गेटवे मोड में फ़ाइलों की सूची उपलब्ध नहीं है
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: अनधिकृत
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pricing/models:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listPricingModels
      summary: मॉडल की कीमतों की सूची बनाएँ
      description: सक्रिय प्रदाता और मॉडल मूल्य प्रविष्टियाँ लौटाता है।
      responses:
        '200':
          description: मॉडल मूल्य सूची
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  models:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '500':
          description: त्रुटि
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /moderations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createModeration
      summary: मॉडरेशन जाँच करें
      description: जाँचता है कि पाठ OpenAI की उपयोग नीतियों का उल्लंघन करता है या नहीं।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationsRequest'
      responses:
        '200':
          description: मॉडरेशन प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationsResponse'
  /embeddings:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createEmbedding
      summary: एम्बेडिंग बनाएँ
      description: इनपुट पाठ का प्रतिनिधित्व करने वाला embedding वेक्टर बनाता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: एम्बेडिंग प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
  /rerank:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createRerank
      summary: दस्तावेज़ों को पुनः क्रमित करें
      description: क्वेरी के संदर्भ में प्रासंगिकता के आधार पर दस्तावेज़ों की सूची को पुनः क्रमित करता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: पुनः क्रमित करने की प्रतिक्रिया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
  /parse:
    post:
      tags:
        - Gateway
      operationId: createParse
      summary: दस्तावेज़ की छवि का विश्लेषण करें
      description: दस्तावेज़ की छवि को Markdown या क्रमबद्ध सामग्री ब्लॉकों में बदलता है। वर्तमान Cohere Parse API दूरस्थ छवि URL और base64 छवि डेटा URI स्वीकार करती है; PDF और फ़ाइल URL इनपुट अभी समर्थित नहीं हैं।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: विश्लेषित दस्तावेज़
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
  /budgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceBudget
      summary: वर्कस्पेस बजट हटाएँ
      description: वर्कस्पेस की खर्च सीमा हटाता है और उस अवधि के लिए उसे लागू करना बंद कर देता है।
      responses:
        '200':
          description: वर्कस्पेस बजट हटा दिया गया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetDeleteResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getWorkspaceBudget
      summary: वर्कस्पेस बजट प्राप्त करें
      description: वर्कस्पेस की एक खर्च सीमा के साथ मौजूदा उपयोग और शेष खर्च लौटाता है।
      responses:
        '200':
          description: वर्कस्पेस बजट
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceBudget
      summary: वर्कस्पेस बजट अपडेट करें
      description: मौजूदा वर्कस्पेस बजट का अंतराल या USD सीमा बदलता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceBudgetUpdateInput'
      responses:
        '200':
          description: वर्कस्पेस बजट अपडेट किया गया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /byok/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteProviderCredential
      summary: प्रदाता क्रेडेंशियल हटाएँ
      description: प्रदाता क्रेडेंशियल को स्थायी रूप से हटाता है। इसे दोबारा हटाना सुरक्षित है।
      responses:
        '200':
          description: प्रदाता क्रेडेंशियल हटा दिया गया या पहले से मौजूद नहीं था
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialDeleteResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getProviderCredential
      summary: प्रदाता क्रेडेंशियल प्राप्त करें
      description: एन्क्रिप्ट किए गए फ़ील्ड या कच्चे सीक्रेट को उजागर किए बिना सुरक्षित मेटाडेटा लौटाता है।
      responses:
        '200':
          description: प्रदाता क्रेडेंशियल मेटाडेटा
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateProviderCredential
      summary: प्रदाता क्रेडेंशियल अपडेट करें
      description: क्रेडेंशियल मेटाडेटा, फ़िल्टर या रूटिंग समूह अपडेट करता है, या केवल-लिखने योग्य सीक्रेट बदलता है।
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialUpdateRequest'
      responses:
        '200':
          description: प्रदाता क्रेडेंशियल अपडेट किया गया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/departments/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceDepartment
      summary: वर्कस्पेस विभाग हटाएँ
      description: मैन्युअल रूप से प्रबंधित विभाग हटाता है। डायरेक्टरी से सिंक किए गए विभाग यहाँ नहीं हटाए जा सकते।
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: विभाग हटा दिया गया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceDepartment
      summary: कार्यस्थान का विभाग अपडेट करें
      description: डायरेक्टरी मैपिंग हटाए बिना विभाग का नाम, विवरण, आइकन या रंग अपडेट करता है।
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceDepartmentUpdateRequest'
      responses:
        '200':
          description: विभाग अपडेट किया गया
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDepartmentResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/group-mappings/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceGroupMapping
      summary: डायरेक्टरी समूह मैपिंग हटाएँ
      description: वर्कस्पेस से प्रावधान की गई समूह मैपिंग हटाता है।
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: समूह मैपिंग हटा दी गई
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        default:
          description: अनुरोध विफल हुआ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceGroupMapping
      summary: डायरेक्टरी समूह मैपिंग अपडेट करें
      description: मैपिंग द्वारा निर्धारित एक्सेस भूमिका या विभाग की स्थिति अपडेट करता है।
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceGroupMappingUpdateRequest'
      responses:
        '200':
