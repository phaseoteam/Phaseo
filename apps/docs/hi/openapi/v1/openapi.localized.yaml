          description: स्रोत ऑडियो की घोषित अवधि सेकंड में, प्रदाता की सीमा जाँचने के लिए। आधिकारिक उपयोग न बताने वाले प्रदाता अपनी समर्थित इनपुट-अवधि की अधिकतम सीमा पर बिल कर सकते हैं।
        size:
          type: string
          description: स्पष्ट आयाम (जैसे 1280x720)। resolution या aspect_ratio के साथ नहीं दिया जा सकता।
        resolution:
          type: string
          description: 480p, 720p, 1080p, 1K, 2K, 4K। aspect_ratio के साथ दिया जा सकता है। size के साथ नहीं दिया जा सकता।
        aspect_ratio:
          type: string
          description: आस्पेक्ट अनुपात जैसे 16:9, 9:16, 1:1। resolution के साथ दिया जा सकता है। size के साथ नहीं दिया जा सकता।
        seed:
          type: integer
        sample_count:
          type: integer
          minimum: 1
          maximum: 4
        negative_prompt:
          type: string
        generate_audio:
          type: boolean
        enhance_prompt:
          type: boolean
        compression_quality:
          type: integer
        person_generation:
          type: string
        resize_mode:
          type: string
        input_references:
          type: array
          description: जनरेशन को निर्देशित करने वाले HTTPS चित्र, ऑडियो या वीडियो इनपुट। समर्थित प्रकार, भूमिकाएँ, संख्या और संयोजन चुने गए मॉडल पर निर्भर हैं। जॉब भेजने से पहले GET /videos/models देखें। इस स्कीमा में छोड़ा गया एकवचन संगतता alias input_reference एक multipart चित्र या file_id और image_url में से ठीक एक वाला ऑब्जेक्ट स्वीकार करता है। समर्थन प्रदाता पर निर्भर है।
          items:
            $ref: '#/components/schemas/VideoInputReference'
        frame_images:
          type: array
          minItems: 1
          maxItems: 2
          description: पहले/अंतिम फ़्रेम के HTTPS चित्र। हर frame_type एक बार आ सकता है। साथ में input_reference या input_references में फ़्रेम भूमिकाएँ न दें।
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - frame_type
              - image_url
            properties:
              type:
                type: string
                enum:
                  - image_url
              frame_type:
                type: string
                enum:
                  - first_frame
                  - last_frame
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        provider_params:
          type: object
          additionalProperties: true
          description: केवल प्रदाता-विशिष्ट एक्सटेंशन। पूरे अनुरोध का passthrough और दोहराए गए रूटिंग, prompt, callback या बिलिंग फ़ील्ड अस्वीकार किए जाते हैं।
        provider_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: कैनोनिकल प्रदाता ID (जैसे atlascloud या byteplus) से पहचाने जाने वाले एक्सटेंशन। केवल चुने गए प्रदाता के विकल्प आगे भेजे जाते हैं। provider_params के साथ नहीं दिया जा सकता। रूटिंग, prompt, callback, अवधि, रिज़ॉल्यूशन और आउटपुट-संख्या के लिए सत्यापित शीर्ष-स्तरीय फ़ील्ड उपयोग करने होंगे।
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: वर्कस्पेस द्वारा प्रबंधित सक्रिय webhook एंडपॉइंट। इसका एन्क्रिप्टेड और बदला जा सकने वाला साइनिंग सीक्रेट वीडियो जॉब के मेटाडेटा में कभी संग्रहीत नहीं होता।
            events:
              type: array
              description: वैकल्पिक इवेंट सदस्यताएँ। सामान्य job.* या संबंधित video.* इवेंट उपयोग करें, जैसे video.status_changed, video.progress या video.completed। छोड़ने पर job.status_changed और अंतिम job.* इवेंट उपयोग होते हैं। प्रगति callbacks के लिए job.progress या video.progress स्पष्ट रूप से शामिल करें। सूची देने पर कम से कम एक इवेंट वीडियो जॉब के लिए मान्य होना चाहिए; केवल अन्य प्रकार के इवेंट वाली या गलत प्रारूप वाली सूचियाँ अस्वीकार होती हैं।
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: गेटवे द्वारा प्रबंधित एसिंक्रोनस webhooks की सार्वजनिक डिलीवरी जानकारी। इससे जॉब निष्पादन स्थिति को webhook डिलीवरी स्वास्थ्य से अलग समझें।
      properties:
        total_attempts:
          type: integer
          description: इस जॉब के लिए दर्ज कुल डिलीवरी प्रयास।
        delivered_events:
          type: integer
          description: डिलीवरी पूर्ण स्थिति तक पहुँचने वाली डिलीवरी कुंजियों की संख्या।
        delivered_event_types:
          type: array
          description: कम से कम एक बार डिलीवर हुई डिलीवरी कुंजियाँ।
          items:
            type: string
          example:
            - video.completed
        pending_retries:
          type: integer
          description: वर्तमान में पुनः प्रयास के लिए निर्धारित डिलीवरी कुंजियों की संख्या।
        next_retry_at:
          type: string
          nullable: true
          description: अगले निर्धारित पुनः प्रयास का ISO टाइमस्टैम्प, यदि मौजूद हो।
        last_attempt_at:
          type: string
          nullable: true
          description: सबसे हालिया डिलीवरी प्रयास का ISO टाइमस्टैम्प।
        last_attempt_status:
          type: string
          nullable: true
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
          description: सबसे हालिया डिलीवरी प्रयास का परिणाम।
        last_response_status:
          type: integer
          nullable: true
          description: webhook गंतव्य द्वारा लौटाई गई HTTP स्थिति, यदि उपलब्ध हो।
        last_delivered_at:
          type: string
          nullable: true
          description: सबसे हालिया सफल डिलीवरी का ISO टाइमस्टैम्प।
        last_failure_at:
          type: string
          nullable: true
          description: सबसे हालिया विफल या पुनः प्रयास वाले प्रयास का ISO टाइमस्टैम्प।
        last_error_message:
          type: string
          nullable: true
          description: सबसे हालिया डिलीवरी त्रुटि संदेश, यदि उपलब्ध हो।
    AsyncWebhookDeliveryAttempt:
      type: object
      description: गेटवे द्वारा प्रबंधित एसिंक्रोनस webhook का हालिया डिलीवरी प्रयास।
      properties:
        id:
          type: string
          description: ऑडिट और डिबगिंग के लिए स्थिर प्रयास पहचानकर्ता।
        delivery_key:
          type: string
          description: इस इवेंट की डिलीवरी के लिए आइडेम्पोटेंसी कुंजी।
          example: video.completed
        event_type:
          type: string
          description: webhook गंतव्य को डिलीवर किया गया इवेंट प्रकार।
          example: video.completed
        status:
          type: string
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: इस डिलीवरी कुंजी के लिए एक से शुरू होने वाला प्रयास क्रमांक।
        max_attempts:
          type: integer
          description: डिलीवरी को स्थायी रूप से विफल चिह्नित करने से पहले अधिकतम प्रयास।
        tried_at:
          type: string
          description: यह प्रयास किए जाने का ISO टाइमस्टैम्प।
        delivered_at:
          type: string
          nullable: true
          description: इस प्रयास की सफल डिलीवरी का ISO टाइमस्टैम्प।
        next_retry_at:
          type: string
          nullable: true
          description: इस प्रयास के बाद अगले पुनः प्रयास का ISO टाइमस्टैम्प, यदि निर्धारित हो।
        response_status:
          type: integer
          nullable: true
          description: webhook गंतव्य द्वारा लौटाई गई HTTP स्थिति, यदि उपलब्ध हो।
        error_message:
          type: string
          nullable: true
          description: डिलीवरी त्रुटि संदेश, यदि उपलब्ध हो।
        response_body_preview:
          type: string
          nullable: true
          description: webhook गंतव्य के जवाब के बॉडी का संवेदनशील जानकारी हटाया गया पूर्वावलोकन।
    AsyncWebhookPublicState:
      type: object
      description: सुरक्षित रूप से साफ़ किया गया एसिंक्रोनस webhook कॉन्फ़िगरेशन और डिलीवरी स्थिति। सीक्रेट कभी नहीं लौटाए जाते; `has_secret` बताता है कि हस्ताक्षरित डिलीवरी सक्षम हैं या नहीं। हस्ताक्षरित डिलीवरी में x-phaseo-signature, x-phaseo-timestamp, x-phaseo-event-id, x-phaseo-event-type, x-phaseo-delivery-key, x-phaseo-attempt और x-phaseo-max-attempts हेडर शामिल होते हैं।
      properties:
        url:
          type: string
          format: uri
          nullable: true
        events:
          type: array
          items:
            type: string
        has_secret:
          type: boolean
        delivery:
          $ref: '#/components/schemas/AsyncWebhookDeliverySummary'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AsyncWebhookDeliveryAttempt'
    VideoGenerationResponse:
      type: object
      properties:
        id:
          type: string
        polling_url:
          type: string
        websocket_url:
          type: string
          format: uri
          description: एसिंक्रोनस जॉब के सामान्यीकृत जीवनचक्र अपडेट की सदस्यता लेने के लिए WebSocket URL।
        model:
          type: string
        request_id:
          type: string
        session_id:
          type: string
        status:
          type: string
          enum:
