      description: टिकाऊ अधिसूचना नीति के एक या अधिक खंड अपडेट करता है। ऑटो टॉप-अप सक्षम करने के लिए मौजूदा सहेजी गई भुगतान विधि का पहचानकर्ता और सत्यापित दो-कारक प्रमाणीकरण आवश्यक है। मौजूदा कॉन्फ़िगरेशन MFA स्वीकृति दोहराए बिना अपडेट हो सकती है। MFA के बिना सक्षम करने के लिए क्लाइंट को स्पष्ट रूप से `mfa_bypass_acknowledged` को true करना और `mfa_bypass_phrase` में सटीक मान `I ACCEPT THE RISK` देना होगा; भुगतान जानकारी संग्रह खाते का इंटरैक्टिव प्रवाह बना रहता है।
