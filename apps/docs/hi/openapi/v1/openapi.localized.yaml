      summary: रीयल-टाइम रिले कनेक्ट करें
      description: सेशन रिले सीक्रेट को सबप्रोटोकॉल के रूप में उपयोग करके WebSocket रिले पर अपग्रेड करता है।
      security: []
      parameters:
        - name: session_id
