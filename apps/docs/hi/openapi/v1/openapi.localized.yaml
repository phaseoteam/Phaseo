        provider_options:
          type: object
          description: कैनोनिकल प्रदाता ID के अनुसार सीमित एक्सटेंशन। OpenAI output_expires_after और Mistral metadata स्वीकार करता है। केवल चुने गए प्रदाता के विकल्प लागू होते हैं। शीर्ष स्तर पर विकल्प न दोहराएँ। विकल्प मूल्यांकित पंक्तियों, मॉडल या फ़ाइलों को बदल नहीं सकते।
