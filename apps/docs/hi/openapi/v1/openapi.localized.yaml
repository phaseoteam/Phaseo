openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: OpenAI-संगत एंडपॉइंट के माध्यम से विभिन्न AI मॉडल तक पहुँचने के लिए एक गेटवे API।
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: वैश्विक रूटिंग
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: वैश्विक रूटिंग
        - url: https://eu.api.phaseo.app/v1
          description: यूरोपीय संघ क्षेत्रीय प्रदाता रूटिंग (केवल टेक्स्ट)
        - url: https://us.api.phaseo.app/v1
          description: अमेरिकी क्षेत्रीय प्रदाता रूटिंग (केवल टेक्स्ट)
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: गेटवे मॉडल की सूची बनाएँ
      description: साझा किए गए, न छिपाए गए गेटवे मॉडल लौटाता है। डिफ़ॉल्ट रूप से वर्तमान में सार्वजनिक रूप से रूट किए जा सकने वाले मॉडल मिलते हैं; रूट न किए जा सकने वाले उपलब्धता रिकॉर्ड शामिल करने के लिए `availability=all` उपयोग करें।
      parameters:
        - name: search
          in: query
          description: मॉडल आईडी, नाम, विवरण और संगठनों में बड़े-छोटे अक्षरों का भेद किए बिना खोजें।
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: प्रदाता या मॉडल संगठन में बड़े-छोटे अक्षरों का भेद किए बिना खोजें।
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: समर्थित इनपुट मोडैलिटी आवश्यक करें।
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: कम से कम इतने इनपुट संदर्भ टोकन आवश्यक करें।
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: प्रति दस लाख इनपुट टोकन अधिकतम मूल्य (USD)।
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: केवल वे मॉडल लौटाएँ जिनका कम से कम एक रूट करने योग्य गेटवे ऑफ़र हो।
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: मॉडल खोज परिणामों को क्रमबद्ध करने वाला फ़ील्ड।
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: वैकल्पिक क्रम दिशा। मूल्य डिफ़ॉल्ट रूप से बढ़ते क्रम में और अन्य संख्याएँ घटते क्रम में होती हैं।
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: एंडपॉइंट के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: संगठन के अनुसार फ़िल्टर करें
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: प्रदाता ID के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: प्रदाता रोलआउट स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: प्रदाता रूटिंग स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: मॉडल रूटिंग स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: प्रदाता क्षमता स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: प्रदाता उपलब्धता स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: प्रदाता उपलब्धता कारण के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: मॉडल स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: इनपुट प्रकारों के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: '`input_types` के लिए सार्वजनिक alias।'
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: आउटपुट प्रकारों के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: '`output_types` के लिए सार्वजनिक alias।'
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: पैरामीटर के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: '`params` के लिए सार्वजनिक alias।'
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: उपलब्धता फ़िल्टर। `active` केवल सार्वजनिक रूप से रूट किए जा सकने वाले मॉडल लौटाता है; `all` में रूट न किए जा सकने वाले उपलब्धता रिकॉर्ड भी शामिल हैं।
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: परिणामों की संख्या सीमित करें
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: पेजिनेशन के लिए ऑफ़सेट
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: प्रतिक्रिया प्रारूप। डिफ़ॉल्ट `json` है।
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: '`format` का alias। `json`, `rss` या `atom` स्वीकार करता है।'
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: मॉडल की सूची
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML फ़ीड
            application/atom+xml:
              schema:
                type: string
                description: Atom XML फ़ीड
        '400':
          description: अमान्य अनुरोध पैरामीटर
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: अनधिकृत
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: त्रुटि
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: मॉडल एंडपॉइंट क्षमताओं की सूची बनाएँ
      description: एक मॉडल के लिए प्रदाता-विशिष्ट एंडपॉइंट पंक्तियाँ लौटाता है, जिनमें सार्वजनिक पथ, मोडैलिटी, समर्थित पैरामीटर, उपलब्धता, रूटिंग स्थिति, प्रदाता मॉडल slug और एंडपॉइंट मूल्य सारांश शामिल हैं।
      parameters:
        - name: author
          in: path
          required: true
          description: मॉडल लेखक या संगठन का सेगमेंट।
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: मॉडल slug सेगमेंट।
          schema:
            type: string
        - name: provider
          in: query
          description: प्रदाता ID के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: प्रदाता रोलआउट स्थिति के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: प्रदाता रूटिंग स्थिति के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: मॉडल रूटिंग स्थिति के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: प्रदाता क्षमता स्थिति के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: प्रदाता उपलब्धता स्थिति के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: प्रदाता उपलब्धता कारण के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: मॉडल की canonical लाइफ़साइकिल स्थिति के अनुसार फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: समर्थित पैरामीटर नामों या alias के अनुसार एंडपॉइंट पंक्तियाँ फ़िल्टर करें।
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: '`active` सार्वजनिक रूप से रूट किए जा सकने वाले एंडपॉइंट पंक्तियाँ लौटाता है; `all` में जल्द आने वाली और निष्क्रिय पंक्तियाँ भी शामिल हैं।'
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: मॉडल एंडपॉइंट क्षमता पंक्तियाँ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: अमान्य अनुरोध पैरामीटर
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: अनधिकृत
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: अनुरोधित उपलब्धता और प्रदाता फ़िल्टर के लिए मॉडल नहीं मिला
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: त्रुटि
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/me:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listTeamModels
      summary: टीम-स्कोप वाले गेटवे मॉडल की सूची बनाएँ
      description: टीम-स्कोप वाले गेटवे मॉडल लौटाता है। डिफ़ॉल्ट रूप से सार्वजनिक रूप से रूट किए जा सकने वाले मॉडल मिलते हैं; रूट न किए जा सकने वाले उपलब्धता रिकॉर्ड शामिल करने के लिए `availability=all` उपयोग करें।
      parameters:
        - name: endpoints
          in: query
          description: एंडपॉइंट के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: संगठन के अनुसार फ़िल्टर करें
