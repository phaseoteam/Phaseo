        prompts:
          type: array
          description: सरल prompt का संक्षिप्त रूप। Phaseo हर prompt को चुने गए मॉडल के लिए प्रदाता के मूल बैच रूप की पंक्ति में बदलता है।
          items:
            type: string
        items:
          type: array
          description: संरचित prompt का संक्षिप्त रूप। आइटम में `id`, `custom_id`, `prompt`, `messages`, `input`, `system`, `max_tokens`, `temperature` या उन्नत `body` हो सकता है।
          items:
            type: object
            additionalProperties: true
        system:
          type: string
          description: संक्षिप्त prompt पंक्तियों पर लागू वैकल्पिक सिस्टम निर्देश।
        max_tokens:
          type: integer
          description: संक्षिप्त prompt पंक्तियों पर लागू वैकल्पिक अधिकतम टोकन सीमा।
        temperature:
          type: number
          description: संक्षिप्त prompt पंक्तियों पर लागू वैकल्पिक सैंपलिंग तापमान।
        input_file_id:
          type: string
          description: फ़ाइल अपलोड से बैच बनाने के लिए प्रदाता की मौजूदा फ़ाइल ID।
        requests:
          type: array
          description: उन्नत बैच अनुरोध पंक्तियाँ। `prompts`, `items`, `requests` या `input_file_id` में से ठीक एक दें।
