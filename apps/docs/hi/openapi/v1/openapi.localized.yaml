            - /v1/responses
            - /v1/messages
            - /v1/embeddings
            - /v1/generateContent
          description: कॉलर के लिए अनुरोध का रूप। बैच का हर अनुरोध यह एंडपॉइंट उपयोग करता है। छोड़ने पर Phaseo मॉडल से प्रदाता के मूल रूप का डिफ़ॉल्ट चुनता है।
