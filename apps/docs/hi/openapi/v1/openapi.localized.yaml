            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: प्रदाता रूटिंग स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: मॉडल रूटिंग स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
