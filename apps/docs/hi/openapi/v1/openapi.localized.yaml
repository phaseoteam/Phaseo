          description: मॉडल स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: इनपुट प्रकारों के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: output_types
