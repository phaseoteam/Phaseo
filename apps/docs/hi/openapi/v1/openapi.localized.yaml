              enum:
                - image_url
            role:
              type: string
              description: चुने गए मॉडल द्वारा इस चित्र का वांछित उपयोग।
              enum:
                - first_frame
                - last_frame
                - reference
                - source
                - mask
            reference_type:
              type: string
            image_url:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: सार्वजनिक रूप से उपलब्ध HTTPS चित्र URL।
        - type: object
          required:
            - type
            - media_url
          properties:
            type:
              type: string
              enum:
                - video_url
                - audio_url
            role:
              type: string
              description: चुने गए मॉडल द्वारा इस ऑडियो या वीडियो का वांछित उपयोग।
              enum:
                - first_frame
                - last_frame
                - reference
                - source
                - mask
            reference_type:
              type: string
            media_url:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  format: uri
                  description: सार्वजनिक रूप से उपलब्ध HTTPS ऑडियो या वीडियो URL।
    VideoOutputConfig:
