              type: string
        - name: provider_status
          in: query
          description: प्रदाता रोलआउट स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: प्रदाता रूटिंग स्थिति के अनुसार फ़िल्टर करें
          schema:
            type: array
