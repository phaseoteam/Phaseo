            mime_type:
              type: string
            bytes:
              type: integer
            sha256:
              type: string
            width:
              type: integer
            height:
              type: integer
            duration_seconds:
              type: number
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/VideoOutput'
        billing:
          $ref: '#/components/schemas/VideoBillingSummary'
        webhook:
          $ref: '#/components/schemas/AsyncWebhookPublicState'
        next_webhook_retry_at:
          type: string
          nullable: true
          description: अगले निर्धारित उपयोगकर्ता-webhook पुनः प्रयास का ISO टाइमस्टैम्प, यदि कतार में हो।
        last_webhook_progress:
          type: number
          nullable: true
          description: webhook उपभोक्ताओं को भेजा गया सबसे हालिया मोटा प्रगति स्तर।
        last_webhook_progress_at:
          type: string
          nullable: true
          description: सबसे हालिया webhook प्रगति स्तर भेजे जाने का ISO टाइमस्टैम्प।
        last_webhook_dispatched_at:
          type: string
          nullable: true
          description: सबसे हालिया webhook भेजने के प्रयास का ISO टाइमस्टैम्प।
        usage:
          type: object
          properties:
            cost:
              type: number
            is_byok:
              type: boolean
          additionalProperties: true
        error:
          nullable: true
    VideoInputReference:
      description: प्रकार सहित HTTPS मीडिया इनपुट। चित्रों के लिए image_url और ऑडियो या वीडियो के लिए media_url उपयोग करें। भूमिकाएँ बताती हैं कि मॉडल इनपुट का कैसे उपयोग करे; समर्थन प्रदाता और मॉडल के अनुसार बदलता है।
