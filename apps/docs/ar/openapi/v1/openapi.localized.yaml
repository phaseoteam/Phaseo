  /batches/{batch_id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResults
      summary: تنزيل نتائج الدفعة
      description: يبث صفوف النتائج الأصلية الكاملة لدى المزوّد بصيغة JSONL لدفعة نهائية مملوكة لمساحة العمل المصادق عليها. يدمج ملفات النجاح والأخطاء ويحوّل النواتج المضمنة ويتبع تقسيم نتائج المزوّد إلى صفحات. استخدم مفتاح API من Phaseo. لا ترسل التنزيلات استدلالاً ولا تضيف رسوم استخدام. تبقى نقاط نهاية الملفات الحالية متاحة. تُحد الصفوف المضمنة بـ8 MiB؛ يجب التخلص من التنزيلات المنقطعة وإعادة تنزيلها. الحد 10 محاولات تنزيل لكل مساحة عمل لكل دفعة ضمن نافذة متحركة من 30 دقيقة، مشتركة بين مفاتيح API والأسماء البديلة. تُحسب المحاولات الفاشلة أو الملغاة لدى المزوّد الأعلى. تتضمن استجابة 429 الترويسة Retry-After بالثواني.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: نتائج JSONL الأصلية للمزوّد
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: غير مصرّح به
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: تم رفض الوصول إلى معاينة الدفعات
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: الدفعة غير موجودة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: نتائج الدفعة غير جاهزة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: تم تجاوز حد تنزيل الدفعة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: الثواني حتى السماح بتنزيل آخر
              schema:
                type: integer
        '501':
          description: تنزيل النتائج مباشرةً غير مدعوم لدى هذا المزوّد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
