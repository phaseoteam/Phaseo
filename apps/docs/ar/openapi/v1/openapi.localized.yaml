            type: string
        items:
          type: array
          description: صيغة مختصرة لموجه منظم. قد تتضمن العناصر `id` و`custom_id` و`prompt` و`messages` و`input` و`system` و`max_tokens` و`temperature` أو`body` متقدماً.
