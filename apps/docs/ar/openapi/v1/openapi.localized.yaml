openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: واجهة API للبوابة تتيح الوصول إلى نماذج ذكاء اصطناعي متنوعة عبر نقاط نهاية متوافقة مع OpenAI.
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: التوجيه العالمي
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: التوجيه العالمي
        - url: https://eu.api.phaseo.app/v1
          description: توجيه إقليمي إلى مزودي الاتحاد الأوروبي (نص فقط)
        - url: https://us.api.phaseo.app/v1
          description: توجيه إقليمي إلى مزودي الولايات المتحدة (نص فقط)
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: عرض نماذج البوابة
      description: يعرض نماذج البوابة المشتركة وغير المخفية. يعرض افتراضيًا النماذج القابلة للتوجيه علنًا حاليًا؛ استخدم `availability=all` لتضمين سجلات التوفر غير القابلة للتوجيه.
      parameters:
        - name: search
          in: query
          description: بحث غير حساس لحالة الأحرف في معرّفات النماذج وأسمائها وأوصافها والمؤسسات.
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: بحث غير حساس لحالة الأحرف عن المزود أو مؤسسة النموذج.
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: اشتراط نمط إدخال مدعوم.
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: اشتراط هذا العدد على الأقل من رموز سياق الإدخال.
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: أقصى سعر بالدولار لكل مليون رمز إدخال.
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: عرض النماذج التي لديها عرض بوابة واحد على الأقل قابل للتوجيه فقط.
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: الحقل المستخدم لترتيب نتائج اكتشاف النماذج.
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: اتجاه ترتيب اختياري. تُرتّب الأسعار تصاعديًا افتراضيًا، والقيم الرقمية الأخرى تنازليًا.
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: التصفية حسب نقاط النهاية
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: التصفية حسب المؤسسة
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: التصفية حسب معرّف المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: التصفية حسب حالة طرح المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: التصفية حسب حالة توجيه المزوّد
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: التصفية حسب حالة توجيه النموذج
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: التصفية حسب حالة قدرات المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: التصفية حسب حالة توفر المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: التصفية حسب سبب توفر المزوّد
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: التصفية حسب حالة النموذج
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: التصفية حسب أنواع الإدخال
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: اسم مستعار عام لـ `input_types`.
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: التصفية حسب أنواع الإخراج
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: اسم مستعار عام لـ `output_types`.
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: التصفية حسب المعلمات
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: اسم مستعار عام لـ `params`.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: مرشح التوفر. يعرض `active` النماذج القابلة للتوجيه علنًا فقط؛ ويشمل `all` سجلات التوفر غير القابلة للتوجيه.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: تحديد عدد النتائج
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: الإزاحة لأغراض ترقيم الصفحات
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: تنسيق الاستجابة. القيمة الافتراضية هي `json`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: اسم مستعار لـ `format`. يقبل `json` أو `rss` أو `atom`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: قائمة النماذج
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: موجز RSS 2.0 بصيغة XML
            application/atom+xml:
              schema:
                type: string
                description: موجز Atom بصيغة XML
        '400':
          description: معلمات الطلب غير صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: غير مصرّح به
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: عرض إمكانات نقاط نهاية النموذج
      description: يعرض صفوف نقاط النهاية الخاصة بالمزوّد لنموذج واحد، بما يشمل المسارات العامة والوسائط والمعلمات المدعومة والتوفر وحالة التوجيه وslugs نماذج المزوّد وملخصات تسعير نقاط النهاية.
      parameters:
        - name: author
          in: path
          required: true
          description: جزء المؤلف أو المؤسسة للنموذج.
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: جزء slug النموذج.
          schema:
            type: string
        - name: provider
          in: query
          description: التصفية حسب معرّف المزوّد.
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: التصفية حسب حالة طرح المزوّد.
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: التصفية حسب حالة توجيه المزوّد.
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: التصفية حسب حالة توجيه النموذج.
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: التصفية حسب حالة قدرات المزوّد.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: التصفية حسب حالة توفر المزوّد.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: التصفية حسب سبب توفر المزوّد.
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: التصفية حسب حالة دورة حياة النموذج المعتمدة.
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: تصفية صفوف نقاط النهاية حسب أسماء المعلمات المدعومة أو الأسماء المستعارة.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: يعرض `active` صفوف نقاط النهاية القابلة للتوجيه علنًا؛ ويشمل `all` أيضًا الصفوف القادمة وغير النشطة.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: صفوف إمكانات نقاط نهاية النموذج
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: معلمات الطلب غير صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: غير مصرّح به
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: لم يتم العثور على نموذج يطابق مرشحات التوفر والمزوّد المطلوبة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/me:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listTeamModels
      summary: عرض نماذج البوابة الخاصة بالفريق
      description: يعرض قائمة نماذج البوابة الخاصة بالفريق. يعرض افتراضيًا النماذج القابلة للتوجيه علنًا؛ استخدم `availability=all` لتضمين سجلات التوفر غير القابلة للتوجيه.
      parameters:
        - name: endpoints
          in: query
          description: التصفية حسب نقاط النهاية
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: التصفية حسب المؤسسة
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: التصفية حسب معرّف المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: التصفية حسب حالة طرح المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: التصفية حسب حالة توجيه المزوّد
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: التصفية حسب حالة توجيه النموذج
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: التصفية حسب حالة قدرات المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: التصفية حسب حالة توفر المزوّد
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: التصفية حسب سبب توفر المزوّد
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: التصفية حسب حالة النموذج
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: التصفية حسب أنواع الإدخال
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: التصفية حسب أنواع الإخراج
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: التصفية حسب المعلمات
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: مرشح التوفر. يعرض `active` النماذج القابلة للتوجيه علنًا فقط؛ ويشمل `all` سجلات التوفر غير القابلة للتوجيه.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: تحديد عدد النتائج
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: الإزاحة لأغراض ترقيم الصفحات
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: تنسيق الاستجابة. القيمة الافتراضية هي `json`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: اسم مستعار لـ `format`. يقبل `json` أو `rss` أو `atom`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: قائمة النماذج
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: موجز RSS 2.0 بصيغة XML
            application/atom+xml:
              schema:
                type: string
                description: موجز Atom بصيغة XML
        '400':
          description: معلمات الطلب غير صالحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: غير مصرّح به
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /providers:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listProviders
      summary: عرض قائمة المزوّدين
      description: يعرض قائمة بمزوّدي واجهات API المتاحين.
      parameters:
        - name: limit
          in: query
          description: تحديد عدد النتائج
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: الإزاحة لأغراض ترقيم الصفحات
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: قائمة المزوّدين
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  limit:
                    type: integer
                    example: 50
                  offset:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 25
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
        '500':
          description: خطأ
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
  /generations:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getGeneration
      summary: استرجاع عملية إنشاء
      description: يسترجع عملية إنشاء محددة باستخدام معرّفها.
      parameters:
        - name: id
          in: query
          required: true
          description: معرّف عملية الإنشاء
          schema:
            type: string
      responses:
        '200':
          description: بيانات عملية الإنشاء
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
        '401':
          description: غير مصرّح به
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  reason:
                    type: string
        '404':
          description: غير موجود
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
  /chat/completions:
    post:
      servers:
        - url: https://api.phaseo.app/v1
          description: التوجيه العالمي
        - url: https://eu.api.phaseo.app/v1
          description: توجيه إقليمي إلى مزودي الاتحاد الأوروبي (نص فقط)
        - url: https://us.api.phaseo.app/v1
          description: توجيه إقليمي إلى مزودي الولايات المتحدة (نص فقط)
      tags:
        - Gateway
      operationId: createChatCompletion
      summary: إنشاء إكمال للمحادثة
      description: ينشئ إكمالًا لرسالة المحادثة.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
            examples:
              datetimeServerTool:
                summary: Built-in datetime server tool
                value:
                  model: openai/gpt-5-nano
                  stream: false
                  messages:
                    - role: user
                      content: What is the current datetime in Europe/London?
                  tools:
                    - type: gateway:datetime
                      parameters:
                        timezone: Europe/London
                  tool_choice: auto
      responses:
        '200':
          description: استجابة إكمال المحادثة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
        '429':
          $ref: '#/components/responses/UpstreamRateLimited'
  /responses:
    post:
      servers:
        - url: https://api.phaseo.app/v1
          description: التوجيه العالمي
        - url: https://eu.api.phaseo.app/v1
          description: توجيه إقليمي إلى مزودي الاتحاد الأوروبي (نص فقط)
        - url: https://us.api.phaseo.app/v1
          description: توجيه إقليمي إلى مزودي الولايات المتحدة (نص فقط)
      tags:
        - Gateway
      operationId: createResponse
      summary: إنشاء استجابة
      description: ينشئ استجابة باستخدام Responses API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
            examples:
              datetimeServerTool:
                summary: Built-in datetime server tool
                value:
                  model: openai/gpt-5-nano
                  stream: false
                  input:
                    - role: user
                      content: Give me the current datetime in Asia/Tokyo.
                  tools:
                    - type: gateway:datetime
                      parameters:
                        timezone: Asia/Tokyo
                  tool_choice: auto
      responses:
        '200':
          description: استجابة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
        '429':
          $ref: '#/components/responses/UpstreamRateLimited'
  /async/{kind}/{id}/ws:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: openAsyncJobWebSocket
      summary: Open async job websocket
      description: |
        Opens a persistent websocket session for owned async batch or video job updates.
        WebSocket handshake uses HTTP GET upgrade semantics and returns `101 Switching Protocols` on success (not `200`). The socket emits a `job.snapshot` immediately after upgrade and subsequent `job.updated` envelopes when the normalized async job payload changes.
        If `close_on_terminal` is enabled, the gateway closes the socket after a terminal `completed`, `failed`, `cancelled`, or `expired` update.
      parameters:
        - name: kind
          in: path
          required: true
          description: Async job kind.
          schema:
            type: string
            enum:
              - batch
              - video
        - name: id
          in: path
          required: true
          description: Gateway-owned async job id.
          schema:
            type: string
        - name: interval_ms
          in: query
          required: false
          description: Polling interval used by the websocket recovery loop.
          schema:
            type: integer
            minimum: 1000
            maximum: 10000
            default: 2500
        - name: close_on_terminal
          in: query
          required: false
          description: Close the socket after a terminal lifecycle update.
          schema:
            type: boolean
            default: true
      responses:
        '101':
          description: WebSocket upgrade accepted.
          x-websocket:
            clientEvent:
              $ref: '#/components/schemas/AsyncJobWebSocketClientEvent'
            serverEvent:
              $ref: '#/components/schemas/AsyncJobWebSocketServerEvent'
        '401':
          description: غير مصرّح به
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Async job not found or not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '426':
          description: WebSocket upgrade required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobWebSocketUpgradeRequiredResponse'
