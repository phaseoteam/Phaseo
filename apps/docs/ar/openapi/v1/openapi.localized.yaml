    VideoGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        duration:
          type: integer
          description: المدة المطلوبة بالثواني (تعتمد على المزوّد/النموذج).
        input_video_duration:
          type: number
          format: double
          minimum: 0
          maximum: 3600
          exclusiveMinimum: true
          description: مدة الفيديو المصدر بالثواني. مطلوبة عندما يفوتر المزوّد مدة الفيديو المصدر بشكل مستقل عن الناتج المُنشأ.
        input_audio_duration:
          type: number
          format: double
          minimum: 2
          maximum: 20
          description: مدة الصوت المصدر المعلنة بالثواني، المستخدمة للتحقق من نطاق المزوّد. قد يفوتر المزوّدون الذين لا يبلغون عن الاستخدام المعتمد وفق الحد الأعلى لمدة الإدخال المدعومة لديهم.
        size:
          type: string
          description: أبعاد صريحة (مثل 1280x720). لا يمكن دمجها مع resolution أو aspect_ratio.
        resolution:
          type: string
          description: 480p و720p و1080p و1K و2K و4K. يمكن دمجها مع aspect_ratio. لا يمكن دمجها مع size.
        aspect_ratio:
          type: string
          description: نسبة أبعاد مثل 16:9 أو9:16 أو1:1. يمكن دمجها مع resolution. لا يمكن دمجها مع size.
        seed:
          type: integer
        sample_count:
          type: integer
          minimum: 1
          maximum: 4
        negative_prompt:
          type: string
        generate_audio:
          type: boolean
        enhance_prompt:
          type: boolean
        compression_quality:
          type: integer
        person_generation:
          type: string
        resize_mode:
          type: string
        input_references:
          type: array
          description: مدخلات صور أو صوت أو فيديو عبر HTTPS لتوجيه الإنشاء. تعتمد الأنواع والأدوار والأعداد والتركيبات المدعومة على النموذج المحدد. تحقق من GET /videos/models قبل إرسال مهمة. يقبل الاسم البديل المفرد للتوافق input_reference، غير المدرج في هذا المخطط، صورة multipart أو كائناً يتضمن واحداً فقط من file_id أو image_url. يعتمد الدعم على المزوّد.
          items:
            $ref: '#/components/schemas/VideoInputReference'
        frame_images:
          type: array
          minItems: 1
          maxItems: 2
          description: صور HTTPS للإطار الأول/الأخير. يمكن أن يظهر كل frame_type مرة واحدة. لا تقدم أيضاً input_reference أو أدوار الإطارات ضمن input_references.
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - frame_type
              - image_url
            properties:
              type:
                type: string
                enum:
                  - image_url
              frame_type:
                type: string
                enum:
                  - first_frame
                  - last_frame
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        provider_params:
          type: object
          additionalProperties: true
          description: امتدادات خاصة بالمزوّد فقط. يُرفض تمرير الطلب كاملاً وتكرار حقول التوجيه أو الموجه أو رد الاتصال أو الفوترة.
        provider_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: امتدادات بمفاتيح معرّفات المزوّدين الأساسية (مثل atlascloud أو byteplus). تُمرر خيارات المزوّد المحدد فقط. لا يمكن دمجها مع provider_params. يجب أن تستخدم حقول التوجيه والموجه ورد الاتصال والمدة والدقة وعدد النواتج حقول المستوى الأعلى التي تم التحقق منها.
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: نقطة نهاية webhook نشطة تديرها مساحة العمل. لا يُخزن سر التوقيع المشفر والقابل للتدوير في بيانات مهمة الفيديو الوصفية أبداً.
            events:
              type: array
              description: اشتراكات اختيارية في الأحداث. استخدم أحداث job.* العامة أو أحداث video.* المطابقة، مثل video.status_changed أوvideo.progress أوvideo.completed. عند الإغفال تُستخدم job.status_changed وأحداث job.* النهائية. أدرج job.progress أوvideo.progress صراحةً لردود اتصال التقدم. عند توفير القائمة يجب أن يكون حدث واحد على الأقل صالحاً لمهام الفيديو؛ تُرفض القوائم غير الصحيحة أو التي تحتوي فقط على أحداث من نوع آخر.
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: ملخص تسليم عام لخطافات webhook غير المتزامنة التي تديرها البوابة. استخدمه للتمييز بين حالة تنفيذ المهمة وسلامة تسليم webhook.
