openapi: 3.0.3
info:
  title: Phaseo Gateway API
  version: 1.0.0
servers:
  - url: https://api.phaseo.app/v1
security:
  - BearerAuth: []
paths:
  /apps:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listWorkspaceApps
      summary: عرض قائمة تطبيقات مساحة العمل
      description: يعرض تطبيقات مساحة العمل المنسوبة تلقائيًا وبياناتها الوصفية القابلة للتحرير. يتطلب الإذن `settings:read`.
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        '200':
          description: تطبيقات مساحة العمل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceAppListResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/publisher:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getPresetPublisher
      summary: الحصول على معرّف ناشر الإعدادات المسبقة
      description: يعيد المعرّف الأساسي لناشر الإعدادات المسبقة العامة لمساحة العمل.
      responses:
        '200':
          description: معرّف الناشر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetPublisherResponse'
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: updatePresetPublisher
      summary: تحديث معرّف ناشر الإعدادات المسبقة
      description: يعيد تسمية معرّف ناشر مساحة العمل مع الاحتفاظ بالمعرّف السابق كاسم مستعار.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetPublisherUpdateRequest'
      responses:
        '200':
          description: تم تحديث معرّف الناشر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetPublisherResponse'
        '400':
          description: معرّف الناشر غير صالح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: معرّف الناشر غير متاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /audio/speech:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createSpeech
      summary: إنشاء كلام صوتي
      description: ينشئ صوتًا من النص المُدخل.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AudioSpeechRequest'
      responses:
        '200':
          description: ملف صوتي
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
  /audio/transcriptions:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createTranscription
      summary: إنشاء تفريغ صوتي
      description: يفرّغ الصوت كتابةً باللغة المُدخلة.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranscriptionRequest'
      responses:
        '200':
          description: استجابة التفريغ الصوتي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranscriptionResponse'
  /audio/translations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createTranslation
      summary: إنشاء ترجمة
      description: يترجم الصوت إلى الإنجليزية.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AudioTranslationRequest'
      responses:
        '200':
          description: استجابة الترجمة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioTranslationResponse'
  /images/generations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createImage
      summary: إنشاء صورة
      description: ينشئ صورة استنادًا إلى موجّه.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesGenerationRequest'
      responses:
        '200':
          description: استجابة الصورة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesGenerationResponse'
  /images/edits:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createImageEdit
      summary: إنشاء تعديل صورة
      description: ينشئ صورة معدّلة أو موسّعة استنادًا إلى صورة أصلية وموجّه.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImagesEditRequest'
      responses:
        '200':
          description: استجابة تعديل الصورة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesEditResponse'
  /ocr:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createOcr
      summary: إجراء OCR
      description: يستخرج النص من صورة باستخدام النموذج المطلوب.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OcrRequest'
      responses:
        '200':
          description: استجابة OCR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrResponse'
  /music/generate:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: generateMusic
      summary: إنشاء موسيقى
      description: ينشئ الموسيقى عبر endpoint واحد مستقل عن المزوّد. تنتظر Phaseo المزوّدين المتزامنين وتتولى داخليًا الاستعلام المتكرر عن قوائم انتظارهم.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicGenerateRequest'
      responses:
        '200':
          description: استجابة إنشاء الموسيقى
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicGenerateResponse'
  /endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listEndpoints
      summary: عرض نقاط النهاية
      description: يعرض معرّفات نقاط نهاية البوابة المستندة إلى الإمكانات، مع المسارات العامة ومجموعات الوسائط المتعددة وأعداد النماذج والمزوّدين ونماذج أمثلة.
      responses:
        '200':
          description: بيانات وصفية لنقاط النهاية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCatalogueResponse'
  /files:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listFiles
      summary: عرض الملفات
      description: تعيد هذه الواجهة حاليًا `not_supported` عند استخدام مفتاح البوابة المشترك. احفظ معرّفات الملفات التي رفعتها واسترجع الملفات مباشرةً بدلًا من ذلك.
      responses:
        '400':
          description: قائمة الملفات غير مدعومة في وضع البوابة الحالي
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: غير مصرّح به
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pricing/models:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listPricingModels
      summary: عرض أسعار النماذج
      description: يعيد إدخالات أسعار المزوّدين والنماذج النشطة.
      responses:
        '200':
          description: قائمة أسعار النماذج
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  models:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '500':
          description: خطأ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /moderations:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createModeration
      summary: إجراء مراجعة
      description: يصنّف ما إذا كان النص ينتهك سياسات استخدام OpenAI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerationsRequest'
      responses:
        '200':
          description: استجابة المراجعة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationsResponse'
  /embeddings:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createEmbedding
      summary: إنشاء تمثيلات متجهية
      description: ينشئ متجهًا تمثيليًا للنص المُدخل.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
      responses:
        '200':
          description: استجابة التمثيلات المتجهية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
  /rerank:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createRerank
      summary: إعادة ترتيب المستندات
      description: يعيد ترتيب قائمة من المستندات وفقًا لمدى صلتها بالاستعلام.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankRequest'
      responses:
        '200':
          description: استجابة إعادة الترتيب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankResponse'
  /parse:
    post:
      tags:
        - Gateway
      operationId: createParse
      summary: تحليل صورة مستند
      description: يحلّل صورة المستند إلى Markdown أو كتل محتوى مرتبة. تقبل Cohere Parse API الحالية روابط الصور البعيدة وURI لبيانات الصور بترميز base64؛ ولا تدعم بعد إدخالات PDF أو روابط الملفات.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseRequest'
      responses:
        '200':
          description: مستند تم تحليله
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResponse'
  /budgets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceBudget
      summary: حذف ميزانية مساحة العمل
      description: يزيل حد الإنفاق لمساحة العمل ويتوقف عن تطبيقه خلال تلك الفترة.
      responses:
        '200':
          description: تم حذف ميزانية مساحة العمل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetDeleteResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getWorkspaceBudget
      summary: الحصول على ميزانية مساحة العمل
      description: يعرض حداً أقصى واحداً للإنفاق في مساحة العمل مع الاستخدام الحالي والمبلغ المتبقي.
      responses:
        '200':
          description: ميزانية مساحة العمل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceBudget
      summary: تحديث ميزانية مساحة العمل
      description: يغيّر الفترة أو الحد بالدولار الأمريكي لميزانية مساحة عمل موجودة.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceBudgetUpdateInput'
      responses:
        '200':
          description: تم تحديث ميزانية مساحة العمل
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceBudgetResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /byok/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteProviderCredential
      summary: حذف بيانات اعتماد المزوّد
      description: يحذف بيانات اعتماد المزوّد نهائيًا. تكرار الحذف آمن.
      responses:
        '200':
          description: تم حذف بيانات اعتماد المزوّد أو لم تكن موجودة أصلًا
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialDeleteResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getProviderCredential
      summary: الحصول على بيانات اعتماد للمزوّد
      description: يعرض بيانات وصفية آمنة دون كشف الحقول المشفرة أو السر الخام.
      responses:
        '200':
          description: بيانات اعتماد المزوّد الوصفية
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateProviderCredential
      summary: تحديث بيانات اعتماد المزوّد
      description: يحدّث البيانات الوصفية لبيانات الاعتماد أو مرشحاتها أو مجموعة التوجيه، أو يستبدل السر المخصص للكتابة فقط.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialUpdateRequest'
      responses:
        '200':
          description: تم تحديث بيانات اعتماد المزوّد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredentialResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/departments/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceDepartment
      summary: حذف قسم من مساحة العمل
      description: يحذف قسمًا تتم إدارته يدويًا. لا يمكن حذف الأقسام المتزامنة مع الدليل من هنا.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: تم حذف القسم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceDepartment
      summary: تحديث قسم مساحة العمل
      description: يحدّث اسم القسم أو وصفه أو أيقونته أو لونه دون إزالة تعيينه في الدليل.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceDepartmentUpdateRequest'
      responses:
        '200':
          description: تم تحديث القسم
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDepartmentResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /identity/group-mappings/{id}:
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteWorkspaceGroupMapping
      summary: حذف تعيين مجموعة الدليل
      description: يزيل تعيين مجموعة تم توفيره مسبقًا من مساحة العمل.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: تم حذف تعيين المجموعة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceGroupMapping
      summary: تحديث تعيين مجموعة الدليل
      description: يحدّث دور الوصول أو موضع القسم الذي يعيّنه التعيين.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceGroupMappingUpdateRequest'
      responses:
        '200':
          description: تم تحديث تعيين المجموعة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceGroupMappingResponse'
        default:
          description: فشل الطلب
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /data-contribution/classifiers/{id}:
    parameters:
      - $ref: '#/components/parameters/DataContributionClassifierId'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteDataContributionClassifier
      summary: حذف مصنّف مساهمة البيانات
      description: يحذف مصنّفًا مخصصًا. لا يمكن حذف مصنّف البدء المضمّن.
      responses:
        '200':
          description: تم حذف المصنّف
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContributionClassifierDeleteResponse'
        default:
          description: فشل الطلب أو أن الميزة غير متاحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateDataContributionClassifier
      summary: تحديث مصنّف مساهمات البيانات
      description: يحدّث مصنّفاً مخصصاً لمساحة العمل. يتطلب `settings:write` وإمكانية الوصول إلى الميزة.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataContributionClassifierUpdateRequest'
      responses:
        '200':
          description: تم تحديث المصنّف
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContributionClassifierResponse'
        default:
          description: فشل الطلب أو الميزة غير متاحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /oauth-clients/{client_id}:
    parameters:
      - $ref: '#/components/parameters/OAuthClientId'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteOAuthClient
      summary: حذف عميل OAuth
      description: يحذف العميل بعد إلغاء أذوناته النشطة.
      responses:
        '200':
          description: تم حذف عميل OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientDeleteResponse'
        default:
          description: فشل الطلب أو أن الميزة غير متاحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getOAuthClient
      summary: الحصول على عميل OAuth
      description: يعيد تطبيق OAuth نشطًا. يتطلب `oauth_clients:read` وميزة OAuth التجريبية.
      responses:
        '200':
          description: عميل OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        default:
          description: فشل الطلب أو أن الميزة غير متاحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateOAuthClient
      summary: تحديث عميل OAuth
      description: يحدّث بيانات تطبيق OAuth الوصفية أو نطاقاته أو عناوين URI لإعادة التوجيه. يلزم `oauth_clients:write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientUpdateRequest'
      responses:
        '200':
          description: تم تحديث عميل OAuth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClient'
        default:
          description: فشل الطلب أو الميزة غير متاحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhook-endpoints/{id}:
