            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: رقم المحاولة لمفتاح التسليم هذا، بدءاً من واحد.
        max_attempts:
          type: integer
          description: الحد الأقصى للمحاولات قبل وضع علامة فشل دائم على التسليم.
        tried_at:
