          description: طابع ISO الزمني عند نجاح تسليم هذه المحاولة.
        next_retry_at:
          type: string
          nullable: true
          description: طابع ISO الزمني لإعادة المحاولة التالية بعد هذه المحاولة، إن جُدولت.
        response_status:
