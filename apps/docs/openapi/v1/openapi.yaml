      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required:
            - key
          properties:
            key:
              type: string
              description: Plaintext API key. Returned only once at creation time.
              example: phaseo_v1_sk_abcd1234_supersecretvalue
          additionalProperties: false
