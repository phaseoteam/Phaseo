    ApiKeyCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          example: Analytics Service Key
        workspace_id:
          type: string
          format: uuid
          description: Optional workspace override for internal callers.
        scopes:
          $ref: '#/components/schemas/ApiKeyScopeValue'
        limit:
          type: number
          minimum: 0
          nullable: true
          description: Optional spend limit in USD for this key.
        limit_reset:
          type: string
          enum:
            - daily
            - weekly
            - monthly
          description: Period used for the spend limit window.
        include_byok_in_limit:
          type: boolean
          description: >-
            Accepted for compatibility. Current Phaseo behavior always excludes
            BYOK from this limit field.
        expires_at:
          type: string
          format: date-time
          nullable: true
        disabled:
          type: boolean
          default: false
        soft_blocked:
          type: boolean
          default: false
        limits:
          $ref: '#/components/schemas/ApiKeyLimitInputWindows'
      additionalProperties: false
    ApiKeyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        scopes:
          $ref: '#/components/schemas/ApiKeyScopeValue'
        limit:
          type: number
          minimum: 0
          nullable: true
          description: Optional spend limit in USD for this key. Set null to clear.
        limit_reset:
          type: string
          enum:
            - daily
            - weekly
            - monthly
          description: Period used for the spend limit window.
        include_byok_in_limit:
          type: boolean
          description: >-
            Accepted for compatibility. Current Phaseo behavior always excludes
            BYOK from this limit field.
