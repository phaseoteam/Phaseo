  /batches/{batch_id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResults
      summary: Download batch results
      description: >-
        Streams complete provider-native result rows as JSONL for a terminal
        batch owned by the authenticated workspace. Combines success and error
        files, converts inline outputs, and follows provider result pagination.
        Use a Phaseo API key. Downloads do not submit inference or add usage
        charges. Existing file endpoints remain available. Inline rows are
        limited to 8 MiB; interrupted downloads must be discarded and downloaded
        again. Limited to 10 download attempts per workspace per batch in a
        rolling 30-minute window, shared across API keys and aliases. Failed or
        cancelled upstream attempts count. A 429 response includes Retry-After
        in seconds.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Original provider JSONL results
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Batch preview access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Batch results are not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Batch download limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Seconds until another download is allowed
              schema:
                type: integer
        '501':
          description: Direct results downloads are not supported for this provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Provider results could not be retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Download admission temporarily unavailable; retry after 30 seconds
          content:
            application/json:
              schema:
