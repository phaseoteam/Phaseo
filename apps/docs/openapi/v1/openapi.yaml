    AsyncJobWebSocketClientEvent:
      type: object
      description: Client message for async job websocket sessions.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ping
            - refresh
          description: >
            Send `ping` for a `pong` keepalive response, or `refresh` to force
            an immediate async job state refresh.
      additionalProperties: false
    AsyncJobWebSocketServerEvent:
      type: object
      description: >
        Async job websocket envelope. `job.snapshot` is emitted immediately
        after upgrade, `job.updated` is emitted when the normalized async
        payload changes, `job.deleted` is emitted when the owned job record
        disappears, and `pong` replies to client `ping` messages.
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - job.snapshot
            - job.updated
            - job.deleted
            - pong
        data:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/VideoGenerationResponse'
            - $ref: '#/components/schemas/BatchResponse'
            - type: object
              properties:
                id:
                  type: string
                kind:
                  type: string
                  enum:
                    - batch
                    - video
              additionalProperties: true
      additionalProperties: true
