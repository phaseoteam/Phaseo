  /analytics:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getActivityAlias
      summary: Get workspace analytics
      description: >-
        Returns cost, request, and token aggregates grouped by date, model,
        provider, and endpoint for the last 30 completed UTC days.
      parameters:
        - name: date
          in: query
          description: >-
            Filter by a single UTC date in the last 30 completed days
            (YYYY-MM-DD).
          schema:
            type: string
            format: date
        - name: label_key
          in: query
          description: >-
            Request-label key to include in the spend slice. Must be provided
            together with label_value.
          schema:
            type: string
            maxLength: 64
            pattern: ^[A-Za-z0-9_.:-]{1,64}$
        - name: label_value
          in: query
          description: >-
            Request-label value to include in the spend slice. Must be provided
            together with label_key.
          schema:
            type: string
            maxLength: 256
        - name: key_id
          in: query
          description: Filter by API key identifier.
          schema:
            type: string
        - name: end_user_id
          in: query
          description: Filter by application-defined end-user identifier.
          schema:
            type: string
            maxLength: 256
        - name: model
          in: query
          description: Filter by requested or routed canonical model slug.
          schema:
            $ref: '#/components/schemas/ModelId'
        - name: provider
          in: query
          description: Filter by provider slug.
          schema:
            type: string
            maxLength: 128
        - name: endpoint
          in: query
          description: Filter by gateway endpoint identifier.
          schema:
            type: string
            maxLength: 128
        - name: byok
          in: query
          description: Filter managed or BYOK traffic.
          schema:
            type: boolean
        - name: success
          in: query
          description: Filter successful or failed requests.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Offset'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: Retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          description: Bad Request Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
