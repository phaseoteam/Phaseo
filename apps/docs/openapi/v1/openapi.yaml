        - prefix
        - status
        - scopes
        - created_at
        - key
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        status:
          type: string
          enum:
            - active
            - paused
        scopes:
          type: array
          items:
            type: string
        created_by:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        soft_blocked:
          type: boolean
          nullable: true
        daily_limit_requests:
          type: integer
          format: int64
          nullable: true
        weekly_limit_requests:
          type: integer
          format: int64
          nullable: true
        monthly_limit_requests:
          type: integer
          format: int64
          nullable: true
        daily_limit_cost_nanos:
          type: integer
          format: int64
          nullable: true
        weekly_limit_cost_nanos:
          type: integer
          format: int64
          nullable: true
        monthly_limit_cost_nanos:
          type: integer
          format: int64
          nullable: true
        key:
          type: string
          description: Raw management key. Returned only once.
      additionalProperties: false
    ManagementKeyRuntimeCreateResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ManagementKeyRuntimeCreated'
      additionalProperties: false
    ManagementKeyRuntimeDeleteResponse:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: boolean
          enum:
            - true
      additionalProperties: false
    ManagementKeyCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name for the key.
        team_id:
          type: string
          description: Team scope for internal callers.
        created_by:
          type: string
          description: Creator user ID for internal callers.
        scopes:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        status:
          type: string
          enum:
            - active
            - disabled
            - revoked
        soft_blocked:
          type: boolean
      additionalProperties: false
    ManagementKeyUpdateRequest:
      type: object
      properties:
        name:
          type: string
          description: New name for the key
        status:
          type: string
          enum:
            - active
            - disabled
            - revoked
          description: New status for the key
        soft_blocked:
          type: boolean
          description: Whether to temporarily block the key
      additionalProperties: false
    ManagementKeyListResponse:
      type: object
      required:
        - ok
        - limit
        - offset
        - total
        - keys
      properties:
        ok:
          type: boolean
          enum:
            - true
        limit:
          type: integer
          minimum: 1
          maximum: 250
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ProvisioningKey'
      additionalProperties: false
    ManagementKeyCreateResponse:
      type: object
      required:
        - ok
        - key
      properties:
        ok:
          type: boolean
          enum:
            - true
        key:
          $ref: '#/components/schemas/ProvisioningKeyWithValue'
      additionalProperties: false
    ManagementKeyDetailResponse:
      type: object
      required:
        - ok
        - key
      properties:
        ok:
          type: boolean
          enum:
            - true
        key:
          $ref: '#/components/schemas/ProvisioningKeyDetail'
      additionalProperties: false
    ManagementKeyUpdateResponse:
      type: object
      required:
        - ok
        - message
      properties:
        ok:
          type: boolean
          enum:
            - true
        message:
          type: string
          example: Key updated successfully
