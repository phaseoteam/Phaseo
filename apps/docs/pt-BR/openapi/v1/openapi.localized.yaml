              type: number
            is_byok:
              type: boolean
          additionalProperties: true
        error:
          nullable: true
    VideoInputReference:
      description: Entrada de mídia HTTPS tipada. Use image_url para imagens e media_url para áudio ou vídeo. As funções descrevem como o modelo deve usar a entrada; o suporte varia por provedor e modelo.
