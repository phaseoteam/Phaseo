    BatchRequest:
      type: object
      properties:
        provider_options:
          type: object
          description: Extensões delimitadas pelo ID canônico do provedor. OpenAI aceita output_expires_after; Mistral aceita metadata. Somente as opções do provedor selecionado são aplicadas. Não duplique uma opção no nível superior. As opções não podem substituir linhas precificadas, modelos ou arquivos.
          additionalProperties:
            type: object
            additionalProperties: true
        model:
          type: string
          description: ID do modelo usado para inferir o provedor do lote. As linhas de solicitação também podem incluir body.model; o modelo de nível superior é preferido.
        prompts:
          type: array
          description: Formato abreviado de prompt simples. Phaseo compila cada prompt em uma linha de lote nativa do provedor para o modelo selecionado.
          items:
            type: string
        items:
          type: array
          description: Formato abreviado de prompt estruturado. Os itens podem incluir `id`, `custom_id`, `prompt`, `messages`, `input`, `system`, `max_tokens`, `temperature` ou um `body` avançado.
          items:
            type: object
            additionalProperties: true
        system:
          type: string
          description: Instrução de sistema opcional aplicada às linhas de prompt abreviado.
        max_tokens:
          type: integer
          description: Limite máximo opcional de tokens aplicado às linhas de prompt abreviado.
        temperature:
          type: number
          description: Temperatura de amostragem opcional aplicada às linhas de prompt abreviado.
        input_file_id:
          type: string
          description: ID de arquivo existente no provedor para criar lotes por envio de arquivo.
        requests:
          type: array
          description: Linhas avançadas de solicitação em lote. Forneça exatamente um de `prompts`, `items`, `requests` ou `input_file_id`.
          items:
            $ref: '#/components/schemas/BatchRequestItem'
        endpoint:
          type: string
          enum:
            - /v1/chat/completions
            - /v1/responses
            - /v1/messages
            - /v1/embeddings
            - /v1/generateContent
          description: Formato de solicitação para o cliente. Toda solicitação de um lote usa este endpoint. Quando omitido, Phaseo escolhe um padrão nativo do provedor pelo modelo.
        completion_window:
          type: string
        metadata:
          type: object
          additionalProperties: true
        session_id:
          type: string
          maxLength: 256
          description: Identificador exclusivo para agrupar solicitações relacionadas (por exemplo, uma conversa ou um fluxo de trabalho de agente) para observabilidade.
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: ID do endpoint de webhook gerenciado pelo espaço de trabalho.
            events:
              type: array
              description: Assinaturas opcionais de eventos. Use eventos genéricos job.* ou eventos batch.* correspondentes, como batch.progress ou batch.completed. Quando omitidos, são usados eventos finais job.*. Inclua job.progress ou batch.progress explicitamente para callbacks de progresso da contagem de solicitações. Quando fornecidos, pelo menos um evento deve ser válido para trabalhos de lote; listas malformadas ou somente com eventos de outro tipo são rejeitadas.
              items:
                type: string
        webhook_endpoint_id:
          type: string
          description: Alias de conveniência para webhook.endpoint_id.
        debug:
          $ref: '#/components/schemas/DebugOptions'
        provider:
          allOf:
            - $ref: '#/components/schemas/ProviderRoutingOptions'
          description: Restrição avançada de roteamento. A maioria das solicitações deve usar a inferência do provedor baseada no modelo.
