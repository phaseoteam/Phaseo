        limit_reset:
          type: string
          enum:
            - daily
            - weekly
            - monthly
          description: Período usado para a janela do limite de gastos.
        include_byok_in_limit:
          type: boolean
          description: Aceito por compatibilidade. O comportamento atual do Phaseo sempre exclui o BYOK deste limite.
        expires_at:
          type: string
          format: date-time
          nullable: true
        disabled:
          type: boolean
        soft_blocked:
          type: boolean
        limits:
          $ref: '#/components/schemas/ApiKeyLimitInputWindows'
      additionalProperties: false
    ApiKeyRotateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          description: Nome opcional da chave substituta.
        previous_key_expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiração opcional da chave anterior. Omita para mantê-la sem alterações.
