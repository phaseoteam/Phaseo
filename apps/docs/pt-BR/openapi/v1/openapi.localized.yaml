tags:
  - name: Gateway
    description: Core Phaseo Gateway operations.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Autenticação com token Bearer
  responses:
    UpstreamRateLimited:
      description: O provedor upstream selecionado limitou a taxa de solicitações.
      headers:
        Retry-After:
          description: Orientação validada do provedor, em segundos, antes de tentar novamente.
          schema:
            type: integer
            minimum: 0
            maximum: 86400
        X-Phaseo-Upstream-RateLimit-Limit:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Limit-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset-Requests:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Limit-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Remaining-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
        X-Phaseo-Upstream-RateLimit-Reset-Tokens:
          $ref: '#/components/headers/UpstreamRateLimitValue'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    PublicRequestId:
      description: Identificador público de solicitação gerado pelo servidor. Em solicitações de inferência, é o ID da geração usado nas respostas e nos registros. Valores x-request-id enviados pelo cliente não o substituem.
      schema:
        type: string
        pattern: ^G-[0-9A-HJKMNP-TV-Z]{26}$
    UpstreamRateLimitValue:
      description: Metadados de cota do provedor apenas para BYOK. Omitidos em solicitações feitas por provedores gerenciados.
      schema:
        type: string
  parameters:
    DataContributionClassifierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OAuthClientId:
      name: client_id
      in: path
      required: true
      schema:
        type: string
    WebhookEndpointId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GuardrailId:
      name: id
      in: path
      required: true
      description: Identificador do guardrail.
      schema:
        type: string
        format: uuid
    DynamicRouteId:
      name: id
      in: path
      required: true
      description: Identificador da rota dinâmica.
      schema:
        type: string
        format: uuid
    DynamicRouteVersion:
      name: version
      in: path
      required: true
      description: Versão imutável da rota dinâmica.
      schema:
        type: integer
        minimum: 1
    PresetId:
      name: id
      in: path
      required: true
      description: UUID, slug ou nome canônico da predefinição.
      schema:
        type: string
    ObservabilityDestinationId:
      name: id
      in: path
      required: true
      description: Identificador do destino de observabilidade.
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      required: false
      description: Número de registros a ignorar.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit100:
      name: limit
      in: query
      required: false
      description: Número máximo de registros a retornar.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    WorkspaceId:
      name: id
      in: path
      required: true
      description: UUID ou slug do espaço de trabalho.
      schema:
        type: string
    WorkspaceJoinRequestId:
      name: request_id
      in: path
      required: true
      description: Identificador da solicitação de ingresso.
      schema:
        type: string
        format: uuid
  schemas:
    ProviderRoutingOptions:
      type: object
      description: Preferências de roteamento de provedores para seleção pelo gateway.
      properties:
        order:
          type: array
          items:
            type: string
        only:
          type: array
          items:
            type: string
        ignore:
          type: array
          items:
            type: string
        include_alpha:
          type: boolean
          description: Incluir provedores alpha no roteamento (desativado por padrão).
        allow_fallbacks:
          type: boolean
          nullable: true
          description: Permitir fallback para outro provedor elegível após uma falha.
        require_parameters:
          type: boolean
          nullable: true
          description: Exigir suporte do provedor aos parâmetros solicitados antes do roteamento.
        required_execution_region:
          type: string
          nullable: true
          description: Restringir o roteamento a provedores com a região de execução solicitada.
        required_data_region:
          type: string
          nullable: true
          description: Restringir o roteamento a provedores com a região de dados solicitada.
        require_zero_data_retention:
          type: boolean
          nullable: true
          description: Restringir o roteamento a provedores que oferecem retenção zero de dados.
        data_collection:
          type: string
          nullable: true
          enum:
            - allow
            - deny
        zdr:
          type: boolean
          nullable: true
        enforce_distillable_text:
          type: boolean
          nullable: true
        quantizations:
          type: array
          nullable: true
          items:
            type: string
        sort:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: Classificar os provedores para esta solicitação, por exemplo, por preço, latência ou throughput.
        max_price:
          type: object
          properties:
            prompt:
              oneOf:
                - type: number
                - type: string
            completion:
              oneOf:
                - type: number
                - type: string
            image:
              oneOf:
                - type: number
                - type: string
            audio:
              oneOf:
                - type: number
                - type: string
            request:
              oneOf:
                - type: number
                - type: string
        preferred_min_throughput:
          oneOf:
            - type: number
            - type: object
              additionalProperties:
                type: number
        preferred_max_latency:
          oneOf:
            - type: number
            - type: object
              additionalProperties:
                type: number
    DebugOptions:
      type: object
