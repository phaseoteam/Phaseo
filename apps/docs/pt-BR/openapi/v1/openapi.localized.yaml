        content_url:
          type: string
          description: Presente quando output_access inclui bytes (endpoint autenticado).
        download_url:
          type: string
          nullable: true
          description: URL assinada de primeira parte para download direto quando o status é completed.
        expires_at:
          type: integer
          nullable: true
