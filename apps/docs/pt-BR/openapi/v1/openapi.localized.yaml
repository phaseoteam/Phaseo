            maxLength: 64
            pattern: ^[A-Za-z0-9_.:-]{1,64}$
        - name: label_value
          in: query
          description: Valor de rótulo de solicitação a incluir no recorte de gastos. Deve ser fornecido junto com label_key.
          schema:
            type: string
            maxLength: 256
