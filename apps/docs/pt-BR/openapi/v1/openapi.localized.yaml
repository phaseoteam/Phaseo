              $ref: '#/components/schemas/PresetVersionPublishRequest'
      responses:
        '201':
          description: Versão da predefinição publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetVersionResponse'
        '400':
          description: Rótulo de versão inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Predefinição não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Não há alterações no rascunho para publicar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/fork:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: forkPreset
      summary: Criar uma cópia de uma predefinição pública
      description: Copia a versão pública ativa ou selecionada para o espaço de trabalho de gerenciamento como uma predefinição privada.
      parameters:
        - $ref: '#/components/parameters/PresetId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetForkRequest'
      responses:
        '201':
          description: Cópia derivada da predefinição criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetResponse'
        '400':
          description: A versão de origem selecionada não está disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Predefinição pública de origem não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Não foi possível gerar um nome ou slug de destino exclusivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /presets/{id}/upstream:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: applyPresetUpstreamVersion
      summary: Aplicar uma versão upstream da predefinição
      description: Aplica uma versão pública upstream ao rascunho de uma cópia local sem publicá-la.
      parameters:
        - $ref: '#/components/parameters/PresetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresetUpstreamApplyRequest'
      responses:
        '200':
          description: Versão upstream aplicada ao rascunho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresetUpstreamApplyResponse'
        '400':
          description: '`version_id` é obrigatório'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Predefinição não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Há alterações no rascunho local ou a versão upstream não está disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /settings:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getWorkspaceSettings
      summary: Obter as configurações do espaço de trabalho
      description: Retorna os padrões automatizáveis do espaço de trabalho para roteamento, provedores, privacidade e gateway.
      responses:
        '200':
          description: Configurações do espaço de trabalho
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateWorkspaceSettings
      summary: Atualizar as configurações do espaço de trabalho
      description: Atualiza os padrões de roteamento, provedores, privacidade ou gateway do espaço de trabalho e atualiza os caches de políticas de gateway afetados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceSettingsUpdateRequest'
      responses:
        '200':
          description: Configurações do espaço de trabalho atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSettingsResponse'
        '400':
          description: Configurações do espaço de trabalho inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listDynamicRoutes
      summary: Listar rotas dinâmicas
      description: Lista as rotas dinâmicas versionadas do espaço de trabalho e as chaves de API vinculadas.
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: Lista de rotas dinâmicas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteListResponse'
        '400':
          description: Paginação inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: createDynamicRoute
      summary: Criar rota dinâmica
      description: Cria uma rota dinâmica com sua primeira versão de configuração imutável.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteCreateRequest'
      responses:
        '201':
          description: Rota dinâmica criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '400':
          description: Rota dinâmica inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O nome ou slug da rota já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}:
    parameters:
      - $ref: '#/components/parameters/DynamicRouteId'
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: getDynamicRoute
      summary: Obter rota dinâmica
      description: Retorna uma rota dinâmica do espaço de trabalho com versões e chaves de API vinculadas.
      responses:
        '200':
          description: Rota dinâmica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '404':
          description: Rota dinâmica não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      x-beta: true
      tags:
        - Gateway
      operationId: updateDynamicRoute
      summary: Atualizar rota dinâmica
      description: Atualiza os metadados da rota e cria uma nova versão imutável quando a configuração muda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteUpdateRequest'
      responses:
        '200':
          description: Rota dinâmica atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteResponse'
        '400':
          description: Rota dinâmica inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Rota dinâmica não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      x-beta: true
      tags:
        - Gateway
      operationId: deleteDynamicRoute
      summary: Excluir rota dinâmica
      description: Exclui permanentemente uma rota e atualiza os contextos de todas as chaves de API anteriormente vinculadas.
      parameters:
        - name: confirm_name
          in: query
          required: false
          description: Confirmação opcional do nome exato da rota.
          schema:
            type: string
      responses:
        '200':
          description: Rota dinâmica excluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeleteResponse'
        '404':
          description: Rota dinâmica não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: O nome de confirmação da rota não corresponde
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/keys:
    put:
      x-beta: true
      tags:
        - Gateway
      operationId: replaceDynamicRouteKeys
      summary: Substituir chaves da rota dinâmica
      description: Substitui atomicamente as chaves de API vinculadas e atualiza os contextos afetados do gateway.
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicRouteKeysUpdateRequest'
      responses:
        '200':
          description: Chaves de API vinculadas atualizadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteKeysResponse'
        '400':
          description: Lista de chaves de API inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Rota dinâmica não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Uma ou mais chaves de API estão indisponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routing/dynamic-routes/{id}/versions/{version}/deploy:
    post:
      x-beta: true
      tags:
        - Gateway
      operationId: deployDynamicRouteVersion
      summary: Implantar versão de rota dinâmica
      description: Ativa uma versão imutável da rota e atualiza os contextos das chaves vinculadas.
      parameters:
        - $ref: '#/components/parameters/DynamicRouteId'
        - $ref: '#/components/parameters/DynamicRouteVersion'
      responses:
        '200':
          description: Versão da rota implantada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicRouteDeployResponse'
        '400':
          description: Versão da rota inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Rota dinâmica ou versão não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Autenticação com token Bearer
  schemas:
    WorkspaceAppListResponse:
      type: object
      required:
        - data
        - total_count
        - offset
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceApp'
        total_count:
          type: integer
          minimum: 0
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
      additionalProperties: false
    WorkspaceApp:
      type: object
      required:
        - id
        - title
        - app_key
        - category
        - docs_url
        - url
        - image_url
        - is_public
        - is_active
        - is_managed
        - last_seen
        - created_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        app_key:
          type: string
        category:
          type: string
          nullable: true
        docs_url:
          type: string
          format: uri
          nullable: true
        url:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        is_public:
          type: boolean
        is_active:
          type: boolean
        is_managed:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        ok:
          type: boolean
          example: false
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          example: error_type
        message:
          type: string
          example: Human-readable error message
        description:
          type: string
          example: Additional error details.
        generation_id:
          type: string
          example: G-abc123
        status_code:
          type: integer
          example: 502
        error_type:
          type: string
          enum:
            - user
            - system
          example: system
        error_origin:
          type: string
          enum:
            - user
            - gateway
            - upstream
          example: upstream
        reason:
          type: string
          example: all_candidates_failed
        attempt_count:
          type: integer
          example: 2
        failed_providers:
          type: array
          items:
            type: string
          example:
            - google-ai-studio
            - openai
        failed_statuses:
          type: array
          items:
            type: integer
          example:
            - 403
            - 429
        upstream_error:
          $ref: '#/components/schemas/ErrorUpstreamError'
        failure_sample:
          type: array
          items:
            $ref: '#/components/schemas/ErrorFailureSampleItem'
        provider_failure_diagnostics:
          $ref: '#/components/schemas/ErrorProviderFailureDiagnostics'
        routing_diagnostics:
          $ref: '#/components/schemas/ErrorRoutingDiagnostics'
        provider_candidate_diagnostics:
          $ref: '#/components/schemas/ErrorProviderCandidateDiagnostics'
        provider_enablement:
          $ref: '#/components/schemas/ErrorProviderEnablementDiagnostics'
        missing_pricing_providers:
          type: array
          items:
            type: string
        provider_payment_required_provider:
          type: string
          example: openai
        provider_payment_required_support_notice:
          type: string
          example: Our upstream provider billing appears to be unavailable. If this persists, contact support.
        details:
          type: array
          items:
            type: object
            additionalProperties: true
      additionalProperties: true
    ErrorUpstreamError:
      type: object
      properties:
        code:
          type: string
          nullable: true
          example: PERMISSION_DENIED
        message:
          type: string
          nullable: true
          example: The caller does not have permission.
        description:
          type: string
          nullable: true
        param:
          type: string
          nullable: true
    ErrorFailureSampleItem:
      type: object
      properties:
        provider:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        status:
          type: integer
          nullable: true
        upstream_error_code:
          type: string
          nullable: true
        upstream_error_message:
          type: string
          nullable: true
        upstream_error_description:
          type: string
          nullable: true
        upstream_error_param:
          type: string
          nullable: true
        upstream_payload_preview:
          type: string
          nullable: true
        retryable:
          type: boolean
          nullable: true
      additionalProperties: true
    ErrorProviderFailureDiagnostics:
      type: object
      properties:
        category:
          type: string
          enum:
            - credentials_not_configured
            - credentials_invalid_or_forbidden
            - provider_access_missing
            - region_or_project_restriction
            - model_unavailable_for_endpoint
            - rate_limited
            - server_error
        hint:
          type: string
        provider:
          type: string
          nullable: true
    ErrorRoutingDiagnostics:
      type: object
      properties:
        filterStages:
          type: array
          items:
            type: object
            properties:
              stage:
                type: string
              beforeCount:
                type: integer
              afterCount:
                type: integer
              droppedProviders:
                type: array
                items:
                  type: object
                  properties:
                    providerId:
                      type: string
                      nullable: true
                    reason:
                      type: string
                      nullable: true
                  additionalProperties: true
            additionalProperties: true
      additionalProperties: true
    ErrorProviderCandidateDiagnostics:
      type: object
      properties:
        totalProviders:
          type: integer
        supportsEndpointCount:
          type: integer
        candidateCount:
          type: integer
        droppedUnsupportedEndpoint:
          type: array
          items:
            type: string
        droppedMissingAdapter:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
                nullable: true
              endpoint:
                type: string
                nullable: true
            additionalProperties: true
      additionalProperties: true
    ErrorProviderEnablementDiagnostics:
      type: object
      properties:
        capability:
          type: string
        providersBefore:
          type: array
          items:
            type: string
        providersAfter:
          type: array
          items:
            type: string
        dropped:
          type: array
          items:
            type: object
            properties:
              providerId:
                type: string
                nullable: true
              reason:
                type: string
                nullable: true
            additionalProperties: true
      additionalProperties: true
    PresetPublisherResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PresetPublisher'
      additionalProperties: false
    PresetPublisher:
      type: object
      required:
        - workspace_id
        - handle
      properties:
        workspace_id:
          type: string
          format: uuid
        handle:
          type: string
          minLength: 3
          maxLength: 40
          nullable: true
      additionalProperties: false
    AudioSpeechRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
        input:
          type: string
        voice:
          type: string
        speed:
          type: number
          minimum: 0.25
          maximum: 4
        format:
          type: string
          enum:
            - mp3
            - wav
            - ogg
            - aac
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
        config:
          type: object
          additionalProperties: true
          properties:
            elevenlabs:
              type: object
              additionalProperties: true
              properties:
                voice_id:
                  type: string
                language_code:
                  type: string
                output_format:
                  type: string
                voice_settings:
                  type: object
                  additionalProperties: true
                  properties:
                    stability:
                      type: number
                    similarity_boost:
                      type: number
    ProviderRoutingOptions:
      type: object
      description: Preferências de roteamento de provedores para seleção pelo gateway.
      properties:
        order:
          type: array
          items:
            type: string
        only:
          type: array
          items:
            type: string
        ignore:
          type: array
          items:
            type: string
        include_alpha:
          type: boolean
          description: Incluir provedores alpha no roteamento (desativado por padrão).
        allow_fallbacks:
          type: boolean
          nullable: true
          description: Permitir fallback para outro provedor elegível após uma falha.
        require_parameters:
          type: boolean
          nullable: true
          description: Exigir suporte do provedor aos parâmetros solicitados antes do roteamento.
        required_execution_region:
          type: string
          nullable: true
          description: Restringir o roteamento a provedores com a região de execução solicitada.
        required_data_region:
          type: string
          nullable: true
          description: Restringir o roteamento a provedores com a região de dados solicitada.
        require_zero_data_retention:
          type: boolean
          nullable: true
          description: Restringir o roteamento a provedores que oferecem retenção zero de dados.
        data_collection:
          type: string
          nullable: true
          enum:
            - allow
            - deny
        zdr:
          type: boolean
          nullable: true
        enforce_distillable_text:
          type: boolean
          nullable: true
        quantizations:
          type: array
          nullable: true
          items:
            type: string
        sort:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
          description: Classificar os provedores para esta solicitação, por exemplo, por preço, latência ou throughput.
        max_price:
          type: object
          properties:
            prompt:
              oneOf:
                - type: number
                - type: string
            completion:
              oneOf:
                - type: number
                - type: string
            image:
              oneOf:
                - type: number
                - type: string
            audio:
              oneOf:
                - type: number
                - type: string
            request:
              oneOf:
                - type: number
                - type: string
        preferred_min_throughput:
          oneOf:
            - type: number
            - type: object
              additionalProperties:
                type: number
        preferred_max_latency:
          oneOf:
            - type: number
            - type: object
              additionalProperties:
                type: number
    AudioTranscriptionRequest:
      type: object
      required:
        - model
      properties:
        model:
          type: string
        audio_url:
          type: string
          format: uri
        audio_b64:
          type: string
        language:
          type: string
        chunking_strategy:
          oneOf:
            - type: string
              enum:
                - auto
            - type: object
              required:
                - type
              properties:
                type:
                  type: string
                  enum:
                    - server_vad
                prefix_padding_ms:
                  type: integer
                  minimum: 0
                silence_duration_ms:
                  type: integer
                  minimum: 0
                threshold:
                  type: number
                  minimum: 0
                  maximum: 1
        known_speaker_names:
          type: array
          maxItems: 4
          items:
            type: string
        known_speaker_references:
          type: array
          maxItems: 4
          items:
            type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AudioTranscriptionResponse:
      type: object
      properties:
        text:
          type: string
    AudioTranslationRequest:
      type: object
      required:
        - model
      properties:
        model:
          type: string
        audio_url:
          type: string
          format: uri
        audio_b64:
          type: string
        language:
          type: string
        prompt:
          type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AudioTranslationResponse:
      type: object
      properties:
        text:
          type: string
    ImagesGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        size:
          type: string
        resolution:
          type: string
        'n':
          type: integer
          minimum: 1
          maximum: 10
        quality:
          type: string
        stream:
          type: boolean
        partial_images:
          type: integer
          minimum: 0
          maximum: 3
        output_format:
          type: string
          enum:
            - png
            - jpeg
            - webp
        output_compression:
          type: integer
          minimum: 0
          maximum: 100
        background:
          type: string
          enum:
            - transparent
            - opaque
            - auto
        moderation:
          type: string
          enum:
            - auto
            - low
        response_format:
          type: string
        style:
          type: string
        user:
          type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    ImagesGenerationResponse:
      type: object
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/Image'
    Image:
      type: object
      properties:
        url:
          type: string
        b64_json:
          type: string
        revised_prompt:
          type: string
    ImagesEditRequest:
      type: object
      required:
        - model
        - image
        - prompt
      properties:
        model:
          type: string
        image:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              maxItems: 16
              items:
                type: string
        mask:
          type: string
        prompt:
          type: string
        size:
          type: string
        resolution:
          type: string
        'n':
          type: integer
          minimum: 1
          maximum: 10
        quality:
          type: string
          enum:
            - standard
            - low
