            bytes:
              type: integer
            sha256:
              type: string
            width:
              type: integer
            height:
              type: integer
            duration_seconds:
              type: number
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/VideoOutput'
        billing:
          $ref: '#/components/schemas/VideoBillingSummary'
        webhook:
          $ref: '#/components/schemas/AsyncWebhookPublicState'
        next_webhook_retry_at:
          type: string
          nullable: true
          description: Timestamp ISO da próxima tentativa agendada do webhook do usuário, quando enfileirada.
        last_webhook_progress:
          type: number
          nullable: true
          description: Última faixa aproximada de progresso enviada aos consumidores de webhooks.
        last_webhook_progress_at:
          type: string
          nullable: true
          description: Timestamp ISO do envio da faixa de progresso mais recente do webhook.
        last_webhook_dispatched_at:
          type: string
          nullable: true
          description: Timestamp ISO da tentativa de envio do webhook mais recente.
        usage:
          type: object
          properties:
