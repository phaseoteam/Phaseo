          description: Duração desejada em segundos (depende do provedor/modelo).
        input_video_duration:
          type: number
          format: double
          minimum: 0
          maximum: 3600
          exclusiveMinimum: true
          description: Duração do vídeo de origem em segundos. Obrigatória quando o provedor cobra a duração do vídeo de origem separadamente da saída gerada.
        input_audio_duration:
          type: number
          format: double
          minimum: 2
          maximum: 20
          description: Duração declarada do áudio de origem em segundos, usada para validar a faixa do provedor. Provedores que não informam uso definitivo podem cobrar pelo teto de duração de entrada suportado.
        size:
          type: string
          description: Dimensões explícitas (por exemplo, 1280x720). Não pode ser combinado com resolution ou aspect_ratio.
        resolution:
          type: string
          description: 480p, 720p, 1080p, 1K, 2K, 4K. Pode ser combinado com aspect_ratio. Não pode ser combinado com size.
        aspect_ratio:
          type: string
          description: Proporção como 16:9, 9:16 ou 1:1. Pode ser combinado com resolution. Não pode ser combinado com size.
        seed:
          type: integer
        sample_count:
          type: integer
          minimum: 1
          maximum: 4
        negative_prompt:
          type: string
        generate_audio:
          type: boolean
        enhance_prompt:
          type: boolean
        compression_quality:
          type: integer
        person_generation:
          type: string
        resize_mode:
          type: string
        input_references:
          type: array
          description: Entradas HTTPS de imagem, áudio ou vídeo que condicionam a geração. Tipos, funções, quantidades e combinações suportados dependem do modelo selecionado. Consulte GET /videos/models antes de enviar um trabalho. O alias singular de compatibilidade input_reference, omitido deste esquema, aceita uma imagem multipart ou um objeto com exatamente um dos campos file_id ou image_url. O suporte depende do provedor.
          items:
            $ref: '#/components/schemas/VideoInputReference'
        frame_images:
          type: array
          minItems: 1
          maxItems: 2
          description: Imagens HTTPS do primeiro/último quadro. Cada frame_type pode aparecer uma vez. Não forneça também input_reference nem funções de quadro em input_references.
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - frame_type
              - image_url
            properties:
              type:
                type: string
                enum:
                  - image_url
              frame_type:
                type: string
                enum:
                  - first_frame
                  - last_frame
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        provider_params:
          type: object
          additionalProperties: true
          description: Somente extensões específicas do provedor. O repasse completo da solicitação e campos duplicados de roteamento, prompt, callback ou cobrança são rejeitados.
        provider_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: Extensões indexadas pelo ID canônico do provedor (por exemplo, atlascloud ou byteplus). Somente as opções do provedor selecionado são encaminhadas. Não pode ser combinado com provider_params. Campos de roteamento, prompt, callback, duração, resolução e quantidade de saídas devem usar campos validados de nível superior.
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: Endpoint de webhook ativo gerenciado pelo espaço de trabalho. Seu segredo de assinatura criptografado e rotacionável nunca é armazenado nos metadados do trabalho de vídeo.
            events:
              type: array
              description: Assinaturas opcionais de eventos. Use eventos genéricos job.* ou eventos video.* correspondentes, como video.status_changed, video.progress ou video.completed. Quando omitidos, são usados job.status_changed e eventos finais job.*. Inclua job.progress ou video.progress explicitamente para callbacks de progresso. Quando fornecidos, pelo menos um evento deve ser válido para trabalhos de vídeo; listas malformadas ou somente com eventos de outro tipo são rejeitadas.
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: Resumo público de entrega de webhooks assíncronos gerenciados pelo gateway. Use-o para distinguir o estado de execução do trabalho da saúde da entrega do webhook.
      properties:
        total_attempts:
          type: integer
          description: Total de tentativas de entrega registradas para este trabalho.
        delivered_events:
          type: integer
          description: Número de chaves de entrega que alcançaram o estado entregue.
        delivered_event_types:
          type: array
          description: Chaves de entrega entregues pelo menos uma vez.
          items:
            type: string
          example:
            - video.completed
        pending_retries:
          type: integer
          description: Número de chaves de entrega com uma nova tentativa agendada atualmente.
        next_retry_at:
          type: string
          nullable: true
          description: Timestamp ISO da próxima tentativa agendada, quando houver.
        last_attempt_at:
          type: string
          nullable: true
          description: Timestamp ISO da tentativa de entrega mais recente.
        last_attempt_status:
          type: string
          nullable: true
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
          description: Resultado da tentativa de entrega mais recente.
        last_response_status:
          type: integer
          nullable: true
          description: Status HTTP retornado pelo destino do webhook, quando disponível.
        last_delivered_at:
          type: string
          nullable: true
          description: Timestamp ISO da entrega bem-sucedida mais recente.
        last_failure_at:
          type: string
          nullable: true
          description: Timestamp ISO da tentativa com falha ou em repetição mais recente.
        last_error_message:
          type: string
          nullable: true
          description: Mensagem de erro de entrega mais recente, quando disponível.
    AsyncWebhookDeliveryAttempt:
      type: object
      description: Tentativa recente de entrega de webhook assíncrono gerenciado pelo gateway.
      properties:
        id:
          type: string
          description: Identificador estável da tentativa para auditoria e depuração.
        delivery_key:
          type: string
          description: Chave de idempotência para a entrega deste evento.
          example: video.completed
        event_type:
          type: string
          description: Tipo de evento entregue ao destino do webhook.
          example: video.completed
        status:
          type: string
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: Número da tentativa para esta chave de entrega, começando em um.
        max_attempts:
          type: integer
          description: Máximo de tentativas antes de marcar a entrega como falha permanente.
        tried_at:
          type: string
          description: Timestamp ISO desta tentativa.
        delivered_at:
          type: string
          nullable: true
          description: Timestamp ISO da entrega bem-sucedida desta tentativa.
        next_retry_at:
          type: string
          nullable: true
          description: Timestamp ISO da próxima tentativa após esta, quando agendada.
        response_status:
          type: integer
          nullable: true
          description: Status HTTP retornado pelo destino do webhook, quando disponível.
        error_message:
          type: string
          nullable: true
          description: Mensagem de erro de entrega, quando disponível.
        response_body_preview:
          type: string
          nullable: true
          description: Prévia do corpo da resposta do destino do webhook com dados sensíveis ocultos.
    AsyncWebhookPublicState:
      type: object
      description: Configuração sanitizada do webhook assíncrono e estado de entrega. Segredos nunca são retornados; `has_secret` indica se entregas assinadas estão habilitadas. Entregas assinadas incluem os cabeçalhos x-phaseo-signature, x-phaseo-timestamp, x-phaseo-event-id, x-phaseo-event-type, x-phaseo-delivery-key, x-phaseo-attempt e x-phaseo-max-attempts.
      properties:
        url:
          type: string
          format: uri
          nullable: true
        events:
          type: array
          items:
            type: string
        has_secret:
          type: boolean
        delivery:
          $ref: '#/components/schemas/AsyncWebhookDeliverySummary'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AsyncWebhookDeliveryAttempt'
    VideoGenerationResponse:
      type: object
      properties:
        id:
          type: string
        polling_url:
          type: string
        websocket_url:
          type: string
          format: uri
          description: URL de WebSocket para assinar atualizações normalizadas do ciclo de vida de trabalhos assíncronos.
        model:
