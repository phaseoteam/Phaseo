  /batches/{batch_id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResults
      summary: Baixar resultados do lote
      description: Transmite linhas completas de resultados nativos do provedor como JSONL para um lote final pertencente ao espaço de trabalho autenticado. Combina arquivos de sucesso e erro, converte saídas inline e segue a paginação de resultados do provedor. Use uma chave de API do Phaseo. Downloads não enviam inferência nem adicionam cobranças de uso. Os endpoints de arquivos existentes continuam disponíveis. Linhas inline são limitadas a 8 MiB; downloads interrompidos devem ser descartados e refeitos. Limite de 10 tentativas por espaço de trabalho e lote em uma janela móvel de 30 minutos, compartilhado entre chaves de API e aliases. Tentativas upstream com falha ou canceladas contam. Uma resposta 429 inclui Retry-After em segundos.
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultados JSONL originais do provedor
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acesso à prévia de lotes negado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Lote não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Os resultados do lote não estão prontos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Limite de downloads do lote excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: Segundos até outro download ser permitido
              schema:
                type: integer
        '501':
          description: Downloads diretos de resultados não são suportados por este provedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Não foi possível recuperar os resultados do provedor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: A admissão de downloads está temporariamente indisponível; tente novamente após 30 segundos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
