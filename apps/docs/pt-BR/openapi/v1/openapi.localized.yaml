openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: Uma API de gateway para acessar diversos modelos de IA por meio de endpoints compatíveis com OpenAI.
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: Roteamento global
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: Roteamento global
        - url: https://eu.api.phaseo.app/v1
          description: Roteamento regional para provedores da UE (somente texto)
        - url: https://us.api.phaseo.app/v1
          description: Roteamento regional para provedores dos EUA (somente texto)
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: Listar modelos do gateway
      description: Retorna modelos compartilhados e não ocultos do gateway. Por padrão, inclui os modelos que podem ser roteados publicamente; use `availability=all` para incluir registros de disponibilidade que não podem ser roteados.
      parameters:
        - name: search
          in: query
          description: Pesquisa sem diferenciar maiúsculas e minúsculas em identificadores, nomes e descrições de modelos e organizações.
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: Pesquisa de provedores ou organizações de modelos sem diferenciar maiúsculas e minúsculas.
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: Exigir uma modalidade de entrada suportada.
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: Exigir pelo menos esta quantidade de tokens de contexto de entrada.
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: Preço máximo em USD de entrada por milhão de tokens.
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: Retornar apenas modelos com pelo menos uma oferta roteável do gateway.
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: Campo usado para ordenar os resultados da descoberta de modelos.
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: Direção de ordenação opcional. Preços são ordenados de forma crescente por padrão; outros valores numéricos, de forma decrescente.
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: Filtrar por endpoints
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: Filtrar por organização
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: Filtrar por ID do provedor
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Filtrar pelo status de lançamento do provedor
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrar pelo status de roteamento do provedor
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrar pelo status de roteamento do modelo
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Filtrar pelo status de recursos do provedor
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Filtrar pelo status de disponibilidade do provedor
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Filtrar pelo motivo de disponibilidade do provedor
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Filtrar pelo status do modelo
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: Filtrar por tipos de entrada
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: Alias público de `input_types`.
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: Filtrar por tipos de saída
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: Alias público de `output_types`.
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: Filtrar por parâmetros
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Alias público de `params`.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: Filtro de disponibilidade. `active` retorna somente modelos roteáveis publicamente; `all` inclui registros de disponibilidade não roteáveis.
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: Limitar o número de resultados
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: Deslocamento da paginação
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: Formato da resposta. O padrão é `json`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: Alias de `format`. Aceita `json`, `rss` ou `atom`.
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: Lista de modelos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: Feed XML RSS 2.0
            application/atom+xml:
              schema:
                type: string
                description: Feed XML Atom
        '400':
          description: Parâmetros de solicitação inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: Listar os recursos dos endpoints do modelo
      description: Retorna linhas de endpoints específicas do provedor para um modelo, incluindo caminhos públicos, modalidades, parâmetros compatíveis, disponibilidade, estado de roteamento, slugs de modelos do provedor e resumos de preços dos endpoints.
      parameters:
        - name: author
          in: path
          required: true
          description: Segmento do autor ou da organização do modelo.
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: Segmento do slug do modelo.
          schema:
            type: string
        - name: provider
          in: query
          description: Filtrar por ID do provedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: Filtrar pelo status de lançamento do provedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: Filtrar pelo status de roteamento do provedor.
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: Filtrar pelo status de roteamento do modelo.
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: Filtrar pelo status de recursos do provedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: Filtrar pelo status de disponibilidade do provedor.
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: Filtrar pelo motivo de disponibilidade do provedor.
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: Filtrar pelo status canônico do ciclo de vida do modelo.
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: Filtrar linhas de endpoints por nomes de parâmetros compatíveis ou aliases.
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: '`active` retorna linhas de endpoints roteáveis publicamente; `all` também inclui linhas futuras e inativas.'
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: Linhas de capacidades dos endpoints do modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: Parâmetros de solicitação inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nenhum modelo encontrado para os filtros de disponibilidade e provedor solicitados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/me:
