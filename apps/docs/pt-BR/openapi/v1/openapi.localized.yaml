          in: query
          description: Filtra por identificador de chave de API.
          schema:
            type: string
        - name: end_user_id
          in: query
          description: Filtra por identificador de usuário final definido pelo aplicativo.
          schema:
            type: string
            maxLength: 256
        - name: model
          in: query
          description: Filtra pelo slug canônico do modelo solicitado ou roteado.
          schema:
            $ref: '#/components/schemas/ModelId'
        - name: provider
          in: query
          description: Filtra pelo slug do provedor.
          schema:
            type: string
            maxLength: 128
        - name: endpoint
          in: query
          description: Filtra por identificador do endpoint do gateway.
          schema:
            type: string
            maxLength: 128
        - name: byok
          in: query
          description: Filtra tráfego gerenciado ou BYOK.
          schema:
            type: boolean
        - name: success
          in: query
          description: Filtra solicitações bem-sucedidas ou com falha.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Offset'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 1000
      responses:
        '200':
          description: Obtido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'
        '400':
          description: Erro de solicitação inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autorizado
          content:
            application/json:
