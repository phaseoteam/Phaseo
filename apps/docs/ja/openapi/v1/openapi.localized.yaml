openapi: 3.0.3
info:
  title: Phaseo Gateway API
  description: OpenAI互換のエンドポイントを通じて、さまざまなAIモデルにアクセスするためのゲートウェイAPI。
  version: 1.0.0
  contact:
    name: Phaseo
    url: https://phaseo.app
    email: danielbutler500@gmail.com
servers:
  - url: https://api.phaseo.app/v1
    description: グローバルルーティング
security:
  - BearerAuth: []
paths:
  /models:
    get:
      servers:
        - url: https://api.phaseo.app/v1
          description: グローバルルーティング
        - url: https://eu.api.phaseo.app/v1
          description: EU 域内のプロバイダールーティング（テキストのみ）
        - url: https://us.api.phaseo.app/v1
          description: 米国内のプロバイダールーティング（テキストのみ）
      x-beta: true
      tags:
        - Gateway
      operationId: listModels
      summary: ゲートウェイモデルを一覧表示
      description: 共有されている非表示ではないゲートウェイモデルを返します。既定では現在パブリックにルーティングできるモデルが対象です。ルーティングできない利用可能性レコードも含めるには `availability=all` を使用します。
      parameters:
        - name: search
          in: query
          description: モデル ID、名前、説明、組織を対象に、大文字と小文字を区別せず検索します。
          schema:
            type: string
            maxLength: 200
        - name: provider_search
          in: query
          description: プロバイダーまたはモデルの組織を、大文字と小文字を区別せず検索します。
          schema:
            type: string
            maxLength: 100
        - name: input_modality
          in: query
          description: 対応する入力モダリティを必須とします。
          schema:
            type: string
            enum:
              - text
              - image
              - audio
              - video
        - name: minimum_context_tokens
          in: query
          description: 入力コンテキストに少なくともこの数のトークンを要求します。
          schema:
            type: number
            minimum: 0
        - name: maximum_input_price_per_million
          in: query
          description: 入力トークン 100 万個あたりの上限価格（米ドル）。
          schema:
            type: number
            minimum: 0
        - name: gateway_available_only
          in: query
          description: ルーティング可能なゲートウェイの提供ルートが少なくとも 1 つあるモデルのみを返します。
          schema:
            type: boolean
            default: false
        - name: sort_by
          in: query
          description: モデル検出結果の並べ替えに使うフィールド。
          schema:
            type: string
            enum:
              - relevance
              - input_price
              - output_price
              - context_length
              - provider_count
            default: relevance
        - name: sort_order
          in: query
          description: 任意の並べ替え方向。価格は標準で昇順、それ以外の数値は標準で降順に並べ替えます。
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: endpoints
          in: query
          description: エンドポイントで絞り込む
          schema:
            type: array
            items:
              type: string
        - name: organisation
          in: query
          description: 組織で絞り込む
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: プロバイダー ID で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: プロバイダーのロールアウト状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: プロバイダーのルーティング状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: モデルのルーティング状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: プロバイダーの機能状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: プロバイダーの利用可能性状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: プロバイダーの利用可能性の理由で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: モデルの状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: 入力タイプで絞り込む
          schema:
            type: array
            items:
              type: string
        - name: input_modalities
          in: query
          description: '`input_types` の公開エイリアスです。'
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: 出力タイプで絞り込む
          schema:
            type: array
            items:
              type: string
        - name: output_modalities
          in: query
          description: '`output_types` の公開エイリアスです。'
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: パラメーターで絞り込む
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: '`params` の公開エイリアスです。'
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: 利用可能性フィルターです。`active` はパブリックにルーティングできるモデルのみを返し、`all` はルーティングできない利用可能性レコードも含みます。
          schema:
            type: string
            enum:
              - active
              - all
            default: active
        - name: limit
          in: query
          description: 結果の件数を制限
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: ページネーションのオフセット
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 5000
        - name: format
          in: query
          description: 応答形式です。既定値は `json` です。
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: '`format` のエイリアスです。`json`、`rss`、`atom` を指定できます。'
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: モデル一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayModelsResponse'
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML フィード
            application/atom+xml:
              schema:
                type: string
                description: Atom XML フィード
        '400':
          description: リクエストパラメーターが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: 認証されていません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/{author}/{slug}/endpoints:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: listModelEndpoints
      summary: モデルエンドポイントの機能を一覧表示
      description: 公開パス、モダリティ、対応パラメーター、利用可能性、ルーティング状態、プロバイダーモデルの slug、エンドポイント料金の概要など、モデルごとのプロバイダー固有のエンドポイント行を返します。
      parameters:
        - name: author
          in: path
          required: true
          description: モデルの作者または組織のセグメントです。
          schema:
            type: string
        - name: slug
          in: path
          required: true
          description: モデル slug のセグメントです。
          schema:
            type: string
        - name: provider
          in: query
          description: プロバイダー ID で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: プロバイダーのロールアウト状態で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: provider_routing_status
          in: query
          description: プロバイダーのルーティング状態で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: model_routing_status
          in: query
          description: モデルのルーティング状態で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: capability_status
          in: query
          description: プロバイダーの機能状態で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: プロバイダーの利用可能性状態で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: プロバイダーの利用可能性の理由で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: モデルの正規ライフサイクル状態で絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: supported_parameters
          in: query
          description: 対応パラメーター名またはエイリアスでエンドポイント行を絞り込みます。
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: '`active` はパブリックにルーティングできるエンドポイント行を返し、`all` は近日公開および無効な行も含みます。'
          schema:
            type: string
            enum:
              - active
              - all
            default: active
      responses:
        '200':
          description: モデルエンドポイント機能の行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelEndpointsResponse'
        '400':
          description: リクエストパラメーターが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '401':
          description: 認証されていません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定された利用可能性およびプロバイダーフィルターに該当するモデルが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /models/me:
