          description: 組織で絞り込む
          schema:
            oneOf:
              - $ref: '#/components/schemas/OrganisationId'
              - type: array
                items:
                  $ref: '#/components/schemas/OrganisationId'
        - name: provider
          in: query
          description: プロバイダー ID で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: provider_status
          in: query
          description: プロバイダーのロールアウト状態で絞り込む
