                  $ref: '#/components/schemas/OrganisationId'
        - name: model_id
          in: query
          description: Filter by model id
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: id
          in: query
          description: Alias for model_id filter
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: limit
          in: query
          description: 結果の件数を制限
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 250
        - name: offset
          in: query
          description: ページネーションのオフセット
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: format
          in: query
          description: 応答形式です。既定値は `json` です。
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
            default: json
        - name: feed
          in: query
          description: '`format` のエイリアスです。`json`、`rss`、`atom` を指定できます。'
          schema:
            type: string
            enum:
              - json
              - rss
              - atom
      responses:
        '200':
          description: List of data models
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  include_hidden:
                    type: boolean
                  limit:
                    type: integer
                  offset:
                    type: integer
                  total:
                    type: integer
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/DataModel'
            application/rss+xml:
              schema:
                type: string
                description: RSS 2.0 XML フィード
            application/atom+xml:
              schema:
                type: string
                description: Atom XML フィード
        '400':
          description: リクエストパラメーターが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidRequestResponse'
        '500':
          description: エラー
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  message:
                    type: string
