  /batches/{batch_id}/results:
    get:
      x-beta: true
      tags:
        - Gateway
      operationId: retrieveBatchResults
      summary: バッチ結果をダウンロード
      description: 認証されたワークスペースが所有する終端状態のバッチについて、プロバイダー固有の完全な結果行をJSONLでストリーミングします。成功・エラーファイルを結合し、インライン出力を変換し、プロバイダーの結果ページ分割に従います。Phaseo APIキーを使用してください。ダウンロードでは推論を送信せず、使用料金も追加されません。既存のファイルエンドポイントも利用できます。インライン行は8 MiBまでです。中断したダウンロードは破棄して再ダウンロードしてください。ワークスペースとバッチごとに、ローリング30分枠で10回の試行までです。この上限はAPIキーとエイリアス間で共有されます。上流で失敗・キャンセルされた試行も数えられます。429レスポンスには秒単位のRetry-Afterが含まれます。
      parameters:
        - name: batch_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: プロバイダーの元のJSONL結果
          content:
            application/x-ndjson:
              schema:
                type: string
        '401':
          description: 認証されていません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: バッチプレビューへのアクセスが拒否されました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: バッチが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: バッチ結果はまだ準備できていません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: バッチのダウンロード上限を超えました
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              description: 次のダウンロードが許可されるまでの秒数
              schema:
                type: integer
        '501':
          description: このプロバイダーは結果の直接ダウンロードに対応していません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: プロバイダーの結果を取得できませんでした
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ダウンロードの受付が一時的に利用できません。30秒後に再試行してください
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
