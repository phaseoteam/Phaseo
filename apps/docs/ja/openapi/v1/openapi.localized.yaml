              type: string
              description: HTTP(S) URL またはデータ URI です。
    ChatImageOutputPart:
      type: object
      required:
        - type
        - image_url
      properties:
        type:
          type: string
          enum:
            - image_url
        image_url:
          type: object
          required:
            - url
          properties:
            url:
              type: string
              description: HTTP(S) URL またはデータ URI です。
        mime_type:
          type: string
    ChatAudioOutputPart:
