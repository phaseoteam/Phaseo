    VideoGenerationRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
        prompt:
          type: string
        duration:
          type: integer
          description: 希望する長さ（秒）。プロバイダー／モデルにより異なります。
        input_video_duration:
          type: number
          format: double
          minimum: 0
          maximum: 3600
          exclusiveMinimum: true
          description: 入力元動画の長さ（秒）。プロバイダーが生成出力とは別に入力元動画の長さを課金する場合に必須です。
        input_audio_duration:
          type: number
          format: double
          minimum: 2
          maximum: 20
          description: プロバイダーの許容範囲検証に使う、申告された入力元音声の長さ（秒）。確定した使用量を報告しないプロバイダーは、対応する入力長の上限で課金する場合があります。
        size:
          type: string
          description: 明示的な寸法（例：1280x720）。resolutionやaspect_ratioとは併用できません。
        resolution:
          type: string
          description: 480p、720p、1080p、1K、2K、4K。aspect_ratioと併用できます。sizeとは併用できません。
        aspect_ratio:
          type: string
          description: 16:9、9:16、1:1などのアスペクト比。resolutionと併用できます。sizeとは併用できません。
        seed:
          type: integer
        sample_count:
          type: integer
          minimum: 1
          maximum: 4
        negative_prompt:
          type: string
        generate_audio:
          type: boolean
        enhance_prompt:
          type: boolean
        compression_quality:
          type: integer
        person_generation:
          type: string
        resize_mode:
          type: string
        input_references:
          type: array
          description: 生成の条件となるHTTPSの画像、音声、動画入力。対応する種類、役割、数、組み合わせは選択モデルに依存します。ジョブ送信前にGET /videos/modelsを確認してください。このスキーマに含まれない単数形の互換エイリアスinput_referenceは、multipart画像、またはfile_idとimage_urlのいずれか1つだけを含むオブジェクトを受け付けます。対応はプロバイダーに依存します。
          items:
            $ref: '#/components/schemas/VideoInputReference'
        frame_images:
          type: array
          minItems: 1
          maxItems: 2
          description: 最初／最後のフレームのHTTPS画像。各frame_typeは1回だけ指定できます。input_referenceやinput_referencesのフレーム役割を追加で指定しないでください。
          items:
            type: object
            additionalProperties: false
            required:
              - type
              - frame_type
              - image_url
            properties:
              type:
                type: string
                enum:
                  - image_url
              frame_type:
                type: string
                enum:
                  - first_frame
                  - last_frame
              image_url:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        provider_params:
          type: object
          additionalProperties: true
          description: プロバイダー固有の拡張のみ。リクエスト全体のパススルーと、重複するルーティング、プロンプト、コールバック、課金フィールドは拒否されます。
        provider_options:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
          description: 正規プロバイダーID（例：atlascloud、byteplus）で指定する拡張。選択したプロバイダーのオプションのみ転送されます。provider_paramsとは併用できません。ルーティング、プロンプト、コールバック、長さ、解像度、出力数には検証済みの最上位フィールドを使用してください。
        output:
          $ref: '#/components/schemas/VideoOutputConfig'
        webhook:
          type: object
          required:
            - endpoint_id
          additionalProperties: false
          properties:
            endpoint_id:
              type: string
              description: ワークスペース管理の有効なWebhookエンドポイント。暗号化され、ローテーション可能な署名シークレットは動画ジョブのメタデータに保存されません。
            events:
              type: array
              description: 任意のイベント購読。汎用job.*イベント、または対応するvideo.*イベント（例：video.status_changed、video.progress、video.completed）を使用します。省略時はjob.status_changedと終端のjob.*イベントが使用されます。進捗コールバックにはjob.progressまたはvideo.progressを明示してください。指定する場合、少なくとも1つは動画ジョブに有効なイベントである必要があります。他種のイベントのみのリストや不正なリストは拒否されます。
              items:
                type: string
        provider:
          $ref: '#/components/schemas/ProviderRoutingOptions'
    AsyncWebhookDeliverySummary:
      type: object
      description: ゲートウェイ管理の非同期Webhookの公開配信サマリー。ジョブの実行状態とWebhook配信の正常性を区別するために使用します。
      properties:
        total_attempts:
          type: integer
          description: このジョブで記録された配信試行の総数。
        delivered_events:
          type: integer
          description: 配信済み状態に達した配信キーの数。
        delivered_event_types:
          type: array
          description: 少なくとも1回配信された配信キー。
          items:
            type: string
          example:
            - video.completed
        pending_retries:
          type: integer
          description: 現在再試行が予定されている配信キーの数。
        next_retry_at:
          type: string
          nullable: true
          description: 次の予定された再試行のISOタイムスタンプ（存在する場合）。
        last_attempt_at:
          type: string
          nullable: true
          description: 直近の配信試行のISOタイムスタンプ。
        last_attempt_status:
          type: string
          nullable: true
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
          description: 直近の配信試行の結果。
        last_response_status:
          type: integer
          nullable: true
          description: Webhookの送信先が返したHTTPステータス（取得できる場合）。
        last_delivered_at:
          type: string
          nullable: true
          description: 直近の成功した配信のISOタイムスタンプ。
        last_failure_at:
          type: string
          nullable: true
          description: 直近の失敗した、または再試行中の試行のISOタイムスタンプ。
        last_error_message:
          type: string
          nullable: true
          description: 直近の配信エラーメッセージ（取得できる場合）。
    AsyncWebhookDeliveryAttempt:
      type: object
      description: ゲートウェイ管理の非同期Webhookの最近の配信試行。
      properties:
        id:
          type: string
          description: 監査とデバッグ用の安定した試行識別子。
        delivery_key:
          type: string
          description: このイベント配信用の冪等性キー。
          example: video.completed
        event_type:
          type: string
          description: Webhookの送信先に配信されたイベントの種類。
          example: video.completed
        status:
          type: string
          enum:
            - delivered
            - scheduled_retry
            - failed_permanently
        attempt_number:
          type: integer
          description: この配信キーの1から始まる試行番号。
        max_attempts:
          type: integer
          description: 配信を恒久的な失敗としてマークするまでの最大試行回数。
        tried_at:
          type: string
          description: この試行を行ったISOタイムスタンプ。
        delivered_at:
          type: string
          nullable: true
          description: この試行が正常に配信されたISOタイムスタンプ。
        next_retry_at:
          type: string
          nullable: true
          description: この試行後の次回再試行のISOタイムスタンプ（予定されている場合）。
        response_status:
          type: integer
          nullable: true
          description: Webhookの送信先が返したHTTPステータス（取得できる場合）。
        error_message:
          type: string
          nullable: true
          description: 配信エラーメッセージ（取得できる場合）。
        response_body_preview:
          type: string
          nullable: true
          description: Webhookの送信先からのレスポンス本文の、機密情報を伏せたプレビュー。
    AsyncWebhookPublicState:
      type: object
      description: 機密情報を除去した非同期Webhook設定と配信状態。シークレットは返されません。`has_secret`は署名付き配信が有効かを示します。署名付き配信にはx-phaseo-signature、x-phaseo-timestamp、x-phaseo-event-id、x-phaseo-event-type、x-phaseo-delivery-key、x-phaseo-attempt、x-phaseo-max-attemptsヘッダーが含まれます。
      properties:
        url:
          type: string
          format: uri
          nullable: true
        events:
