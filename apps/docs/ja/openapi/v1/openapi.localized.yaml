        - name: capability_status
          in: query
          description: プロバイダーの機能状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_status
          in: query
          description: プロバイダーの利用可能性状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: provider_availability_reason
          in: query
          description: プロバイダーの利用可能性の理由で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: status
          in: query
          description: モデルの状態で絞り込む
          schema:
            type: array
            items:
              type: string
        - name: input_types
          in: query
          description: 入力タイプで絞り込む
          schema:
            type: array
            items:
              type: string
        - name: output_types
          in: query
          description: 出力タイプで絞り込む
          schema:
            type: array
            items:
              type: string
        - name: params
          in: query
          description: パラメーターで絞り込む
          schema:
            type: array
            items:
              type: string
        - name: availability
          in: query
          description: 利用可能性フィルターです。`active` はパブリックにルーティングできるモデルのみを返し、`all` はルーティングできない利用可能性レコードも含みます。
          schema:
            type: string
