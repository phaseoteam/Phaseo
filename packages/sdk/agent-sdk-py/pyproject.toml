[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phaseo-agent-sdk"
version = "0.3.0"
description = "Python agent SDK for building agentic applications on top of Phaseo Gateway"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Phaseo" }]
dependencies = [
  "phaseo>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://phaseo.app"
Documentation = "https://docs.phaseo.app"
Repository = "https://github.com/phaseoteam/Phaseo"
Issues = "https://github.com/phaseoteam/Phaseo/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
