interface:
  display_name: "Phaseo Web Search"
  short_description: "Ground answers with Phaseo web search and fetch"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-web-search-tools to add web grounding to these requests."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
