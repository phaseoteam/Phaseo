interface:
  display_name: "Phaseo CLI"
  short_description: "Operate and debug Phaseo from the terminal"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-cli to inspect and troubleshoot this Phaseo setup from the terminal."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
