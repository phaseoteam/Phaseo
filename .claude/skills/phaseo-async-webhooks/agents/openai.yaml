interface:
  display_name: "Phaseo Async Jobs and Webhooks"
  short_description: "Build async video, batch and webhook flows"
  brand_color: "#0069A8"
  default_prompt: "Use $phaseo-async-webhooks to build and verify this async job flow."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
