name: Phaseo Health Pilot

# Manual-only while proving coverage and delivery. No incidents are created.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phaseo-health-pilot
  cancel-in-progress: false

jobs:
  health:
    # Require the public repository and main before exposing any telemetry secret.
    if: github.repository == 'phaseoteam/Phaseo' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install existing browser dependency
        run: pnpm install --frozen-lockfile --ignore-scripts --filter @phaseo/web...
      - name: Install Chromium
        run: pnpm --filter @phaseo/web exec playwright install --with-deps chromium
      - name: Validate checker
        run: node --test scripts/health-pilot.test.mjs
      - name: Run pilot without external delivery
        if: vars.HEALTH_PILOT_PUBLISH_AXIOM != 'true'
        run: node scripts/health-pilot.mjs
      - name: Run pilot with Axiom delivery
        if: vars.HEALTH_PILOT_PUBLISH_AXIOM == 'true'
        env:
          HEALTH_AXIOM_TOKEN: ${{ secrets.HEALTH_AXIOM_TOKEN }}
          HEALTH_AXIOM_DATASET: ${{ vars.HEALTH_AXIOM_DATASET }}
        run: node scripts/health-pilot.mjs --publish-axiom
