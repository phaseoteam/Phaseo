name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  opencode:
    if: >
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      ) &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Require trusted repository context
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY_OWNER}" != "phaseoteam" ]; then
            echo "::error::This workflow only runs in the canonical repository."
            exit 1
          fi

      # author_association MEMBER is anyone in the organisation, including people who can only read. The agent below
      # runs with an id-token exchanged for a token that can write, so only people who can push here may start it.
      - name: Require write access for the commenter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${COMMENTER}/permission" --jq '.permission')"
          case "${permission}" in
            admin|maintain|write) ;;
            *)
              echo "::error::@${COMMENTER} has ${permission:-no} access to ${GITHUB_REPOSITORY}; /oc needs write access."
              exit 1
              ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/gpt-5-nano
