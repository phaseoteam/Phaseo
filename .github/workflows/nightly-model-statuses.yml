name: Nightly Model Status Refresh

on:
    schedule:
        - cron: "0 1 * * *"
    workflow_dispatch:

env:
    NODE_VERSION: 22

permissions:
    contents: read

jobs:
    update-statuses:
        name: Update model statuses
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test model status refresh
              run: pnpm exec tsx --test scripts/update-model-statuses.test.ts

            - name: Refresh model statuses
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
              run: pnpm run data:update-statuses

            - name: Validate data
              run: pnpm run validate:data

