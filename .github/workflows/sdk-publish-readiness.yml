name: SDK Publish Readiness

on:
  workflow_dispatch:
    inputs:
      checkSecrets:
        description: "Fail if required registry secrets are missing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  agent-sdk:
    name: Agent SDK readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.33.0
          run_install: false
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Restore lockfile (guard setup-node cache mutation)
        run: git checkout -- pnpm-lock.yaml
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build TypeScript SDK dependency
        run: pnpm --filter @phaseo/sdk build
      - name: Build, test, and pack
        working-directory: packages/sdk/agent-sdk-ts
        run: |
          pnpm run build
          pnpm run test
          pnpm publish --dry-run --no-git-checks

  packagist-credentials:
    name: Packagist credentials
    if: inputs.checkSecrets
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check required Packagist refresh credentials
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_SAFE_TOKEN: ${{ secrets.PACKAGIST_SAFE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_USERNAME:-}" ] || [ -z "${PACKAGIST_SAFE_TOKEN:-}" ]; then
            echo "::error::Missing PACKAGIST_USERNAME or PACKAGIST_SAFE_TOKEN in the release environment."
            exit 1
          fi

  go:
    name: Go readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24"
      - name: Run tests
        run: |
          (cd packages/sdk/sdk-go && go test ./...)
          (cd packages/sdk/agent-sdk-go && go test ./...)

  rust:
    name: Rust readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust checks
        run: |
          rustup component add clippy rustfmt
          rustup toolchain install 1.86.0 --profile minimal
      - name: Build, test, lint, and package
        run: |
          cargo test --manifest-path packages/sdk/sdk-rust/Cargo.toml --all-targets
          cargo clippy --manifest-path packages/sdk/sdk-rust/Cargo.toml --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path packages/sdk/sdk-rust/Cargo.toml --locked --no-deps
          cargo +1.86.0 check --manifest-path packages/sdk/sdk-rust/Cargo.toml --locked
          cargo package --manifest-path packages/sdk/sdk-rust/Cargo.toml
          cargo test --manifest-path packages/sdk/agent-sdk-rust/Cargo.toml --all-targets
          cargo clippy --manifest-path packages/sdk/agent-sdk-rust/Cargo.toml --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path packages/sdk/agent-sdk-rust/Cargo.toml --locked --no-deps
          cargo +1.86.0 check --manifest-path packages/sdk/agent-sdk-rust/Cargo.toml --locked

  python-agent:
    name: Python Agent SDK readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Test and build package
        run: |
          python -m pip install pytest build
          python -m pip install -e packages/sdk/sdk-py -e packages/sdk/agent-sdk-py
          python -m pytest packages/sdk/agent-sdk-py/tests
          python -m build packages/sdk/agent-sdk-py

  csharp:
    name: C# readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.x"
      - name: Build and pack
        run: |
          dotnet test packages/sdk/sdk-csharp/tests/Phaseo.Sdk.Tests/Phaseo.Sdk.Tests.csproj -c Release
          dotnet build packages/sdk/sdk-csharp/Phaseo.Sdk.csproj -c Release
          dotnet pack packages/sdk/sdk-csharp/Phaseo.Sdk.csproj -c Release -o artifacts/csharp
          dotnet test packages/sdk/agent-sdk-csharp/tests/Phaseo.AgentSdk.Tests/Phaseo.AgentSdk.Tests.csproj -c Release
          dotnet pack packages/sdk/agent-sdk-csharp/Phaseo.AgentSdk.csproj -c Release -o artifacts/csharp-agent
      - name: Check NuGet trusted publishing user (optional override)
        if: inputs.checkSecrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ vars.NUGET_TRUSTED_PUBLISHING_USER }}" ]; then
            echo "NUGET_TRUSTED_PUBLISHING_USER is not set; publish workflow will fall back to github.repository_owner."
          fi

  java:
    name: Java readiness
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
      - name: Build
        run: |
          mvn -B -f packages/sdk/sdk-java/pom.xml test
          mvn -B -f packages/sdk/sdk-java/pom.xml -DskipTests install
          mvn -B -f packages/sdk/agent-sdk-java/pom.xml verify
      - name: Check Maven Central + GPG secrets
        if: inputs.checkSecrets
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${MAVEN_CENTRAL_USERNAME:-}" ] && missing+=("MAVEN_CENTRAL_USERNAME")
          [ -z "${MAVEN_CENTRAL_PASSWORD:-}" ] && missing+=("MAVEN_CENTRAL_PASSWORD")
          [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ] && missing+=("MAVEN_GPG_PRIVATE_KEY")
          [ -z "${MAVEN_GPG_PASSPHRASE:-}" ] && missing+=("MAVEN_GPG_PASSPHRASE")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi

  php:
    name: PHP readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.2"
      - name: Validate composer package
        working-directory: packages/sdk/sdk-php
        run: |
          composer validate --strict
          php tests/lifecycle_test.php
          (cd ../agent-sdk-php && composer validate --strict && php tests/agent_loop_test.php)
  ruby:
    name: Ruby readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.2"
      - name: Build gem
        working-directory: packages/sdk/sdk-ruby
        run: |
          ruby tests/lifecycle_test.rb
          gem build phaseo_sdk.gemspec
          (cd ../agent-sdk-ruby && ruby -Ilib -Itests tests/agent_loop_test.rb && gem build phaseo_agent_sdk.gemspec)
      - name: Trusted publishing note
        if: inputs.checkSecrets
        run: echo "RubyGems publishing uses OIDC; verify the pending/existing trusted publisher in RubyGems.org."
