name: Desktop workspace

on:
    pull_request:
        paths:
            - "apps/desktop/**"
            - "packages/sdk/agent-sdk-ts/**"
            - "packages/sdk/sdk-ts/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/desktop.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: desktop-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows:
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install desktop dependencies
              run: pnpm install --filter @phaseo/desktop... --frozen-lockfile
            - name: Build desktop and agent SDK
              run: pnpm --filter @phaseo/desktop build
            - name: Lint
              run: pnpm --filter @phaseo/desktop lint
            - name: Typecheck
              run: pnpm --filter @phaseo/desktop typecheck
            - name: Runtime tests
              run: pnpm --filter @phaseo/desktop test
            - name: Electron workflows
              run: pnpm --filter @phaseo/desktop exec electron scripts/smoke.mjs
            - name: Package Windows app
              run: pnpm --filter @phaseo/desktop exec electron-forge package
            - name: Packaged Electron workflows
              run: pnpm --filter @phaseo/desktop exec electron scripts/smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Upload desktop evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: desktop-workspace-evidence
                  path: output/playwright/electron-workspace.png
                  if-no-files-found: ignore
