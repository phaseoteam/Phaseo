name: Desktop workspace

on:
    pull_request:
        paths:
            - "apps/desktop/**"
            - "packages/sdk/agent-sdk-ts/**"
            - "packages/sdk/sdk-ts/**"
            - "package.json"
            - "pnpm-lock.yaml"
            - "pnpm-workspace.yaml"
            - ".github/workflows/desktop.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: desktop-${{ github.ref }}
    cancel-in-progress: true

jobs:
    windows:
        runs-on: windows-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: "24"
                  package-manager-cache: false
            - name: Install desktop dependencies
              run: pnpm install --filter @phaseo/desktop... --frozen-lockfile
            - name: Install pinned OpenAI native CLI for catalog verification
              run: npm install --global @openai/codex@0.160.0
            - name: Build desktop and agent SDK
              run: pnpm --filter @phaseo/desktop build
            - name: Lint
              run: pnpm --filter @phaseo/desktop lint
            - name: Typecheck
              run: pnpm --filter @phaseo/desktop typecheck
            - name: Runtime tests
              run: pnpm --filter @phaseo/desktop test
            - name: Agent SDK runtime tests
              run: pnpm --filter @phaseo/agent-sdk test
            - name: Electron workflows
              run: pnpm --filter @phaseo/desktop exec electron scripts/smoke.mjs
            - name: Phaseo managed MCP tools
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-mcp-smoke.mjs --long-human-wait
            - name: Phaseo project instructions
              run: pnpm --filter @phaseo/desktop exec electron scripts/project-instructions-smoke.mjs
            - name: Phaseo global instruction settings
              run: pnpm --filter @phaseo/desktop exec electron scripts/global-instructions-smoke.mjs
            - name: Phaseo skill picker
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-skill-picker-smoke.mjs
            - name: Phaseo skill approvals and execution
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-skills-smoke.mjs
            - name: Phaseo structured questions
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-questions-smoke.mjs
            - name: Phaseo question forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-question-recovery-audit.mjs
            - name: Phaseo queue forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-question-recovery-audit.mjs --queue=true
            - name: Phaseo skill forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-skill-recovery-audit.mjs
            - name: Phaseo Chat skill forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-skill-recovery-audit.mjs --mode=chat
            - name: Reusable chat commands
              run: pnpm --filter @phaseo/desktop exec electron scripts/prompt-commands-smoke.mjs
            - name: OpenCode native command and skill picker
              run: pnpm --filter @phaseo/desktop exec electron scripts/native-actions-smoke.mjs
            - name: Pi native command and skill workflow
              run: pnpm --filter @phaseo/desktop exec electron scripts/pi-native-actions-smoke.mjs
            - name: Claude native command and skill workflow
              run: pnpm --filter @phaseo/desktop exec electron scripts/claude-native-actions-smoke.mjs
            - name: OpenAI installed native skill catalog
              run: pnpm --filter @phaseo/desktop exec node scripts/codex-native-catalog-smoke.mjs
            - name: OpenAI native skill picker
              run: pnpm --filter @phaseo/desktop exec electron scripts/codex-native-picker-smoke.mjs
            - name: Harness update workflow
              run: pnpm --filter @phaseo/desktop exec electron scripts/harness-maintenance-smoke.mjs
            - name: Chat shell and native browser
              run: pnpm --filter @phaseo/desktop audit:design
            - name: Native browser viewport geometry
              run: pnpm --filter @phaseo/desktop test:browser-viewport
            - name: Browser download history across restarts
              run: pnpm --filter @phaseo/desktop exec node scripts/browser-download-history-audit.mjs
            - name: Paged history workflows
              run: pnpm --filter @phaseo/desktop exec electron scripts/history-smoke.mjs
            - name: Verify project editor bridge
              run: pnpm --filter @phaseo/desktop exec electron scripts/editor-smoke.mjs
            - name: Verify individual Git staging
              run: pnpm --filter @phaseo/desktop exec electron scripts/git-hunks-smoke.mjs
            - name: Package Windows app
              run: pnpm --filter @phaseo/desktop exec electron-forge package
            - name: Packaged Electron workflows
              run: pnpm --filter @phaseo/desktop exec electron scripts/smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo managed MCP tools
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-mcp-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo project instructions
              run: pnpm --filter @phaseo/desktop exec electron scripts/project-instructions-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo global instruction settings
              run: pnpm --filter @phaseo/desktop exec electron scripts/global-instructions-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo skill picker
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-skill-picker-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo skill approvals and execution
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-skills-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo structured questions
              run: pnpm --filter @phaseo/desktop exec electron scripts/phaseo-questions-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo question forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-question-recovery-audit.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo queue forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-question-recovery-audit.mjs --queue=true --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo skill forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-skill-recovery-audit.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Phaseo Chat skill forced-crash recovery
              run: pnpm --filter @phaseo/desktop exec node scripts/phaseo-skill-recovery-audit.mjs --mode=chat --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged reusable chat commands
              run: pnpm --filter @phaseo/desktop exec electron scripts/prompt-commands-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged OpenCode native command and skill picker
              run: pnpm --filter @phaseo/desktop exec electron scripts/native-actions-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Pi native command and skill workflow
              run: pnpm --filter @phaseo/desktop exec electron scripts/pi-native-actions-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged Claude native command and skill workflow
              run: pnpm --filter @phaseo/desktop exec electron scripts/claude-native-actions-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged OpenAI native skill picker
              run: pnpm --filter @phaseo/desktop exec electron scripts/codex-native-picker-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged harness update workflow
              run: pnpm --filter @phaseo/desktop exec electron scripts/harness-maintenance-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged chat shell and native browser
              run: pnpm --filter @phaseo/desktop exec electron scripts/chat-shell-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged browser download history across restarts
              run: pnpm --filter @phaseo/desktop exec node scripts/browser-download-history-audit.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Packaged history workflows
              run: pnpm --filter @phaseo/desktop exec electron scripts/history-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Verify packaged project editor bridge
              run: pnpm --filter @phaseo/desktop exec electron scripts/editor-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Verify packaged individual Git staging
              run: pnpm --filter @phaseo/desktop exec electron scripts/git-hunks-smoke.mjs --app-entry=out/Phaseo-win32-x64/resources/app.asar/dist/main/index.mjs
            - name: Upload desktop evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: desktop-workspace-evidence
                  path: |
                      output/playwright/electron-workspace.png
                      output/playwright/chat-shell/
                      output/playwright/harness-maintenance/
                      output/playwright/prompt-commands/
                      output/playwright/native-actions/
                      output/playwright/pi-native-actions/
                      output/playwright/claude-native-actions/
                      output/playwright/codex-native-actions/
                      output/playwright/global-instructions/
                      output/playwright/phaseo-skills/
                      output/playwright/phaseo-questions/
                      output/playwright/phaseo-question-recovery/
                      output/playwright/phaseo-queue-recovery/
                        output/playwright/phaseo-skill-runtime/
                        output/playwright/phaseo-skill-recovery/
                      output/playwright/browser-viewport/
                  if-no-files-found: ignore
