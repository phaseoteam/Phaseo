name: Benchmark sources sync

on:
    schedule:
        - cron: "17 5 * * *"
    workflow_dispatch:
        inputs:
            only:
                description: Comma-separated source ids (empty runs every source)
                required: false
                default: ""
            write:
                description: Write results to the catalogue
                type: boolean
                default: true

concurrency:
    group: benchmark-sources-sync
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    sync:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
              with:
                  version: 10.33.0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Test sources and matching
              run: pnpm exec tsx --test "scripts/benchmark-sources/**/*.test.ts"
            - name: Sync leaderboards
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  ONLY: ${{ inputs.only }}
                  WRITE: ${{ github.event_name == 'schedule' || inputs.write }}
              run: |
                  args=(--report=benchmark-sources-report.json)
                  if [ -n "$ONLY" ]; then args+=("--only=$ONLY"); fi
                  if [ "$WRITE" = "true" ]; then args+=(--write); fi
                  pnpm data:sync-benchmark-sources "${args[@]}"
            - name: Upload matching report
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: benchmark-sources-report
                  path: benchmark-sources-report.json
                  if-no-files-found: ignore
