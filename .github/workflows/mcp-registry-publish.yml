# Publish the Phaseo MCP servers to the official MCP Registry (registry.modelcontextprotocol.io).
#
# Directories such as the GitHub MCP Registry, VS Code, Glama and mcp.directory read from it.
# The servers are published under app.phaseo/*, proved by a DNS TXT record on phaseo.app:
#   phaseo.app. TXT "v=MCPv1; k=ed25519; p=<base64 public key>"
# The matching private key (hex) is the MCP_REGISTRY_PRIVATE_KEY secret of the protected
# mcp-registry-publish environment. Never commit it.
#
# Every published version is permanent. Bump "version" in apps/mcp/registry/<server>/server.json first.
name: MCP Registry publish

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Server to publish"
        required: true
        type: choice
        options:
          - phaseo
          - docs

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.server }}
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    env:
      MCP_PUBLISHER_VERSION: v1.8.7
      SERVER_FILE: apps/mcp/registry/${{ inputs.server }}/server.json
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from refs/heads/main only."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Download and verify mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate
        run: ./mcp-publisher validate "$SERVER_FILE"

      - name: Authenticate with the phaseo.app DNS key
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MCP_REGISTRY_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_PRIVATE_KEY is not set on the mcp-registry-publish environment."
            exit 1
          fi
          ./mcp-publisher login dns --domain phaseo.app --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish
        run: ./mcp-publisher publish "$SERVER_FILE"
