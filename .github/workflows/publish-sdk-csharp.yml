name: Publish C# SDK

on:
  push:
    branches:
      - main
    paths:
      - "packages/sdk/sdk-csharp/package.json"
      - "packages/sdk/agent-sdk-csharp/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to packages/sdk/sdk-csharp/package.json version)"
        required: false
        type: string
      agent_version:
        description: "Agent SDK version to publish (defaults to Phaseo.AgentSdk.csproj version)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish-csharp:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from refs/heads/main only."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "8.0.x"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/sdk/sdk-csharp/package.json').version")"
          if [ -n "${INPUT_VERSION:-}" ] && [ "${INPUT_VERSION}" != "${version}" ]; then
            echo "::error::Requested version ${INPUT_VERSION} does not match committed version ${version}."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Validate telemetry literal matches publish version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const filePath = "packages/sdk/sdk-csharp/Client.cs";
          const source = fs.readFileSync(filePath, "utf8");
          const match = source.match(/new TelemetryRecorder\(devtools,\s*"([^"]+)"\)/);
          if (!match) {
            console.error(`::error::Unable to find telemetry version literal in ${filePath}.`);
            process.exit(1);
          }
          const actual = match[1];
          if (actual !== version) {
            console.error(`::error::Telemetry version mismatch in ${filePath}: expected ${version}, found ${actual}. Run pnpm run sdk:sync-language-manifests and commit the update before publishing.`);
            process.exit(1);
          }
          NODE

      - name: Build package
        run: |
          dotnet test packages/sdk/sdk-csharp/tests/Phaseo.Sdk.Tests/Phaseo.Sdk.Tests.csproj -c Release
          dotnet pack packages/sdk/sdk-csharp/Phaseo.Sdk.csproj \
            -c Release \
            -o artifacts/csharp \
            /p:Version=${{ steps.version.outputs.value }} \
            /p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Resolve Agent SDK version
        id: agent-version
        env:
          INPUT_VERSION: ${{ inputs.agent_version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          print(ET.parse("packages/sdk/agent-sdk-csharp/Phaseo.AgentSdk.csproj").findtext(".//Version"))
          PY
          )"
          if [ -n "${INPUT_VERSION:-}" ] && [ "${INPUT_VERSION}" != "${version}" ]; then
            echo "::error::Requested Agent SDK version ${INPUT_VERSION} does not match committed version ${version}."
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Agent SDK version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Agent SDK package
        run: |
          dotnet test packages/sdk/agent-sdk-csharp/tests/Phaseo.AgentSdk.Tests/Phaseo.AgentSdk.Tests.csproj -c Release
          dotnet pack packages/sdk/agent-sdk-csharp/Phaseo.AgentSdk.csproj \
            -c Release \
            -o artifacts/csharp-agent

      - name: NuGet login (OIDC -> temporary API key)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHING_USER || github.repository_owner }}

      - name: Publish to NuGet
        run: |
          dotnet nuget push "artifacts/csharp/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
          dotnet nuget push "artifacts/csharp/*.snupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
          dotnet nuget push "artifacts/csharp-agent/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
          dotnet nuget push "artifacts/csharp-agent/*.snupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
