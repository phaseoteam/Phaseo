name: Declarative schema verification

on:
    pull_request:
        paths:
            - 'supabase/schemas/**'
            - 'supabase/migrations/**'
            - 'supabase/config.toml'
            - 'supabase/baseline/**'
            - 'supabase/tests/**'
            - 'scripts/declarative-schema.mjs'
            - 'scripts/declarative-replay-history.mjs'
            - 'scripts/declarative-replay-history.test.mjs'
            - '.github/workflows/declarative-schema.yml'
    workflow_dispatch:
        inputs:
            generate_migration:
                description: Generate a forward migration from this branch's desired schemas
                type: boolean
                default: false
    merge_group:
        types: [checks_requested]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: '22'
            - name: Test disposable replay history preparation
              run: node --test scripts/declarative-replay-history.test.mjs
            - name: Test public model query behavior and permissions
              run: |
                  npm install --prefix "$RUNNER_TEMP/public-model-timeout-tests" --ignore-scripts --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/public-model-timeouts.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/gateway-admission-history.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/routing-archive.test.mjs
            - name: Verify declarative schemas against frozen baseline and forward migrations
              if: inputs.generate_migration != true
              run: node scripts/declarative-schema.mjs check
            - name: Generate forward migration in a disposable database
              if: inputs.generate_migration == true
              run: |
                  node scripts/declarative-schema.mjs sync -f automatic_provider_catalog_updates
                  mkdir -p generated-migrations
                  git ls-files --others --exclude-standard supabase/migrations | while IFS= read -r file; do
                    cp "$file" generated-migrations/
                  done
                  cp supabase/schemas/.pgdelta-export.json generated-migrations/
            - name: Replay baseline and exercise an incremental migration
              if: inputs.generate_migration != true
              run: node scripts/declarative-schema.mjs smoke
            - name: Upload generated migrations for review
              if: inputs.generate_migration == true
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: generated-forward-migrations
                  path: generated-migrations/
                  include-hidden-files: true
                  retention-days: 3
