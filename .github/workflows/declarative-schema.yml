                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/private-usage-label-breakdown.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/workspace-recent-credit-spend.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/workspace-credit-ledger-net.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/model-successor-routing.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/model-successor-auto-approval.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/gateway-model-successor-redirect.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/model-substitution-notice.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/model-discovery-provider-status.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/prompt-cache-prices.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/key-never-store-content.test.mjs
            - name: Verify declarative schemas against frozen baseline and forward migrations
              if: inputs.generate_migration != true
              run: node scripts/declarative-schema.mjs check
            - name: Generate forward migration in a disposable database
              if: inputs.generate_migration == true
              env:
                  MIGRATION_NAME: ${{ inputs.migration_name || 'declarative_change' }}
              run: |
                  node scripts/declarative-schema.mjs sync -f "$MIGRATION_NAME"
                  mkdir -p generated-migrations
                  git ls-files --others --exclude-standard supabase/migrations | while IFS= read -r file; do
                    cp "$file" generated-migrations/
                  done
                  cp supabase/schemas/.pgdelta-export.json generated-migrations/
            - name: Replay baseline and exercise an incremental migration
              if: inputs.generate_migration != true
              run: node scripts/declarative-schema.mjs smoke
            - name: Upload generated migrations for review
              if: inputs.generate_migration == true
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
              with:
                  name: generated-forward-migrations
                  path: generated-migrations/
                  include-hidden-files: true
                  retention-days: 3
