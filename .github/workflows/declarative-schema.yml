name: Declarative schema verification

on:
    pull_request:
        paths:
            - 'supabase/schemas/**'
            - 'supabase/migrations/**'
            - 'supabase/config.toml'
            - 'supabase/baseline/**'
            - 'scripts/declarative-schema.mjs'
            - '.github/workflows/declarative-schema.yml'
    workflow_dispatch:
    merge_group:
        types: [checks_requested]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: '22'
            - name: Generate baseline candidate when absent
              if: hashFiles('supabase/baseline/schema.sql') == ''
              run: node scripts/declarative-schema.mjs bootstrap
            - name: Save baseline candidate for review
              if: hashFiles('supabase/baseline/schema.sql') == ''
              uses: actions/upload-artifact@v4
              with:
                  name: baseline-candidate
                  path: supabase/.temp/baseline-candidate/
                  if-no-files-found: error
            - name: Verify declarative schemas against frozen baseline and forward migrations
              run: node scripts/declarative-schema.mjs check
