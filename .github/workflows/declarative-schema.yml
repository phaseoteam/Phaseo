name: Declarative schema verification

on:
    pull_request:
        paths:
            - 'supabase/schemas/**'
            - 'supabase/migrations/**'
            - 'supabase/config.toml'
            - 'supabase/baseline/**'
            - 'supabase/tests/**'
            - 'scripts/declarative-schema.mjs'
            - 'scripts/rollup-lock-smoke.mjs'
            - 'scripts/declarative-replay-history.mjs'
            - 'scripts/declarative-replay-history.test.mjs'
            - '.github/workflows/declarative-schema.yml'
    workflow_dispatch:
        inputs:
            generate_migration:
                description: Generate a forward migration from this branch's desired schemas
                type: boolean
                default: false
            migration_name:
                description: Name of the generated forward migration
                type: string
                default: declarative_change
    merge_group:
        types: [checks_requested]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '22'
            - name: Test disposable replay history preparation
              run: node --test scripts/declarative-replay-history.test.mjs
            - name: Test public model query behavior and permissions
              run: |
                  npm install --prefix "$RUNNER_TEMP/public-model-timeout-tests" --ignore-scripts --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/artificial-analysis-snapshots.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/artificial-analysis-public-data.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/public-model-timeouts.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/monitor-model-rows.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/model-licence-data.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/analytics-outbox-coalescing.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/gateway-admission-history.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/routing-archive.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/scheduled-model-pricing.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/routing-prune-removal.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/cache-telemetry-privacy.test.mjs
                  PGLITE_MODULE="file://$RUNNER_TEMP/public-model-timeout-tests/node_modules/@electric-sql/pglite/dist/index.js" node supabase/tests/gateway-catalogue-snapshot-at.test.mjs
