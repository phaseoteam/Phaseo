name: Epoch ECI benchmark sync

on:
    schedule:
        - cron: "41 4 * * *"
    workflow_dispatch:

concurrency:
    group: epoch-eci-benchmark-sync
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    sync:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
              with:
                  version: 10.33.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Test benchmark matching
              run: pnpm exec tsx --test scripts/epoch-eci/core.test.ts
            - name: Fetch benchmark snapshot
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
              run: pnpm data:sync-epoch-eci --write --report=epoch-eci-report.json
            - name: Upload matching report
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: epoch-eci-matching
                  path: epoch-eci-report.json
                  if-no-files-found: ignore
