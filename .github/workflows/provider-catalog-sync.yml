name: Provider Catalog Sync

on:
    repository_dispatch:
        types: [provider-catalog-change]
    workflow_dispatch:
        inputs:
            providers:
                description: Comma-separated provider IDs (blank checks all providers)
                required: false
                type: string
    schedule:
        - cron: "7 * * * *"

concurrency:
    group: provider-catalog-sync
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    sync:
        name: Batch provider catalog sync
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - name: Resolve provider filter
              id: provider-filter
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  MANUAL_PROVIDERS: ${{ inputs.providers }}
                  DISPATCH_PROVIDERS: ${{ toJSON(github.event.client_payload.providers) }}
              shell: bash
              run: |
                  set -euo pipefail
                  providers=""
                  if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "${MANUAL_PROVIDERS:-}" ]]; then
                    providers="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "") | ascii_downcase) | map(select(test("^[a-z0-9][a-z0-9-]*$"))) | unique | join(",")' <<<"$MANUAL_PROVIDERS")"
                  elif [[ "$EVENT_NAME" == "repository_dispatch" && "${DISPATCH_PROVIDERS:-null}" != "null" ]]; then
                    providers="$(jq -r 'if type == "array" then map(strings | ascii_downcase) | map(select(test("^[a-z0-9][a-z0-9-]*$"))) | unique | join(",") else "" end' <<<"$DISPATCH_PROVIDERS")"
                  fi
                  echo "providers=$providers" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Synchronize provider discovery state
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
                  FASTROUTER_API_KEY: ${{ secrets.FASTROUTER_API_KEY }}
                  NOVITA_API_KEY: ${{ secrets.NOVITA_API_KEY }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
                  PIONEER_API_KEY: ${{ secrets.PIONEER_API_KEY }}
                  POE_API_KEY: ${{ secrets.POE_API_KEY }}
                  REQUESTY_API_KEY: ${{ secrets.REQUESTY_API_KEY }}
                  ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
              run: pnpm --filter @phaseo/web catalog:sync:database --providers="${{ steps.provider-filter.outputs.providers }}"

            - name: Upload sync report
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name: database-catalog-sync
                  path: apps/web/.sync/database-catalog-sync.json
                  retention-days: 90
                  if-no-files-found: ignore
