name: Publish Agent SDKs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-agent-sdks.yml"
      - "packages/sdk/agent-sdk-py/**"
      - "packages/sdk/agent-sdk-csharp/**"
      - "packages/sdk/agent-sdk-go/**"
      - "packages/sdk/agent-sdk-php/**"
      - "packages/sdk/agent-sdk-ruby/**"
  workflow_dispatch:
    inputs:
      python:
        description: "Publish the Python Agent SDK"
        required: false
        type: boolean
        default: true
      go:
        description: "Tag the Go Agent SDK"
        required: false
        type: boolean
        default: true
      php:
        description: "Publish the PHP Agent SDK"
        required: false
        type: boolean
        default: true
      ruby:
        description: "Publish the Ruby Agent SDK"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-python:
    name: Build Python Agent SDK
    if: github.event_name != 'workflow_dispatch' || inputs.python
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.registry.outputs.should_publish }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check PyPI release status
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import tomllib
          import urllib.error
          import urllib.parse
          import urllib.request

          project = tomllib.loads(
              pathlib.Path("packages/sdk/agent-sdk-py/pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          package = project["name"]
          version = project["version"]
          url = f"https://pypi.org/pypi/{urllib.parse.quote(package)}/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  releases = json.load(response).get("releases", {})
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              releases = {}

          should_publish = version not in releases
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"should_publish={str(should_publish).lower()}", file=output)
          print(f"{package} {version} {'is missing from' if should_publish else 'already exists on'} PyPI")
          PY
      - name: Test and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build
          python -m pip install -e packages/sdk/sdk-py -e packages/sdk/agent-sdk-py
          python -m pytest packages/sdk/agent-sdk-py/tests
          python -m build packages/sdk/agent-sdk-py
      - name: Upload distributions
        if: steps.registry.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-agent-sdk-${{ steps.registry.outputs.version }}
          path: packages/sdk/agent-sdk-py/dist/*
          if-no-files-found: error

  publish-python:
    name: Publish Python Agent SDK
    if: github.ref == 'refs/heads/main' && needs.build-python.outputs.should-publish == 'true'
    needs: build-python
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-agent-sdk-${{ needs.build-python.outputs.version }}
          path: dist/python-agent
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/python-agent
          skip-existing: true

  test-go:
    name: Test Go Agent SDK
    if: github.event_name != 'workflow_dispatch' || inputs.go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.24"
          cache: false
      - name: Test module
        run: go -C packages/sdk/agent-sdk-go test ./...

  publish-go:
    name: Tag Go Agent SDK
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.go)
    needs: test-go
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Run this workflow from main only."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.PHASEO_APP_CLIENT_ID }}
          private-key: ${{ secrets.PHASEO_APP_PRIVATE_KEY }}
      - name: Resolve GitHub App identity
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          bot="${{ steps.app-token.outputs.app-slug }}[bot]"
          id="$(gh api "/users/${bot}" --jq .id)"
          echo "name=${bot}" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${bot}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - name: Tag module
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USER_NAME: ${{ steps.app-identity.outputs.name }}
          GIT_USER_EMAIL: ${{ steps.app-identity.outputs.email }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < packages/sdk/agent-sdk-go/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Go Agent SDK version: $version"
            exit 1
          fi
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          tag="packages/sdk/agent-sdk-go/v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists on origin: $tag"
            exit 0
          fi
          git tag -a "$tag" -m "Go Agent SDK v${version}"
          git push "https://x-access-token:${GH_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"

  test-php:
    name: Test PHP Agent SDK
    if: github.event_name != 'workflow_dispatch' || inputs.php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.2"
      - name: Test package
        shell: bash
        run: |
          set -euo pipefail
          composer --working-dir=packages/sdk/agent-sdk-php validate --strict
          php packages/sdk/agent-sdk-php/tests/agent_loop_test.php

  publish-php:
    name: Publish PHP Agent SDK
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.php)
    needs: test-php
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Run this workflow from main only."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ secrets.PHASEO_APP_CLIENT_ID }}
          private-key: ${{ secrets.PHASEO_APP_PRIVATE_KEY }}
          owner: phaseoteam
          repositories: |
            Phaseo
            phaseo-php-agent-sdk
      - name: Resolve GitHub App identity
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          bot="${{ steps.app-token.outputs.app-slug }}[bot]"
          id="$(gh api "/users/${bot}" --jq .id)"
          echo "name=${bot}" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${bot}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - name: Tag and sync split repository
        id: split
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_USER_NAME: ${{ steps.app-identity.outputs.name }}
          GIT_USER_EMAIL: ${{ steps.app-identity.outputs.email }}
          PHP_AGENT_SDK_SPLIT_REPO: ${{ vars.PHP_AGENT_SDK_SPLIT_REPO }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < packages/sdk/agent-sdk-php/VERSION)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid PHP Agent SDK version: $version"
            exit 1
          fi
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          tag="agent-sdk-php/v${version}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git tag -a "$tag" -m "PHP Agent SDK v${version}"
            git push "https://x-access-token:${GH_APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"
          fi
          split_repo="${PHP_AGENT_SDK_SPLIT_REPO:-phaseoteam/phaseo-php-agent-sdk}"
          split_url="https://github.com/${split_repo}"
          git remote add split "https://x-access-token:${GH_APP_TOKEN}@github.com/${split_repo}.git"
          split_commit="$(git subtree split --prefix=packages/sdk/agent-sdk-php HEAD)"
          git push --force split "${split_commit}:refs/heads/main"
          if ! git ls-remote --exit-code --tags split "refs/tags/v${version}" >/dev/null 2>&1; then
            git push split "${split_commit}:refs/tags/v${version}"
          fi
          echo "repo_url=${split_url}" >> "$GITHUB_OUTPUT"
      - name: Notify Packagist
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_SAFE_TOKEN: ${{ secrets.PACKAGIST_SAFE_TOKEN }}
          PACKAGIST_REPOSITORY_URL: ${{ steps.split.outputs.repo_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_USERNAME:-}" ] || [ -z "${PACKAGIST_SAFE_TOKEN:-}" ]; then
            echo "::error::Missing PACKAGIST_USERNAME or PACKAGIST_SAFE_TOKEN."
            exit 1
          fi
          if [ -z "${PACKAGIST_REPOSITORY_URL:-}" ]; then
            echo "::error::Missing split repository URL output."
            exit 1
          fi
          response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST "https://packagist.org/api/update-package" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_SAFE_TOKEN}" \
            -d "{\"repository\":\"${PACKAGIST_REPOSITORY_URL}\"}")"
          echo "$response" | jq -e '.status == "success"' >/dev/null
          echo "Packagist refresh queued successfully."

  build-ruby:
    name: Build Ruby Agent SDK
    if: github.event_name != 'workflow_dispatch' || inputs.ruby
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.registry.outputs.should_publish }}
      version: ${{ steps.registry.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.2"
      - name: Check RubyGems release status
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          version="$(ruby -e 'spec = Gem::Specification.load("packages/sdk/agent-sdk-ruby/phaseo_agent_sdk.gemspec"); abort "invalid gemspec" unless spec; print spec.version')"
          if ! status="$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            "https://rubygems.org/api/v2/rubygems/phaseo_agent_sdk/versions/${version}.json")"; then
            echo "::error::Unable to query RubyGems.org release status."
            exit 1
          fi
          if [ "$status" = "200" ]; then
            should_publish=false
          elif [ "$status" = "404" ]; then
            should_publish=true
          else
            echo "::error::Unexpected RubyGems.org response: HTTP ${status}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
      - name: Test and build
        working-directory: packages/sdk/agent-sdk-ruby
        run: |
          (cd ../sdk-ruby && gem build phaseo_sdk.gemspec)
          gem install --local ../sdk-ruby/phaseo_sdk-*.gem --no-document
          ruby -Ilib -Itests tests/agent_loop_test.rb
          gem build phaseo_agent_sdk.gemspec
      - name: Upload gem
        if: steps.registry.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ruby-agent-sdk-${{ steps.registry.outputs.version }}
          path: packages/sdk/agent-sdk-ruby/phaseo_agent_sdk-*.gem
          if-no-files-found: error

  publish-ruby:
    name: Publish Ruby Agent SDK
    if: github.ref == 'refs/heads/main' && needs.build-ruby.outputs.should-publish == 'true'
    needs: build-ruby
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ruby-agent-sdk-${{ needs.build-ruby.outputs.version }}
          path: dist/ruby-agent
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.2"
      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a
      - name: Publish to RubyGems
        run: gem push "dist/ruby-agent/phaseo_agent_sdk-${{ needs.build-ruby.outputs.version }}.gem"
