name: Catalog Database Snapshot

on:
    workflow_dispatch:
    schedule:
        - cron: "0 0 * * *"

concurrency:
    group: catalog-database-snapshot
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    export:
        name: Export production catalog
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
              with:
                  client-id: ${{ secrets.PHASEO_APP_CLIENT_ID }}
                  private-key: ${{ secrets.PHASEO_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false
                  token: ${{ steps.app-token.outputs.token }}

            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false

            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 22
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Export deterministic JSON snapshot
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
              run: pnpm --filter @phaseo/web catalog:export:database

            - name: Preserve this daily snapshot
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: catalog-database-${{ github.run_id }}-${{ github.run_attempt }}
                  path: packages/data/catalog/generated/database-v2/
                  if-no-files-found: error
                  retention-days: 90

            - name: Regenerate SDK catalog helpers
              run: |
                  pnpm openapi:gen
                  node scripts/sdk/generate-model-id-constants.mjs

            - name: Record SDK helper additions
              shell: bash
              run: |
                  if ! git diff --quiet -- packages/sdk; then
                    cat > .changeset/catalog-database-helpers.md <<'EOF'
                  ---
                  "@phaseo/sdk": minor
                  "@phaseo/py-sdk": minor
                  "@phaseo/go-sdk": minor
                  "@phaseo/csharp-sdk": minor
                  "@phaseo/java-sdk": minor
                  "@phaseo/php-sdk": minor
                  "@phaseo/ruby-sdk": minor
                  "@phaseo/cpp-sdk": minor
                  "@phaseo/rust-sdk": minor
                  ---

                  Refresh generated catalog helpers from the public database snapshot.
                  EOF
                  fi

            - name: Resolve snapshot branch
              id: snapshot-branch
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              shell: bash
              run: |
                  branch="$(gh pr list --state open --base main --json headRefName --jq '.[] | select(.headRefName | startswith("automation/catalog-database-snapshot-")) | .headRefName' | head -n 1)"
                  if [[ -z "$branch" ]]; then
                    branch="automation/catalog-database-snapshot-$GITHUB_RUN_ID"
                  fi
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"

            - name: Open or update snapshot pull request
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  branch: ${{ steps.snapshot-branch.outputs.branch }}
                  base: main
                  delete-branch: true
                  add-paths: |
                      packages/data/catalog/generated/database-v2/**
                      apps/docs/openapi/v1/openapi.yaml
                      packages/sdk/**
                      .changeset/catalog-database-helpers.md
                  commit-message: "chore(data): snapshot database catalog"
                  title: "Snapshot database catalog"
                  body: |
                      Daily deterministic JSON snapshot of the production v2 catalogue.

                      The database remains authoritative; this PR provides review, history, and recovery data.

                      Commands run:
                      - `pnpm install --frozen-lockfile`
                      - `pnpm --filter @phaseo/web catalog:export:database`
                      - `pnpm openapi:gen`

                      Linked issues: none

                      Created with Codex
