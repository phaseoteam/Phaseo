name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    merge_group:
        types: [checks_requested]
    workflow_dispatch:
        inputs:
            deploy_production:
                description: "Deploy main after confirming production migrations are already applied"
                required: false
                type: boolean
                default: false
            publish_cli:
                description: "Publish only the committed @phaseo/cli version to npm"
                required: false
                type: boolean
                default: false
            importer_mode:
                description: "Explicit production importer action"
                required: false
                type: choice
                options:
                    - skip
                    - dry-run
                    - run
                default: skip
permissions:
    contents: read

concurrency:
    group: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true)) && 'production-release' || format('ci-{0}-{1}', github.workflow, github.ref) }}
    cancel-in-progress: false

env:
    NODE_VERSION: 22

jobs:
    prepare-cli-release:
        name: Prepare CLI release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_cli == true
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  package-manager-cache: false

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Build, test, and pack CLI
              run: pnpm run validate:cli

            - name: Upload CLI package
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: phaseo-cli-package
                  path: .tmp/cli-pack/*.tgz
                  if-no-files-found: error
                  retention-days: 1

    publish-cli:
        name: Publish CLI
        needs: prepare-cli-release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_cli == true
        runs-on: ubuntu-latest
        environment: release
        concurrency:
            group: cli-release-publish
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write
        env:
            NPM_CONFIG_PROVENANCE: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Download CLI package
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: phaseo-cli-package
                  path: cli-package

            - name: Check CLI release status
              id: cli-npm-release
              run: |
                  node --input-type=module <<'NODE'
                  import fs from "node:fs";
                  import packageJson from "./packages/cli/phaseo/package.json" with { type: "json" };

                  const packagePath = encodeURIComponent(packageJson.name);
                  const versionPath = encodeURIComponent(packageJson.version);
                  const response = await fetch(`https://registry.npmjs.org/${packagePath}/${versionPath}`);

                  if (response.status !== 200 && response.status !== 404) {
                    throw new Error(`npm registry returned ${response.status} while checking ${packageJson.name}@${packageJson.version}`);
                  }

                  const shouldPublish = response.status === 404;
                  fs.appendFileSync(
                    process.env.GITHUB_OUTPUT,
                    `package=${packageJson.name}\nversion=${packageJson.version}\nshould_publish=${shouldPublish}\n`,
                  );

                  const status = shouldPublish ? "is missing from" : "already exists on";
                  console.log(`${packageJson.name}@${packageJson.version} ${status} npm`);
                  NODE

            - name: Force pure OIDC npm auth context
              if: steps.cli-npm-release.outputs.should_publish == 'true'
              run: |
                  echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
                  echo "NPM_TOKEN=" >> "$GITHUB_ENV"
                  oidc_npmrc="$RUNNER_TEMP/oidc-only.npmrc"
                  printf "registry=https://registry.npmjs.org\nalways-auth=false\n" > "$oidc_npmrc"
                  echo "NPM_CONFIG_USERCONFIG=$oidc_npmrc" >> "$GITHUB_ENV"

            - name: Publish CLI to npm
              if: steps.cli-npm-release.outputs.should_publish == 'true'
              shell: bash
              run: |
                  mapfile -t artifacts < <(find cli-package -maxdepth 1 -type f -name '*.tgz' -print)
                  if [[ ${#artifacts[@]} -ne 1 ]]; then
                    echo "::error::Expected exactly one CLI package artifact, found ${#artifacts[@]}"
                    exit 1
                  fi
                  npm publish "${artifacts[0]}" --access public --ignore-scripts

    data:
        name: Validate data
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  registry-url: https://registry.npmjs.org

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Validate CI secret boundaries
              run: pnpm run validate:ci-security

            - name: Validate canonical Phaseo domain
              run: pnpm run validate:domains

            - name: Validate unique Supabase migration versions
              shell: bash
              run: |
                  duplicates="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sed -E 's/^([0-9]+)_.*/\1/' | sort | uniq -d)"
                  if [[ -n "$duplicates" ]]; then
                    echo "::error::Duplicate Supabase migration version(s):"
                    echo "$duplicates"
                    exit 1
                  fi

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Test model-discovery GitHub issue sync helpers
              run: pnpm exec tsx scripts/model-discovery/github-issues.test.ts

            - name: Validate data files
              run: pnpm run validate:data && pnpm run validate:pricing && pnpm run validate:gateway

    check-paths:
        name: Check changed paths
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            data-changed: ${{ steps.filter.outputs.data }}
            migrations-changed: ${{ steps.filter.outputs.migrations }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
              id: filter
              with:
                  filters: |
                      data: 'packages/data/catalog/src/data/**'
                      migrations:
                          - 'supabase/migrations/**'
                          - 'supabase/config.toml'
                          - 'scripts/validate-supabase-migrations.mjs'

    migration-validation:
        name: Validate database migration policy
        runs-on: ubuntu-latest
        needs: check-paths
        if: >-
            always() &&
            needs.check-paths.result == 'success' &&
            needs.check-paths.outputs.migrations-changed == 'true'
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0

            - name: Validate migration history
              env:
                  MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
              run: node scripts/validate-supabase-migrations.mjs "${MIGRATION_BASE_SHA}"

    migrate-production:
        name: Apply production database migrations
        runs-on: ubuntu-latest
        needs:
            - check-paths
            - migration-validation
        if: >-
            always() &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' &&
            needs.check-paths.result == 'success' &&
            needs.check-paths.outputs.migrations-changed == 'true' &&
            needs.migration-validation.result == 'success' &&
            vars.ENABLE_PRODUCTION_DB_MIGRATIONS == 'true'
        environment: production-database
        concurrency:
            group: production-database-migrations
            cancel-in-progress: false
        permissions:
            contents: read
        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
            SUPABASE_YES: "true"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Validate production migration configuration
              shell: bash
              run: |
                  set -euo pipefail
                  missing=()
                  [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] && missing+=("SUPABASE_ACCESS_TOKEN")
                  [ -z "${SUPABASE_DB_PASSWORD:-}" ] && missing+=("SUPABASE_DB_PASSWORD")
                  [ -z "${SUPABASE_PROJECT_ID:-}" ] && missing+=("SUPABASE_PROJECT_ID")
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::Missing production-database environment secret(s): ${missing[*]}"
                    exit 1
                  fi

            - name: Link production project
              shell: bash
              run: |
                  set -euo pipefail
                  npx --yes supabase@2.111.0 link \
                    --project-ref "${SUPABASE_PROJECT_ID}" \
                    --password "${SUPABASE_DB_PASSWORD}"

            - name: Preview pending production migrations
              shell: bash
              run: |
                  set -euo pipefail
                  npx --yes supabase@2.111.0 db push \
                    --linked \
                    --include-all \
                    --dry-run \
                    --password "${SUPABASE_DB_PASSWORD}"

            - name: Apply pending production migrations
              shell: bash
              run: |
                  set -euo pipefail
                  npx --yes supabase@2.111.0 db push \
                    --linked \
                    --include-all \
                    --password "${SUPABASE_DB_PASSWORD}"

    openapi-lint:
        name: OpenAPI lint
        runs-on: ubuntu-latest
        needs: data
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  registry-url: https://registry.npmjs.org

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Validate SDK version literals
              run: pnpm run sdk:check-version-literals

            - name: Sync OpenAPI enums from manifest
              run: pnpm run openapi:sync-enums

            - name: Lint OpenAPI spec
              run: pnpm run openapi:lint

            - name: Ensure OpenAPI enum sync is committed
              run: |
                  if ! git diff --ignore-cr-at-eol --ignore-space-at-eol --quiet apps/docs/openapi/v1/openapi.yaml; then
                    echo "::error::OpenAPI enums are out of sync with manifest data."
                    echo "::error::Run 'pnpm run openapi:sync-enums' and commit apps/docs/openapi/v1/openapi.yaml."
                    git diff apps/docs/openapi/v1/openapi.yaml
                    exit 1
                  fi

    apps:
        name: Apps ${{ matrix.app }}
        runs-on: ubuntu-latest
        needs: openapi-lint
        strategy:
            matrix:
                app: [api, docs, web, web-api, mcp]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: API lint, test & build
              if: matrix.app == 'api'
              run: |
                  pnpm run validate:api
                  pnpm --filter @phaseo/gateway-api exec vitest run src/executors/_shared/text-generate/openai-compat/__tests__/execute.test.ts
                  cd apps/api && pnpm exec tsx scripts/pricing-simulator-cli.ts

            - name: Docs validation
              if: matrix.app == 'docs'
              run: pnpm run validate:docs

            - name: Web validation
              if: matrix.app == 'web'
              run: pnpm --filter @phaseo/web exec next build --experimental-build-mode compile

            - name: Web API lint, test & build
              if: matrix.app == 'web-api'
              run: |
                  pnpm --filter @phaseo/web-api lint
                  pnpm --filter @phaseo/web-api test
                  pnpm --filter @phaseo/web-api build

            - name: MCP typecheck, test & production build
              if: matrix.app == 'mcp'
              run: |
                  pnpm --filter @phaseo/mcp typecheck
                  pnpm --filter @phaseo/mcp test
                  pnpm --filter @phaseo/mcp build:production

    api-aimock:
        name: API AIMock matrix
        runs-on: ubuntu-latest
        needs: openapi-lint
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Run AIMock gateway matrix
              run: pnpm --filter @phaseo/gateway-api test:aimock

    devtools:
        name: Devtools build
        runs-on: ubuntu-latest
        needs: openapi-lint
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Build devtools packages
              run: |
                  pnpm --filter @phaseo/devtools-core run build
                  pnpm --filter @phaseo/devtools-viewer run build

    importer:
        name: Run importer on main
        runs-on: ubuntu-latest
        outputs:
            state_changed: ${{ steps.importer-state-change.outputs.changed }}
        concurrency:
            group: importer-main
            cancel-in-progress: false
        needs:
            - data
            - check-paths
            - migrate-production
        if: >-
            always() && needs.data.result == 'success' && github.ref == 'refs/heads/main' &&
            ((github.event_name == 'push' &&
            needs.check-paths.outputs.migrations-changed == 'true' &&
            needs.migrate-production.result == 'success') ||
            (github.event_name == 'push' &&
            needs.check-paths.outputs.data-changed == 'true' &&
            needs.check-paths.outputs.migrations-changed != 'true' &&
            (needs.migrate-production.result == 'success' || needs.migrate-production.result == 'skipped')) ||
            (github.event_name == 'workflow_dispatch' && inputs.importer_mode != 'skip'))
        env:
            SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Restore importer hash state
              id: importer-state-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: packages/data/catalog/src/data/.import-state.json
                  key: importer-state-main-${{ github.run_id }}
                  restore-keys: |
                      importer-state-main-

            - name: Validate importer configuration
              shell: bash
              run: |
                  set -euo pipefail
                  missing=()
                  [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ] && missing+=("SUPABASE_SERVICE_ROLE_KEY")
                  [ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ] && missing+=("NEXT_PUBLIC_SUPABASE_URL")
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::Missing importer secret(s): ${missing[*]}"
                    exit 1
                  fi

            - name: Run importer (all sections)
              env:
                  SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
                  NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
              shell: bash
              run: |
                  set -euo pipefail
                  importer_args=(--section=all)
                  if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.importer_mode }}" == "dry-run" ]]; then
                    importer_args+=(--dry-run)
                  fi
                  for attempt in 1 2 3; do
                    echo "Running importer attempt ${attempt}/3"
                    set +e
                    (cd apps/web && pnpm exec tsx scripts/importer/main.ts "${importer_args[@]}")
                    exit_code=$?
                    set -e
                    if [ "${exit_code}" -eq 0 ]; then
                      echo "Importer succeeded on attempt ${attempt}"
                      exit 0
                    fi
                    if [ "${exit_code}" -ne 75 ]; then
                      echo "Importer failed with a deterministic error (exit ${exit_code}); not retrying."
                      exit "${exit_code}"
                    fi
                    if [ "${attempt}" -lt 3 ]; then
                      sleep_for=$((attempt * 15))
                      echo "Importer failed, retrying in ${sleep_for}s..."
                      sleep "${sleep_for}"
                    fi
                  done
                  echo "Importer failed after 3 attempts"
                  exit 1

            - name: Verify changed models are publicly available
              if: github.event_name == 'push'
              env:
                  IMPORT_BASE_SHA: ${{ github.event.before }}
              run: node scripts/verify-published-models.mjs

            - name: Save importer hash state
              if: success() && inputs.importer_mode != 'dry-run'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
              with:
                  path: packages/data/catalog/src/data/.import-state.json
                  key: ${{ steps.importer-state-cache.outputs.cache-primary-key }}

            - name: Check importer state update
              id: importer-state-change
              if: success() && inputs.importer_mode != 'dry-run' && env.SUPABASE_SERVICE_ROLE_KEY != '' && env.NEXT_PUBLIC_SUPABASE_URL != ''
              shell: bash
              run: |
                  set -euo pipefail
                  state_file="packages/data/catalog/src/data/.import-state.json"
                  if git diff --quiet -- "${state_file}"; then
                    echo "changed=false" >> "${GITHUB_OUTPUT}"
                    echo "Importer state is already committed."
                    exit 0
                  fi
                  echo "changed=true" >> "${GITHUB_OUTPUT}"

            - name: Upload importer state
              if: steps.importer-state-change.outputs.changed == 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: importer-state-${{ github.run_id }}-${{ github.run_attempt }}
                  path: packages/data/catalog/src/data/.import-state.json
                  include-hidden-files: true
                  if-no-files-found: error
                  retention-days: 1

    importer-state-pr:
        name: Publish importer state PR
        runs-on: ubuntu-latest
        needs: importer
        if: needs.importer.result == 'success' && needs.importer.outputs.state_changed == 'true'
        concurrency:
            group: importer-state-pr
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Download importer state
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: importer-state-${{ github.run_id }}-${{ github.run_attempt }}
                  path: importer-state-artifact

            - name: Validate importer state artifact
              shell: bash
              run: |
                  set -euo pipefail
                  artifact="importer-state-artifact/.import-state.json"
                  state_file="packages/data/catalog/src/data/.import-state.json"
                  [[ -f "${artifact}" && ! -L "${artifact}" ]]
                  [[ "$(wc -c < "${artifact}")" -le 4194304 ]]
                  python -m json.tool "${artifact}" >/dev/null
                  install -m 0644 "${artifact}" "${state_file}"

            - name: Create minimal GitHub App token
              id: importer-app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
              with:
                  client-id: ${{ secrets.PHASEO_APP_CLIENT_ID }}
                  private-key: ${{ secrets.PHASEO_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - name: Publish importer state update
              env:
                  GH_TOKEN: ${{ steps.importer-app-token.outputs.token }}
              shell: bash
              run: |
                  set -euo pipefail
                  state_file="packages/data/catalog/src/data/.import-state.json"
                  branch="automation/importer-state"
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git fetch origin "${branch}" || true
                  remote_branch_sha=""
                  if git show-ref --verify --quiet "refs/remotes/origin/${branch}"; then
                    remote_branch_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
                  fi
                  git switch --force-create "${branch}" HEAD
                  git add "${state_file}"
                  git commit -m "chore(data): persist importer state"
                  remote_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
                  if [[ -n "${remote_branch_sha}" ]]; then
                    git push --force-with-lease="${branch}:${remote_branch_sha}" "${remote_url}" "${branch}"
                  else
                    git push --set-upstream "${remote_url}" "${branch}"
                  fi
                  existing_pr="$(gh pr list --state open --base main --head "${branch}" --json number --jq '.[0].number')"
                  if [[ -z "${existing_pr}" ]]; then
                    gh pr create \
                      --base main \
                      --head "${branch}" \
                      --title "chore(data): persist importer state" \
                      --body "Automated update of the committed importer hash state after a successful main import. This PR is intentionally reused and updated by subsequent imports."
                  fi

    sdk-gen:
        name: Generate SDKs
        runs-on: ubuntu-latest
        needs: openapi-lint
        strategy:
            fail-fast: false
            matrix:
                include:
                    - sdk: ts
                      name: Generate TS SDK
                    - sdk: py
                      name: Generate PY SDK
                    - sdk: go
                      name: Generate GO SDK
                    - sdk: csharp
                      name: Generate C# SDK
                    - sdk: php
                      name: Generate PHP SDK
                    - sdk: ruby
                      name: Generate Ruby SDK
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            # --- ACTUAL GENERATION ---
            - name: Generate ${{ matrix.sdk }} SDK
              run: |
                  case "${{ matrix.sdk }}" in
                    ts) pnpm run openapi:gen:ts ;;
                    py) pnpm run openapi:gen:py ;;
                    go) pnpm run openapi:gen:go ;;
                    csharp) pnpm run openapi:gen:csharp ;;
                    php) pnpm run openapi:gen:php ;;
                    ruby) pnpm run openapi:gen:ruby ;;
                  esac

            # --- EXISTING CONSISTENCY CHECK ---
            - name: Ensure OpenAPI outputs up to date
              run: |
                  case "${{ matrix.sdk }}" in
                    ts) gen_path="packages/sdk/sdk-ts/src/oapi-gen" ; gen_script="openapi:gen:ts" ;;
                    py) gen_path="packages/sdk/sdk-py/src/gen" ; gen_script="openapi:gen:py" ;;
                    go) gen_path="packages/sdk/sdk-go/src/gen" ; gen_script="openapi:gen:go" ;;
                    csharp) gen_path="packages/sdk/sdk-csharp/src/gen" ; gen_script="openapi:gen:csharp" ;;
                    php) gen_path="packages/sdk/sdk-php/src/gen" ; gen_script="openapi:gen:php" ;;
                    ruby) gen_path="packages/sdk/sdk-ruby/lib/gen" ; gen_script="openapi:gen:ruby" ;;
                  esac
                  echo "Checking that OpenAPI spec and '${{ matrix.sdk }}' SDK are up to date..."
                  if ! git diff --ignore-cr-at-eol --ignore-space-at-eol --quiet apps/docs/openapi/v1/openapi.yaml $gen_path; then
                    echo "::error::Detected *non-whitespace* differences in OpenAPI spec or generated '${{ matrix.sdk }}' SDK."
                    echo "::error::Please run 'pnpm run $gen_script' locally and commit the updated files."
                    echo ""
                    echo "Full diff:"
                    git diff apps/docs/openapi/v1/openapi.yaml $gen_path
                    exit 1
                  fi
                  echo "OpenAPI spec and '${{ matrix.sdk }}' SDK are in sync."

    packages:
        name: Build & test SDK packages
        runs-on: ubuntu-latest
        needs: sdk-gen
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Set up Python for SDK builds
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
              with:
                  python-version: "3.12"

            - name: Install Python build tooling
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build pytest
                  python -m pip install -e packages/sdk/sdk-py

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Build SDKs
              run: pnpm run validate:packages

    cli:
        name: CLI package
        runs-on: ubuntu-latest
        needs: sdk-gen
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  persist-credentials: false

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Build, test, and pack CLI
              run: pnpm run validate:cli

    sdk-lifecycle-tests:
        name: SDK lifecycle tests (${{ matrix.sdk }})
        runs-on: ubuntu-latest
        needs: sdk-gen
        strategy:
            fail-fast: false
            matrix:
                sdk: [go, csharp, java, php, ruby, rust]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Setup Go
              if: matrix.sdk == 'go'
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              with:
                  go-version: "1.23"

            - name: Setup .NET
              if: matrix.sdk == 'csharp'
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
              with:
                  dotnet-version: "8.0.x"

            - name: Setup Java
              if: matrix.sdk == 'java'
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
              with:
                  distribution: "temurin"
                  java-version: "17"
                  cache: "maven"

            - name: Setup PHP
              if: matrix.sdk == 'php'
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
              with:
                  php-version: "8.2"

            - name: Setup Ruby
              if: matrix.sdk == 'ruby'
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
              with:
                  ruby-version: "3.2"

            - name: Setup Rust
              if: matrix.sdk == 'rust'
              run: rustup component add clippy rustfmt

            - name: Run lifecycle tests
              run: pnpm run test:sdk-${{ matrix.sdk }}

    deploy-preview-web:
        name: Deploy Web (Preview)
        runs-on: ubuntu-latest
        needs: apps
        concurrency:
            group: deploy-preview-web-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true
        # Merge-queue commits can contain PR-controlled code. Keep merge_group
        # for validation jobs, but never give it this job's Vercel credentials.
        if: >
            github.event_name == 'pull_request' &&
            (
                github.event.pull_request.head.repo.full_name == github.repository &&
                contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
            )
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Install Vercel CLI
              run: npm install --global vercel@latest

            - name: Deploy web to Vercel (preview)
              id: deploy
              timeout-minutes: 15
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
              if: ${{ env.VERCEL_PROJECT_ID != '' }}
              run: |
                  git_branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
                  vercel pull --yes --environment=preview --git-branch="$git_branch" --token=$VERCEL_TOKEN
                  preview_url="$(vercel deploy --yes --force --archive=tgz --build-env WEB_API_ORIGIN=https://phaseo.app --env WEB_API_ORIGIN=https://phaseo.app --token=$VERCEL_TOKEN)"
                  echo "url=$preview_url" >> "$GITHUB_OUTPUT"

            - name: Update pull request preview link
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
              if: ${{ github.event_name == 'pull_request' && steps.deploy.outputs.url != '' }}
              env:
                  PREVIEW_URL: ${{ steps.deploy.outputs.url }}
              with:
                  script: |
                    const marker = '<!-- phaseo-preview -->'
                    const body = `${marker}\n### Web preview\n\n[Open the latest preview](${process.env.PREVIEW_URL})\n\nCommit: \`${context.sha.slice(0, 7)}\``
                    const { data: comments } = await github.rest.issues.listComments({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                    })
                    const existing = comments.find((comment) => comment.body?.includes(marker))

                    if (existing) {
                      await github.rest.issues.updateComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        comment_id: existing.id,
                        body,
                      })
                    } else {
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                        body,
                      })
                    }

    deploy:
        runs-on: ubuntu-latest
        needs:
            - apps
            - check-paths
            - migrate-production
        if: >-
            always() &&
            github.ref == 'refs/heads/main' &&
            needs.apps.result == 'success' &&
            needs.check-paths.result == 'success' &&
            ((github.event_name == 'push' &&
            (needs.check-paths.outputs.migrations-changed != 'true' ||
            needs.migrate-production.result == 'success')) ||
            (github.event_name == 'workflow_dispatch' &&
            inputs.deploy_production == true))
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: web
                      name: Deploy Web
                    - target: api
                      name: Deploy API
                    - target: web-api
                      name: Deploy Web API
                    - target: mcp
                      name: Deploy MCP
                    - target: docs
                      name: Deploy Docs
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}

            # ---------- WEB (Vercel) ----------

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              if: matrix.target == 'web'
              run: corepack pnpm install --frozen-lockfile

            - name: Install Vercel CLI
              if: matrix.target == 'web'
              run: npm install --global vercel@latest

            - name: Deploy web to Vercel (production)
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              if: ${{ matrix.target == 'web' && env.VERCEL_PROJECT_ID != '' }}
              run: |
                  vercel pull --yes --environment=production --token=$VERCEL_TOKEN
                  vercel deploy --yes --archive=tgz --prod --logs --token=$VERCEL_TOKEN
            # ---------- API (Cloudflare Workers) ----------
            # Install deps so wrangler can resolve imports

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies (for Cloudflare Workers)
              if: matrix.target == 'api' || matrix.target == 'web-api' || matrix.target == 'mcp'
              run: corepack pnpm install --frozen-lockfile

            - name: Validate Cloudflare API deploy secrets
              if: matrix.target == 'api' || matrix.target == 'web-api' || matrix.target == 'mcp'
              shell: bash
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -euo pipefail
                  missing=()
                  [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && missing+=("CLOUDFLARE_API_TOKEN")
                  [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && missing+=("CLOUDFLARE_ACCOUNT_ID")
                  if [ "${#missing[@]}" -gt 0 ]; then
                    echo "::error::Missing required Cloudflare deploy secret(s): ${missing[*]}"
                    exit 1
                  fi

            - name: Validate wrangler.toml KV binding config
              if: matrix.target == 'api'
              shell: bash
              run: |
                  set -euo pipefail
                  cd apps/api
                  grep -q 'binding = "GATEWAY_CACHE"' wrangler.toml
                  if grep -q "REPLACE_WITH_KV_NAMESPACE" wrangler.toml; then
                    echo "::error::wrangler.toml still contains placeholder KV IDs"
                    cat wrangler.toml
                    exit 1
                  fi

            - name: Deploy API app to Cloudflare
              if: matrix.target == 'api'
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: apps/api

            - name: Deploy Web API Worker to Cloudflare
              if: matrix.target == 'web-api'
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: apps/web-api
                  command: deploy

            - name: Deploy MCP Worker to Cloudflare
              if: matrix.target == 'mcp'
              uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: apps/mcp
                  command: deploy --env production

            # ---------- DOCS ----------
            - name: Docs (Mintlify deploy is handled by GitHub App)
              if: matrix.target == 'docs'
              run: echo "Mintlify picks up main branch changes and deploys docs automatically."

    agent-sdk-tests:
        name: Agent SDK tests (${{ matrix.sdk }})
        runs-on: ubuntu-latest
        needs: sdk-gen
        if: github.event_name == 'push' || !startsWith(github.head_ref, 'chore/auto-model-statuses')
        strategy:
            fail-fast: false
            matrix:
                sdk: [ts, py, go, csharp, java, php, ruby, rust]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: ${{ env.NODE_VERSION }}
            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml
            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile
            - name: Setup Python
              if: matrix.sdk == 'py'
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
              with:
                  python-version: "3.12"
            - name: Install Python test tooling
              if: matrix.sdk == 'py'
              run: |
                  python -m pip install --upgrade pip pytest
                  python -m pip install -e packages/sdk/sdk-py -e packages/sdk/agent-sdk-py
            - name: Setup Go
              if: matrix.sdk == 'go'
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
              with:
                  go-version: "1.24"
            - name: Setup .NET
              if: matrix.sdk == 'csharp'
              uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
              with:
                  dotnet-version: "8.0.x"
            - name: Setup PHP
              if: matrix.sdk == 'php'
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
              with:
                  php-version: "8.2"
            - name: Setup Java
              if: matrix.sdk == 'java'
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
              with:
                  distribution: temurin
                  java-version: "17"
            - name: Setup Ruby
              if: matrix.sdk == 'ruby'
              uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
              with:
                  ruby-version: "3.2"
            - name: Setup Rust
              if: matrix.sdk == 'rust'
              run: rustup component add clippy rustfmt
            - name: Run Agent SDK tests
              run: pnpm run test:agent-sdk-${{ matrix.sdk }}
            - name: Check live smoke credentials
              id: live-smoke-credentials
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  PHASEO_API_KEY: ${{ secrets.PHASEO_API_KEY }}
              run: |
                  if [ -n "$PHASEO_API_KEY" ]; then
                    echo "available=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "available=false" >> "$GITHUB_OUTPUT"
                  fi
            - name: Run live GPT 5.6 Luna Agent SDK smoke
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.live-smoke-credentials.outputs.available == 'true'
              env:
                  PHASEO_AGENT_LIVE_SMOKE: "true"
                  PHASEO_API_KEY: ${{ secrets.PHASEO_API_KEY }}
              run: pnpm run test:agent-sdk-${{ matrix.sdk }}

    publish:
        name: Handle Versions
        runs-on: ubuntu-latest
        concurrency:
            group: sdk-release-publish
            cancel-in-progress: false
        needs:
            - sdk-gen
            - packages
            - sdk-lifecycle-tests
            - agent-sdk-tests
            - apps
        if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
        env:
            NPM_CONFIG_PROVENANCE: true
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  fetch-depth: 0

            - name: Create GitHub App token (Phaseo Bot)
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
              with:
                  client-id: ${{ secrets.PHASEO_APP_CLIENT_ID }}
                  private-key: ${{ secrets.PHASEO_APP_PRIVATE_KEY }}

            - name: Setup pnpm
              uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true
            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Check runtime versions (trusted publishing)
              run: |
                  node -v
                  npm -v

            - name: Restore lockfile (guard setup-node cache mutation)
              run: git checkout -- pnpm-lock.yaml

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Preflight publishable npm packages
              run: |
                  pnpm --filter @phaseo/cli run build
                  pnpm --filter @phaseo/agent-sdk run build
                  pnpm --filter @phaseo/sdk run build
                  pnpm --filter @phaseo/ai-sdk-provider run build
                  pnpm --filter @phaseo/devtools-viewer run build

            - name: Ensure SDK auto-release changeset
              env:
                  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
                  GITHUB_SHA: ${{ github.sha }}
              run: pnpm run changeset:ensure-sdk-autorelease

            - name: Validate SDK semver policy
              env:
                  GITHUB_EVENT_BEFORE: ${{ github.event.before }}
                  GITHUB_SHA: ${{ github.sha }}
              run: pnpm run changeset:validate-sdk-semver

            - name: Force pure OIDC npm auth context
              run: |
                  echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
                  echo "NPM_TOKEN=" >> "$GITHUB_ENV"
                  oidc_npmrc="$RUNNER_TEMP/oidc-only.npmrc"
                  printf "registry=https://registry.npmjs.org\nalways-auth=false\n" > "$oidc_npmrc"
                  echo "NPM_CONFIG_USERCONFIG=$oidc_npmrc" >> "$GITHUB_ENV"

            - name: Create release PR / publish
              id: changesets
              uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a
              with:
                  version: pnpm run changeset:version
                  publish: pnpm run changeset:publish
                  createGithubReleases: false
                  commitMode: github-api
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

            - name: Restore committed CLI release state
              run: git restore --source=HEAD --staged --worktree -- packages/cli/phaseo

            - name: Check CLI release status
              id: cli-npm-release
              run: |
                  node --input-type=module <<'NODE'
                  import fs from "node:fs";
                  import packageJson from "./packages/cli/phaseo/package.json" with { type: "json" };

                  const packagePath = encodeURIComponent(packageJson.name);
                  const versionPath = encodeURIComponent(packageJson.version);
                  const response = await fetch(`https://registry.npmjs.org/${packagePath}/${versionPath}`);

                  if (response.status !== 200 && response.status !== 404) {
                    throw new Error(`npm registry returned ${response.status} while checking ${packageJson.name}@${packageJson.version}`);
                  }

                  const shouldPublish = response.status === 404;
                  fs.appendFileSync(
                    process.env.GITHUB_OUTPUT,
                    `package=${packageJson.name}\nversion=${packageJson.version}\nshould_publish=${shouldPublish}\n`,
                  );

                  const status = shouldPublish ? "is missing from" : "already exists on";
                  console.log(`${packageJson.name}@${packageJson.version} ${status} npm`);
                  NODE

            - name: Publish CLI to npm
              if: steps.cli-npm-release.outputs.should_publish == 'true'
              run: pnpm --filter @phaseo/cli publish --access public --no-git-checks

            - name: Restore committed TypeScript SDK release state
              run: git restore --source=HEAD --staged --worktree -- packages/sdk/sdk-ts packages/sdk/agent-sdk-ts

            - name: Check TypeScript core SDK release status
              id: sdk-npm-release
              run: |
                  node --input-type=module <<'NODE'
                  import fs from "node:fs";
                  import packageJson from "./packages/sdk/sdk-ts/package.json" with { type: "json" };

                  const packagePath = encodeURIComponent(packageJson.name);
                  const versionPath = encodeURIComponent(packageJson.version);
                  const response = await fetch(`https://registry.npmjs.org/${packagePath}/${versionPath}`);

                  if (response.status !== 200 && response.status !== 404) {
                    throw new Error(`npm registry returned ${response.status} while checking ${packageJson.name}@${packageJson.version}`);
                  }

                  const shouldPublish = response.status === 404;
                  fs.appendFileSync(
                    process.env.GITHUB_OUTPUT,
                    `package=${packageJson.name}\nversion=${packageJson.version}\nshould_publish=${shouldPublish}\n`,
                  );

                  const status = shouldPublish ? "is missing from" : "already exists on";
                  console.log(`${packageJson.name}@${packageJson.version} ${status} npm`);
                  NODE

            - name: Publish TypeScript core SDK to npm
              if: steps.sdk-npm-release.outputs.should_publish == 'true'
              run: pnpm --filter @phaseo/sdk publish --access public --no-git-checks

            - name: Check TypeScript Agent SDK release status
              id: agent-sdk-npm-release
              run: |
                  node --input-type=module <<'NODE'
                  import fs from "node:fs";
                  import packageJson from "./packages/sdk/agent-sdk-ts/package.json" with { type: "json" };

                  const packagePath = encodeURIComponent(packageJson.name);
                  const versionPath = encodeURIComponent(packageJson.version);
                  const response = await fetch(`https://registry.npmjs.org/${packagePath}/${versionPath}`);

                  if (response.status !== 200 && response.status !== 404) {
                    throw new Error(`npm registry returned ${response.status} while checking ${packageJson.name}@${packageJson.version}`);
                  }

                  const shouldPublish = response.status === 404;
                  fs.appendFileSync(
                    process.env.GITHUB_OUTPUT,
                    `package=${packageJson.name}\nversion=${packageJson.version}\nshould_publish=${shouldPublish}\n`,
                  );

                  const status = shouldPublish ? "is missing from" : "already exists on";
                  console.log(`${packageJson.name}@${packageJson.version} ${status} npm`);
                  NODE

            - name: Publish TypeScript Agent SDK to npm
              if: steps.agent-sdk-npm-release.outputs.should_publish == 'true'
              run: pnpm --filter @phaseo/agent-sdk publish --access public --no-git-checks

            - name: Set up Python (for PyPI publish)
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
              with:
                  python-version: 3.12

            - name: Restore committed Python SDK release state
              run: git restore --source=HEAD --staged --worktree -- packages/sdk/sdk-py

            - name: Check Python SDK release status
              id: pypi-release
              shell: bash
              run: |
                  python - <<'PY'
                  import json
                  import os
                  import pathlib
                  import tomllib
                  import urllib.error
                  import urllib.parse
                  import urllib.request

                  pyproject_path = pathlib.Path("packages/sdk/sdk-py/pyproject.toml")
                  project = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))["project"]
                  package = project["name"]
                  version = project["version"]
                  url = f"https://pypi.org/pypi/{urllib.parse.quote(package)}/json"

                  try:
                      with urllib.request.urlopen(url, timeout=30) as response:
                          releases = json.load(response).get("releases", {})
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      releases = {}

                  should_publish = version not in releases
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      print(f"package={package}", file=output)
                      print(f"version={version}", file=output)
                      print(f"should_publish={str(should_publish).lower()}", file=output)

                  status = "is missing from" if should_publish else "already exists on"
                  print(f"{package} {version} {status} PyPI")
                  PY

            - name: Build Python SDK
              if: steps.pypi-release.outputs.should_publish == 'true'
              working-directory: packages/sdk/sdk-py
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install build
                  python -m build

            - name: Publish Python SDK to PyPI (Trusted Publishing)
              if: steps.pypi-release.outputs.should_publish == 'true'
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
              with:
                  packages-dir: packages/sdk/sdk-py/dist
                  skip-existing: true

            - name: Create GitHub releases from changelogs
              if: steps.changesets.outputs.published == 'true'
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
                  PHASEO_GH_RELEASE_MODE: all
              run: |
                  pnpm run release-from-changelogs
