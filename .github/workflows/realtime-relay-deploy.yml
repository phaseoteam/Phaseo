name: Realtime relay deploy

# Deploys phaseo-realtime, the realtime voice relay Worker. Deploying it ends
# every call it carries, so it never deploys on merge: run it inside an
# announced maintenance window, after the maintenance switch is on and live
# calls have ended (the deploy script checks both). See
# .agents/skills/realtime-maintenance.
on:
    workflow_dispatch:
        inputs:
            initial:
                description: "First deploy only: create phaseo-realtime before phaseo-gateway binds to it (skips the maintenance checks)"
                type: boolean
                default: false

concurrency:
    group: realtime-relay-deploy
    cancel-in-progress: false

permissions:
    contents: read

env:
    NODE_VERSION: 22

jobs:
    deploy:
        name: Deploy realtime relay
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

            - name: Setup pnpm
              uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
              with:
                  version: 10.33.0
                  run_install: false
                  standalone: true

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: Install dependencies
              run: corepack pnpm install --frozen-lockfile

            - name: Load gateway secrets from Infisical
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: oidc
                  identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: prod
                  secret-path: /gateway
                  include-imports: false
                  recursive: false

            - name: Load Google AI Studio key from Infisical
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: oidc
                  identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: prod
                  secret-path: /provider-keys
                  secret-name: GOOGLE_AI_STUDIO_API_KEY

            - name: Load xAI key from Infisical
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: oidc
                  identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: prod
                  secret-path: /provider-keys
                  secret-name: X_AI_API_KEY

            - name: Load ElevenLabs key from Infisical
              uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
              with:
                  method: oidc
                  identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
                  project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
                  env-slug: prod
                  secret-path: /provider-keys
                  secret-name: ELEVENLABS_API_KEY

            - name: Deploy phaseo-realtime
              shell: pwsh
              working-directory: apps/api
              env:
                  CLOUDFLARE_DEPLOY_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_DEPLOY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  if ("${{ inputs.initial }}" -eq "true") {
                      ./scripts/deploy-realtime.ps1 -SecretsFromEnvironment -Deploy -Initial
                  } else {
                      ./scripts/deploy-realtime.ps1 -SecretsFromEnvironment -Deploy
                  }
                  exit $LASTEXITCODE
