name: Publish Java SDKs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-sdk-java.yml"
      - "packages/sdk/sdk-java/package.json"
      - "packages/sdk/agent-sdk-java/package.json"
  pull_request:
    paths:
      - ".github/workflows/publish-sdk-java.yml"
      - "packages/sdk/sdk-java/**"
      - "packages/sdk/agent-sdk-java/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Expected core version (defaults to the committed version; Agent version comes from its manifest)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: java-sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-java:
    name: Validate Java release packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Test and package core and Agent SDKs
        run: |
          mvn -B -f packages/sdk/sdk-java/pom.xml install
          mvn -B -f packages/sdk/agent-sdk-java/pom.xml verify

  publish-java:
    needs: validate-java
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from refs/heads/main only."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/sdk/sdk-java/package.json').version")"
          if [ -n "${INPUT_VERSION:-}" ] && [ "${INPUT_VERSION}" != "${version}" ]; then
            echo "::error::Requested version ${INPUT_VERSION} does not match committed version ${version}."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          agent_version="$(node -p "require('./packages/sdk/agent-sdk-java/package.json').version")"
          if [[ ! "$agent_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Agent version: $agent_version"
            exit 1
          fi
          echo "agent=$agent_version" >> "$GITHUB_OUTPUT"

      - name: Check Maven Central release status
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.value }}
          AGENT_VERSION: ${{ steps.version.outputs.agent }}
        shell: bash
        run: |
          set -euo pipefail
          check_package() {
            local id="$1" artifact="$2" version="$3" status
            status="$(curl --retry 3 --retry-delay 5 --connect-timeout 10 --max-time 60 -sS -o /dev/null -w '%{http_code}' \
              "https://repo.maven.apache.org/maven2/app/phaseo/${artifact}/${version}/${artifact}-${version}.pom")"
            case "$status" in
              200) echo "${id}=false" >> "$GITHUB_OUTPUT" ;;
              404) echo "${id}=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Unexpected Maven Central response for ${artifact}: HTTP ${status}"; exit 1 ;;
            esac
            echo "app.phaseo:${artifact}:${version}: HTTP ${status}"
          }
          check_package should_publish phaseo-sdk "$VERSION"
          check_package agent_should_publish phaseo-agent-sdk "$AGENT_VERSION"

      - name: Validate telemetry literal matches publish version
        if: steps.registry.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const filePath = "packages/sdk/sdk-java/src/app/phaseo/sdk/Phaseo.java";
          const source = fs.readFileSync(filePath, "utf8");
          const match = source.match(/new TelemetryRecorder\(devtoolsConfig,\s*"([^"]+)"\)/);
          if (!match) {
            console.error(`::error::Unable to find telemetry version literal in ${filePath}.`);
            process.exit(1);
          }
          const actual = match[1];
          if (actual !== version) {
            console.error(`::error::Telemetry version mismatch in ${filePath}: expected ${version}, found ${actual}. Run pnpm run sdk:sync-language-manifests and commit the update before publishing.`);
            process.exit(1);
          }
          NODE

      - name: Check required secrets
        if: steps.registry.outputs.should_publish == 'true' || steps.registry.outputs.agent_should_publish == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${MAVEN_CENTRAL_USERNAME:-}" ] && missing+=("MAVEN_CENTRAL_USERNAME")
          [ -z "${MAVEN_CENTRAL_PASSWORD:-}" ] && missing+=("MAVEN_CENTRAL_PASSWORD")
          [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ] && missing+=("MAVEN_GPG_PRIVATE_KEY")
          [ -z "${MAVEN_GPG_PASSPHRASE:-}" ] && missing+=("MAVEN_GPG_PASSPHRASE")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Validate committed Maven versions and Agent attribution
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          AGENT_VERSION: ${{ steps.version.outputs.agent }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          for directory, expected in [("sdk-java", os.environ["VERSION"]), ("agent-sdk-java", os.environ["AGENT_VERSION"])]:
              pom = ET.parse(f"packages/sdk/{directory}/pom.xml").getroot()
              if pom.findtext("m:version", namespaces=ns) != expected:
                  raise SystemExit(f"{directory}: POM version does not match committed release metadata")
          if pom.findtext("m:properties/m:phaseo.sdk.version", namespaces=ns) != os.environ["VERSION"]:
              raise SystemExit("Java Agent SDK core dependency does not match core release version")
          source = Path("packages/sdk/agent-sdk-java/src/main/java/app/phaseo/agent/AgentSdk.java").read_text(encoding="utf-8")
          if f'"phaseo-agent-java", "{os.environ["AGENT_VERSION"]}"' not in source:
              raise SystemExit("Java Agent SDK attribution does not match release version")
          PY

      - name: Import GPG key
        if: steps.registry.outputs.should_publish == 'true' || steps.registry.outputs.agent_should_publish == 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if echo "$MAVEN_GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          else
            echo "$MAVEN_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          fi

      - name: Configure Maven credentials
        if: steps.registry.outputs.should_publish == 'true' || steps.registry.outputs.agent_should_publish == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Install core dependency for Agent packaging
        if: steps.registry.outputs.agent_should_publish == 'true'
        run: mvn -B -f packages/sdk/sdk-java/pom.xml -DskipTests install

      - name: Publish core SDK to Maven Central
        if: steps.registry.outputs.should_publish == 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -f packages/sdk/sdk-java/pom.xml -Prelease -DskipTests -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy

      - name: Publish Agent SDK to Maven Central
        if: steps.registry.outputs.agent_should_publish == 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -f packages/sdk/agent-sdk-java/pom.xml -Prelease -DskipTests -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy
