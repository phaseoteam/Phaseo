name: Publish Java SDK

on:
  push:
    branches:
      - main
    paths:
      - "packages/sdk/sdk-java/package.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to packages/sdk/sdk-java/package.json version)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish-java:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from refs/heads/main only."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/sdk/sdk-java/package.json').version")"
          if [ -n "${INPUT_VERSION:-}" ] && [ "${INPUT_VERSION}" != "${version}" ]; then
            echo "::error::Requested version ${INPUT_VERSION} does not match committed version ${version}."
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Check Maven Central release status
        id: registry
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="https://repo1.maven.org/maven2/app/phaseo/phaseo-sdk/${VERSION}/phaseo-sdk-${VERSION}.pom"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "$artifact")"
          case "$status" in
            200)
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
              echo "app.phaseo:phaseo-sdk:${VERSION} already exists on Maven Central."
              ;;
            404)
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
              echo "app.phaseo:phaseo-sdk:${VERSION} is missing from Maven Central."
              ;;
            *)
              echo "::error::Unexpected Maven Central response: HTTP ${status}"
              exit 1
              ;;
          esac

      - name: Validate telemetry literal matches publish version
        if: steps.registry.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const filePath = "packages/sdk/sdk-java/src/app/phaseo/sdk/Phaseo.java";
          const source = fs.readFileSync(filePath, "utf8");
          const match = source.match(/new TelemetryRecorder\(devtoolsConfig,\s*"([^"]+)"\)/);
          if (!match) {
            console.error(`::error::Unable to find telemetry version literal in ${filePath}.`);
            process.exit(1);
          }
          const actual = match[1];
          if (actual !== version) {
            console.error(`::error::Telemetry version mismatch in ${filePath}: expected ${version}, found ${actual}. Run pnpm run sdk:sync-language-manifests and commit the update before publishing.`);
            process.exit(1);
          }
          NODE

      - name: Check required secrets
        if: steps.registry.outputs.should_publish == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "${MAVEN_CENTRAL_USERNAME:-}" ] && missing+=("MAVEN_CENTRAL_USERNAME")
          [ -z "${MAVEN_CENTRAL_PASSWORD:-}" ] && missing+=("MAVEN_CENTRAL_PASSWORD")
          [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ] && missing+=("MAVEN_GPG_PRIVATE_KEY")
          [ -z "${MAVEN_GPG_PASSPHRASE:-}" ] && missing+=("MAVEN_GPG_PASSPHRASE")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Validate committed pom version
        if: steps.registry.outputs.should_publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          pom = Path("packages/sdk/sdk-java/pom.xml")
          source = pom.read_text(encoding="utf-8")
          pattern = re.compile(r"(<artifactId>phaseo-sdk</artifactId>\s*[\r\n]+\s*<version>)([^<]+)(</version>)", re.MULTILINE)
          match = pattern.search(source)
          if not match:
              raise SystemExit("Unable to find phaseo-sdk version in pom.xml")
          if match.group(2) != version:
              raise SystemExit(
                  f"Committed pom version {match.group(2)} does not match release version {version}"
              )
          PY

      - name: Import GPG key
        if: steps.registry.outputs.should_publish == 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if echo "$MAVEN_GPG_PRIVATE_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          else
            echo "$MAVEN_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          fi

      - name: Configure Maven credentials
        if: steps.registry.outputs.should_publish == 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        shell: bash
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Build and publish to Maven Central
        if: steps.registry.outputs.should_publish == 'true'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -f packages/sdk/sdk-java/pom.xml test
          mvn -B -f packages/sdk/sdk-java/pom.xml -DskipTests verify
          mvn -B -f packages/sdk/sdk-java/pom.xml -Prelease -DskipTests -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" deploy
