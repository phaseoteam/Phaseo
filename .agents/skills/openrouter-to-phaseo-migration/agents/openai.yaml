interface:
  display_name: "OpenRouter to Phaseo Migration"
  short_description: "Move an OpenRouter integration to Phaseo"
  brand_color: "#0069A8"
  default_prompt: "Use $openrouter-to-phaseo-migration to migrate this integration from OpenRouter to Phaseo."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "phaseo-docs"
      description: "Phaseo documentation search"
      transport: "streamable_http"
      url: "https://phaseo.app/docs/mcp"
